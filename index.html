<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 8 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>8 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un centre équestre embauche une AE tout juste diplômée comme seule salariée éducatrice sportive de l'établissement : aucun titulaire d'un diplôme de niveau IV (BPJEPS, DE...) n'intervient, même ponctuellement, dans la structure. Le gérant, non éducateur sportif lui-même, lui demande d'assurer seule l'intégralité de l'enseignement, de l'initiation à la préparation aux examens fédéraux. Est-ce réglementaire ?",
    choices: [
      "Oui : une fois le titre obtenu, l'AE enseigne en toute autonomie, la condition d'autorité pédagogique d'un niveau IV ne s'appliquant qu'aux stagiaires encore en formation",
      "Non : le titre professionnel Animateur d'Équitation prévoit que l'enseignement des activités équestres s'exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus ; cette condition reste attachée au titre lui-même, la structure doit donc s'assurer qu'un tel titulaire encadre ou supervise effectivement l'activité, même une fois l'AE diplômée",
      "Oui, à condition que le gérant signe une décharge précisant qu'il assume seul la responsabilité pédagogique de la structure",
      "Non, mais uniquement parce qu'aucun établissement ne peut légalement n'employer qu'un seul salarié"
    ],
    correct: 1,
    expl: "Le titre professionnel Animateur d'Équitation (niveau 3 RNCP) permet d'initier et d'encadrer tous publics, mais <strong>sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, DEJEPS...) dans les activités équestres — une condition structurelle attachée au titre lui-même, non limitée à la période de formation. Une structure ne peut donc pas fonctionner avec pour seul encadrant un AE sans aucun lien, même de supervision, avec un diplômé de niveau IV."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une AE est sollicitée un dimanche pour « juste surveiller » un groupe d'enfants lors d'un anniversaire à poney : mener les poneys en longe, veiller à la sécurité, sans dispenser de véritable cours technique. La prestation est rémunérée. Le club estime qu'aucune déclaration d'activité n'est nécessaire puisqu'il ne s'agit pas d'« enseignement » au sens strict. A-t-il raison ?",
    choices: [
      "Oui, seul l'enseignement technique structuré (progression, correction des postures...) est soumis à déclaration ; la simple surveillance ou l'animation en est dispensée",
      "Non : l'obligation de qualification et de déclaration du Code du sport (art. L.212-1 et L.212-11) vise toute personne qui, contre rémunération, encadre, anime ou entraîne une activité physique ou sportive — pas seulement celle qui « enseigne » au sens strict ; l'animation payante d'un groupe reste soumise à ces obligations",
      "Oui, car les prestations d'anniversaire relèvent de l'animation événementielle, un secteur non couvert par le Code du sport",
      "Non, mais uniquement si un mineur de moins de 6 ans participe à l'anniversaire"
    ],
    correct: 1,
    expl: "L'article <strong>L.212-1 du Code du sport</strong> soumet à l'obligation de qualification (et de déclaration, art. L.212-11) toute personne qui, contre rémunération, <strong>forme, dirige, encadre, anime ou entraîne</strong> les pratiquants d'une activité physique ou sportive — une formulation qui couvre largement l'animation et l'encadrement, pas seulement l'enseignement technique formalisé. Exercer sans déclaration expose à des sanctions (art. L.212-12), quelle que soit la nature exacte de la prestation rémunérée."
  },
  {
    theme: "🩺 Santé / Aptitude",
    q: "Une cavalière renouvelle sa licence FFE. Elle répond NON à toutes les questions du questionnaire de santé « QS-SPORT » qui lui est remis. Doit-elle malgré tout fournir un certificat médical pour que son renouvellement soit validé ?",
    choices: [
      "Oui, un certificat médical reste obligatoire chaque année, le questionnaire de santé n'étant qu'un complément facultatif",
      "Non : répondre NON à toutes les questions du questionnaire de santé dispense de produire un certificat médical pour ce renouvellement ; seule une réponse OUI à une question impose de consulter un médecin et de fournir un certificat",
      "Non, le questionnaire de santé remplace définitivement et pour toujours le certificat médical, quelles que soient les réponses données les années suivantes",
      "Oui, mais uniquement si elle a plus de 18 ans, les mineurs étant dispensés de toute formalité médicale"
    ],
    correct: 1,
    expl: "Depuis l'arrêté du 20 avril 2017, le renouvellement d'une licence sportive peut s'appuyer sur le <strong>questionnaire de santé « QS-SPORT »</strong> : si le licencié répond NON à toutes les questions, aucun certificat médical n'est exigé pour ce renouvellement. Une seule réponse OUI impose en revanche de consulter un médecin et de fournir un certificat médical de non contre-indication. Ce dispositif ne dispense pas définitivement : un certificat reste périodiquement requis, notamment lors de la première licence."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "En manipulant du matériel, un cavalier se blesse profondément à l'avant-bras sur une pointe métallique et saigne abondamment, le sang continuant à s'écouler malgré le tissu que tu presses dessus. Après avoir alerté les secours, quelle est la conduite à privilégier ?",
    choices: [
      "Retirer immédiatement le tissu imbibé de sang et le remplacer par un tissu propre à chaque fois qu'il se sature, pour vérifier l'évolution de la plaie",
      "Maintenir une compression manuelle directe ferme et continue sur la plaie sans la relâcher ; si elle s'avère impossible à maintenir ou clairement inefficace, envisager la pose d'un garrot en amont de la plaie, jamais sur une articulation",
      "Surélever le bras au-dessus de la tête et laisser saigner librement quelques minutes pour que la plaie « s'auto-nettoie » avant de comprimer",
      "Poser d'emblée un garrot serré, geste systématique et prioritaire face à toute hémorragie externe, avant même d'envisager une compression manuelle"
    ],
    correct: 1,
    expl: "Le geste de référence face à une hémorragie externe est la <strong>compression manuelle directe</strong>, maintenue sans relâche (on ne retire jamais un pansement imbibé, on en rajoute par-dessus). Le <strong>garrot</strong> n'est utilisé qu'en second recours, si la compression est impossible ou inefficace, posé entre la plaie et le cœur, jamais sur une articulation. Retirer le tissu ou laisser saigner aggrave la perte sanguine et retarde le contrôle de l'hémorragie."
  },
  {
    theme: "📞 Protocole d'alerte",
    q: "Lors d'une sortie, un cavalier chute et se blesse. Un parent accompagnateur, sourd et malentendant, propose d'alerter lui-même les secours pendant que tu portes assistance à la victime. Peut-il contacter directement un numéro d'urgence malgré son handicap auditif, et lequel ?",
    choices: [
      "Non, il ne peut pas alerter lui-même les secours ; il doit obligatoirement passer par une tierce personne entendante pour téléphoner au 15",
      "Oui, en composant le 114, service d'urgence dédié aux personnes sourdes, malentendantes ou aphasiques, accessible par SMS, tchat, fax ou visiophonie, qui relaie l'alerte vers le SAMU, les pompiers ou la police/gendarmerie",
      "Oui, mais uniquement en envoyant un simple SMS au 15, numéro du SAMU, nativement compatible avec les échanges par texte",
      "Non, aucun dispositif spécifique n'existe en France pour les personnes sourdes ou malentendantes face à une urgence"
    ],
    correct: 1,
    expl: "Le <strong>114</strong> est le numéro d'urgence national gratuit, accessible <strong>24h/24 par SMS, tchat, fax ou visiophonie</strong>, dédié aux personnes sourdes, sourdaveugles, malentendantes ou aphasiques : il permet de contacter directement SAMU, pompiers, police ou gendarmerie sans passer par un tiers entendant. Le 15 classique n'est pas conçu pour un échange par texte."
  },
  {
    theme: "📋 Construction de séance",
    q: "Un cavalier qui se déplace avec une légère difficulté motrice (rééducation d'une entorse de cheville, aucune contre-indication médicale à l'équitation) rejoint pour la première fois ton groupe habituel. Ta fiche de séance, préparée à l'avance, ne prévoit aucune adaptation. Que fais-tu ?",
    choices: [
      "Tu appliques la séance prévue à l'identique : modifier une fiche de séance déjà rédigée remettrait en cause la préparation pédagogique",
      "Tu ajustes la fiche de séance en tenant compte de cette caractéristique du public — exercices à pied limités, aide au montoir, choix d'exercices montés compatibles — sans exclure le cavalier ni l'exposer à un risque inadapté à sa condition",
      "Tu demandes au cavalier de rester spectateur ce jour-là, par précaution, sans lui proposer d'alternative adaptée",
      "Tu le places uniquement en longe, seule solution possible face à toute limitation physique, quelle que soit sa nature"
    ],
    correct: 1,
    expl: "La construction d'une séance sécurisée impose de <strong>prendre en compte les caractéristiques du public</strong> réellement présent, y compris des situations non anticipées à l'écrit. Une fiche de séance n'est pas figée : l'AE doit savoir l'adapter (aide au montoir, choix des exercices, vigilance accrue) pour intégrer le cavalier en sécurité, plutôt que l'exclure par excès de prudence ou au contraire ignorer sa situation."
  },
  {
    theme: "🩺 Santé / Accueil du public",
    q: "Un enfant de 8 ans est déposé pour un stage par un adulte pressé, sans qu'aucune fiche sanitaire de liaison (allergies, traitement en cours, personne à prévenir en cas d'urgence) n'ait été remplie ni transmise à la structure. Le stage doit débuter dans 10 minutes. Que fait l'AE ?",
    choices: [
      "Il démarre la séance comme prévu : la fiche sanitaire pourra être complétée en fin de journée, au moment où les parents reviennent chercher l'enfant",
      "Il s'assure, avant toute mise à cheval, qu'une fiche sanitaire de liaison complète est obtenue (contact d'urgence, allergies, traitements, aptitude) — au besoin en contactant immédiatement le responsable légal — l'accueil d'un mineur ne pouvant reposer sur une information sanitaire absente",
      "Il fait remplir la fiche par l'enfant lui-même, dont la parole est juridiquement suffisante pour engager la structure",
      "Il refuse catégoriquement tout accueil de mineur sans fiche sanitaire préalable, y compris pour une simple observation du groupe en attendant que la fiche soit transmise"
    ],
    correct: 1,
    expl: "L'accueil d'un mineur en toute sécurité suppose de disposer des informations sanitaires essentielles avant la pratique — <strong>personne à prévenir, allergies, traitement en cours</strong> — une base rappelée par les recommandations d'accueil de mineurs et par la responsabilité de l'encadrant. Faute de fiche, l'AE doit obtenir ces informations sans délai (contact du responsable légal) avant toute mise en selle, plutôt que de différer ce contrôle ou de s'en remettre à la seule parole de l'enfant."
  },
  {
    theme: "🛡️ Sécurité / Assurance",
    q: "Un cavalier fait une chute pendant un cours collectif et se fracture le poignet. Ses parents demandent si l'assurance de responsabilité civile souscrite par le club suffit à couvrir les frais liés à la blessure de leur enfant.",
    choices: [
      "Oui, l'assurance de responsabilité civile du club couvre systématiquement tous les dommages corporels subis par un pratiquant, quelle que soit l'origine de l'accident",
      "Non : l'assurance de responsabilité civile obligatoire du club (art. L.321-1 du Code du sport) couvre la responsabilité de la structure et de ses préposés envers les tiers, mais ne se substitue pas à une assurance individuelle accident du pratiquant ; les licenciés doivent être informés de l'intérêt de souscrire de telles garanties complémentaires",
      "Non, car les groupements sportifs n'ont aucune obligation légale de souscrire une quelconque assurance",
      "Oui, mais uniquement si le club est reconnu responsable de la chute, ce qui est automatiquement le cas pour toute chute survenue pendant un cours"
    ],
    correct: 1,
    expl: "L'article <strong>L.321-1 du Code du sport</strong> impose aux groupements sportifs (associations, clubs...) de souscrire une <strong>assurance de responsabilité civile</strong> couvrant leur propre responsabilité, celle de leurs préposés et celle des pratiquants entre eux — mais cette garantie ne joue que si une responsabilité est engagée, et ne couvre pas automatiquement les dommages corporels subis sans faute identifiée. C'est pourquoi les fédérations informent leurs licenciés de l'intérêt de souscrire une <strong>assurance individuelle accident</strong>, distincte et complémentaire."
  },
  {
    theme: "📋 Construction de séance / Sécurité du lieu",
    q: "Avant de démarrer ta séance, tu remarques qu'une planche de la barrière d'un obstacle est fendue et laisse dépasser un clou, dans la zone où le groupe doit évoluer. Les cavaliers, déjà en selle, attendent le début du cours. Que fais-tu ?",
    choices: [
      "Tu démarres la séance à l'heure prévue en demandant simplement aux cavaliers de contourner cette zone, pour ne pas perdre de temps sur le créneau réservé",
      "Tu sécurises la zone avant toute chose — retrait de l'obstacle dangereux ou du clou, délimitation claire de la zone si besoin — quitte à décaler le début ou adapter le contenu de la séance ; la vérification de la sécurité du lieu de pratique est un préalable non négociable",
      "Tu laisses le premier cavalier qui passera à proximité te signaler lui-même le danger, ce qui te permettra de réagir au bon moment",
      "Tu démontes l'obstacle uniquement à la fin de la séance, pour ne pas interrompre le déroulement prévu de la fiche de séance"
    ],
    correct: 1,
    expl: "La sécurité du lieu de pratique fait partie intégrante de la préparation d'une séance : un danger identifié (clou apparent, matériel dégradé) doit être <strong>neutralisé avant toute mise en activité</strong>, même si cela impose de décaler ou d'adapter la séance prévue. Reporter le contrôle à un cavalier ou à la fin du cours expose le groupe à un risque de blessure évitable et engage la responsabilité de l'encadrant."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Une forte odeur de fumée se dégage soudain de la sellerie attenante à l'écurie où tu donnes ta séance ; tu aperçois des flammes naissantes près du tableau électrique. Des chevaux sont dans les boxes voisins. Quelle est ta priorité immédiate ?",
    choices: [
      "Tenter seul d'éteindre le feu avec les moyens disponibles avant toute autre action, pour éviter que l'incendie ne se propage",
      "Faire évacuer immédiatement les personnes et, si cela reste possible sans te mettre en danger, les chevaux menacés, donner l'alerte aux pompiers (18 ou 112), et ne t'approcher du foyer que si un moyen d'extinction est à portée et le risque maîtrisable — sans jamais t'exposer inutilement",
      "Continuer ta séance comme prévu pendant que quelqu'un d'autre s'occupe éventuellement du problème, l'incendie ne relevant pas de ta responsabilité pédagogique",
      "Ouvrir en premier lieu toutes les portes et fenêtres du bâtiment pour évacuer la fumée avant de t'occuper des personnes et des chevaux"
    ],
    correct: 1,
    expl: "Face à un départ de feu, la logique <strong>Protéger, Alerter, Secourir</strong> s'applique : écarter sans délai les personnes du danger (et les animaux si cela reste possible sans risque), donner l'alerte aux services de secours (<strong>18</strong> pompiers ou <strong>112</strong> numéro d'urgence européen), et ne tenter une extinction que si elle est possible sans se mettre soi-même en danger. Ouvrir portes et fenêtres avant d'évacuer peut au contraire attiser le feu en apportant de l'air."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
