<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 30 juillet 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>30 juillet 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le responsable du centre équestre te demande d'encadrer seul(e), pendant son absence, une séance pour un groupe de cavaliers confirmés qui préparent une compétition de niveau Amateur. Aucun titulaire de diplôme de niveau IV (BPJEPS, BEES, DE) n'est présent sur la structure ce jour-là. Que dois-tu faire ?",
    choices: [
      "Accepter : l'AE est un titre reconnu par l'État qui autorise à encadrer seul dès lors que le public est confirmé",
      "Refuser d'assurer seul(e) cette séance : l'AE agit sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, et son périmètre exclut l'encadrement des pratiques compétitives de niveau Amateur et au-delà",
      "Accepter, à condition de faire signer une décharge de responsabilité aux cavaliers présents",
      "Accepter uniquement si la séance n'est pas rémunérée, la rémunération étant le seul critère qui encadre l'action de l'AE"
    ],
    correct: 1,
    expl: "Le titre d'<strong>Animateur d'Équitation</strong> délivré par la FFE permet d'initier et d'animer sous l'<strong>autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, BEES, DE/DES), et exclut explicitement l'encadrement des pratiques compétitives de niveau Amateur et supérieur. L'absence du diplômé référent ne se comble pas avec une décharge : le périmètre de l'AE est fixé par le référentiel du titre lui-même, indépendamment de la rémunération."
  },
  {
    theme: "📋 EPMSP",
    q: "Une stagiaire en formation FFE demande : « À quoi sert exactement l'EPMSP, puisque ce n'est pas un diplôme ? » Quelle est la réponse réglementairement exacte ?",
    choices: [
      "L'EPMSP valide le niveau technique équestre (Galops) du stagiaire avant qu'il ne commence sa formation",
      "L'EPMSP certifie que le stagiaire possède les compétences de sécurité (vis-à-vis des pratiquants et des tiers) suffisantes pour être placé sous l'autorité d'un tuteur en situation pédagogique, avant l'obtention du diplôme",
      "L'EPMSP autorise le stagiaire à enseigner seul et sans tuteur dès sa validation",
      "L'EPMSP remplace l'obligation d'assurance en responsabilité civile de la structure"
    ],
    correct: 1,
    expl: "L'article <strong>R.212-1 du Code du sport</strong> précise que les personnes en formation peuvent exercer contre rémunération des fonctions d'enseignement sous l'<strong>autorité d'un tuteur</strong>, à condition d'avoir satisfait aux <strong>Exigences Préalables à la Mise en Situation Pédagogique (EPMSP)</strong>. Celles-ci portent sur la sécurité, l'hygiène et la réglementation — pas sur le niveau équestre — et ne dispensent jamais du tutorat tant que le diplôme n'est pas obtenu."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Pendant une séance en carrière, un cavalier chute et reste inconscient au sol ; son poney, affolé, continue de circuler librement à proximité du blessé. Quel enchaînement d'actions dois-tu suivre ?",
    choices: [
      "Appeler immédiatement le 15, puis t'occuper du cheval, puis examiner le cavalier",
      "Protéger d'abord (maîtriser ou écarter le poney, sécuriser la zone), alerter ensuite les secours, secourir la victime, puis la surveiller jusqu'à l'arrivée des secours",
      "Placer immédiatement la victime en position latérale de sécurité avant toute autre chose, le cheval n'étant pas prioritaire",
      "Attendre l'arrivée d'un moniteur diplômé avant d'intervenir, l'AE n'étant pas habilité à agir seul en cas d'accident"
    ],
    correct: 1,
    expl: "La règle de référence est <strong>P.A.S. (Protéger – Alerter – Secourir)</strong>, complétée par la surveillance de la victime jusqu'à l'arrivée des secours. Ici, le risque de sur-accident vient du cheval en liberté près du blessé : il faut sécuriser la zone en premier, avant d'alerter puis de porter secours. Ne jamais rester passif en attendant un tiers diplômé : la sécurité immédiate relève de toute personne présente sur les lieux."
  },
  {
    theme: "📞 Numéros d'urgence",
    q: "La Formation Internationale du Haras de la Cense accueille des stagiaires venus de plusieurs pays européens. L'une d'elles te demande si elle peut composer un numéro d'urgence qu'elle connaît de son pays d'origine si un accident survient en France. Que lui réponds-tu ?",
    choices: [
      "Non, seuls les numéros français 15/17/18 fonctionnent en France, elle devra les mémoriser",
      "Oui : le 112 est le numéro d'urgence unique valable dans tous les pays de l'Union européenne, il fonctionne en France en complément des 15 (SAMU), 17 (Police) et 18 (Pompiers)",
      "Oui, mais uniquement depuis un téléphone fixe et jamais depuis un mobile étranger",
      "Non, le 112 est réservé aux services vétérinaires d'urgence"
    ],
    correct: 1,
    expl: "Le <strong>112</strong> est le numéro d'appel d'urgence unique européen, joignable gratuitement dans tous les États membres de l'UE, y compris depuis un mobile. Il vient en complément des numéros nationaux français (15 SAMU, 17 Police-Gendarmerie, 18 Pompiers) et non à leur place."
  },
  {
    theme: "🩺 Santé / Certificat médical",
    q: "Un cavalier présente son certificat médical pour sa première licence FFE. Que garantit exactement ce document ?",
    choices: [
      "Une aptitude physique totale et sans réserve à la compétition, validée par un électrocardiogramme systématique",
      "L'absence de contre-indication décelée à l'examen clinique du jour, sous réserve de la sincérité des réponses données par le cavalier à l'interrogatoire — ce n'est pas un certificat d'aptitude",
      "Une couverture d'assurance en responsabilité civile pour le cavalier",
      "Que le cavalier n'a jamais eu d'accident équestre dans les cinq dernières années"
    ],
    correct: 1,
    expl: "Le certificat porte précisément le nom de <strong>« certificat de non contre-indication »</strong> et non « certificat d'aptitude » : le médecin atteste l'absence de contre-indication décelée lors d'un examen clinique ponctuel, sur la base des réponses données par le patient à l'interrogatoire. Il ne garantit ni une aptitude cardiaque à l'effort ni une couverture d'assurance, qui relèvent d'obligations distinctes."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Une bénévole se blesse profondément à la main sur un fil de clôture en réparant un paddock ; la plaie saigne abondamment. Quelle est la conduite à tenir ?",
    choices: [
      "Lui donner à boire pour compenser la perte de sang en attendant les secours",
      "Comprimer immédiatement la plaie avec la paume de la main (en se protégeant : gant, tissu, sac plastique), allonger la victime, faire alerter les secours, et maintenir la compression jusqu'à leur arrivée",
      "Poser un garrot serré au-dessus de la plaie avant toute autre chose, c'est le geste réflexe le plus sûr",
      "La laisser debout pour qu'elle ne perde pas connaissance, la position allongée favorisant le saignement"
    ],
    correct: 1,
    expl: "En cas d'hémorragie, il faut <strong>comprimer immédiatement la plaie</strong> (avec protection pour l'intervenant), <strong>allonger</strong> la victime, faire alerter les secours et maintenir la compression jusqu'à leur arrivée. Il ne faut <strong>jamais</strong> donner à boire à une victime d'hémorragie, ni poser un garrot en premier réflexe (geste dangereux réservé à des cas exceptionnels), ni la laisser debout."
  },
  {
    theme: "📋 Construction de séance",
    q: "Tu prépares ta fiche de séance pour l'épreuve EPMSP. Quels éléments sont exigés par le protocole de certification ?",
    choices: [
      "Uniquement un déroulé technique des exercices équestres, sans autre document",
      "Au moins 3 situations d'apprentissage pour une intervention de 15 minutes, accompagnées d'une analyse succincte des éléments de sécurité relatifs au lieu de pratique, aux caractéristiques du public et à l'activité",
      "Le règlement intérieur complet de la structure et le plan de financement du club",
      "La liste de tous les diplômes des encadrants du centre équestre, quelle que soit la séance"
    ],
    correct: 1,
    expl: "L'épreuve EPMSP repose sur une <strong>fiche de séance</strong> comportant au minimum 3 situations d'apprentissage pour une intervention de 15 minutes, assortie d'une <strong>fiche d'analyse des éléments de sécurité</strong> tenant compte du lieu de pratique, des caractéristiques du public et de l'activité — suivie d'une mise en œuvre partielle de la séance et d'un entretien avec le jury."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un ami cavalier confirmé, non diplômé, propose d'accompagner bénévolement une sortie poney au club, sans jamais être payé pour cela. Est-ce légal ?",
    choices: [
      "Non : tout encadrement, même bénévole et gratuit, exige un diplôme reconnu par l'État",
      "Oui : l'encadrement bénévole ne nécessite pas de diplôme obligatoire ; c'est dès qu'il y a rémunération — même occasionnelle ou secondaire — que la détention d'un diplôme, titre ou certificat de qualification devient obligatoire (art. L212-1 du Code du sport)",
      "Oui, à condition qu'il ait au minimum le Galop 7",
      "Non, sauf s'il exerce moins de deux heures par semaine"
    ],
    correct: 1,
    expl: "L'article <strong>L.212-1 du Code du sport</strong> impose un diplôme uniquement pour enseigner, animer ou encadrer <strong>contre rémunération</strong>, à titre principal ou secondaire, de façon habituelle, saisonnière ou occasionnelle. L'encadrement bénévole dans un club affilié à une fédération n'est pas soumis à cette obligation de diplôme, même si les fédérations encouragent la formation de leurs bénévoles."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier chute et reste inconscient, mais il respire normalement et ne présente pas de vomissement. Que fais-tu, en plus d'avoir fait alerter les secours ?",
    choices: [
      "Tu le places en Position Latérale de Sécurité (PLS), pour libérer ses voies aériennes et éviter qu'il ne s'étouffe s'il venait à vomir, puis tu le surveilles jusqu'à l'arrivée des secours",
      "Tu le maintiens strictement sur le dos sans le toucher, en attendant les secours, quelle que soit sa respiration",
      "Tu le redresses en position assise pour l'aider à mieux respirer",
      "Tu lui fais boire un peu d'eau sucrée pour le ranimer"
    ],
    correct: 0,
    expl: "La <strong>Position Latérale de Sécurité</strong> s'applique à toute victime <strong>inconsciente qui respire</strong> : elle prévient l'étouffement par la langue ou par des vomissements. La laisser sur le dos l'expose à un risque d'obstruction des voies aériennes ; la redresser assise ou lui faire boire quoi que ce soit sont des gestes proscrits chez une personne inconsciente."
  },
  {
    theme: "📋 Construction de séance",
    q: "Tu prépares une séance de découverte pour un groupe de 6 enfants de 8 ans, dont un enfant présentant un trouble de l'attention. Comment traiter cette particularité dans ta fiche de séance EPMSP ?",
    choices: [
      "Ne rien mentionner de spécifique, pour ne pas stigmatiser l'enfant, et dérouler une séance strictement identique pour tout le groupe",
      "Adapter les situations d'apprentissage et l'organisation de l'espace aux caractéristiques du public (consignes courtes et répétées, surveillance renforcée, poney adapté) et faire figurer cette analyse de risque spécifique dans la fiche de séance",
      "Refuser d'accueillir cet enfant tant qu'un professionnel médical n'est pas présent sur place",
      "Confier cet enfant à un parent accompagnateur pendant toute la durée de la séance, sans autre adaptation"
    ],
    correct: 1,
    expl: "L'EPMSP exige explicitement que <strong>les caractéristiques du public soient prises en compte dans la préparation des séances</strong> et que la fiche d'analyse de sécurité en tienne compte. Adapter les consignes, l'espace et la surveillance — sans exclure l'enfant ni délester sa responsabilité pédagogique sur un tiers — est la réponse attendue d'un animateur garant de la sécurité de tous ses pratiquants."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
