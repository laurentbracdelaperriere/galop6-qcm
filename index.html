<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 14 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>14 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une AE encadre un groupe de cavaliers confirmés (niveau Galop 6/7), qu'elle juge autonomes du fait de leur niveau technique. Le responsable de la structure est absent toute la matinée et n'a laissé aucun encadrant diplômé de niveau IV ou plus présent pour cette séance.",
    choices: [
      "C'est conforme : à partir du Galop 6/7, les cavaliers sont considérés comme autonomes, ce qui dispense l'AE de toute autorité pédagogique supérieure",
      "Ce n'est pas conforme : quel que soit le niveau technique des cavaliers encadrés, l'AE exerce son activité sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, présent sur la structure — le niveau des pratiquants ne crée pas de dérogation à ce cadre",
      "C'est conforme, dès lors que l'AE justifie de plusieurs années d'expérience personnelle en compétition",
      "Ce n'est pas conforme, mais uniquement si un accident survient effectivement pendant la séance"
    ],
    correct: 1,
    expl: "Le cadre d'exercice de l'AE repose sur l'<strong>autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus (BPJEPS, DEJEPS...), présent sur la structure. Ce cadre ne dépend ni du niveau technique des cavaliers encadrés, ni de l'expérience personnelle de l'AE en compétition, ni de la survenue effective d'un incident : l'absence de supervision qualifiée est non conforme en elle-même, dès l'instant de la séance."
  },
  {
    theme: "🚨 Conduite à tenir – Hémorragie",
    q: "En manipulant du matériel, un stagiaire se coupe profondément la paume de la main sur un outil tranchant resté dans le local du matériel. La plaie saigne abondamment et de façon continue.",
    choices: [
      "L'AE nettoie d'abord la plaie à l'eau pour « voir sa profondeur » avant de faire quoi que ce soit d'autre",
      "L'AE comprime fermement la plaie avec un tissu propre ou un pansement compressif, installe la victime, alerte le 15/112 en décrivant l'hémorragie, et maintient la compression sans interruption jusqu'à l'arrivée des secours",
      "L'AE surélève simplement la main sans exercer de compression, estimant que cela suffit à ralentir le saignement",
      "L'AE applique un garrot serré au poignet dès les premières secondes, par précaution"
    ],
    correct: 1,
    expl: "Face à une hémorragie externe abondante, le geste prioritaire est la <strong>compression directe et continue</strong> de la plaie, associée à l'alerte immédiate du 15/112. La compression manuelle doit être maintenue sans relâche jusqu'aux secours. Nettoyer la plaie avant d'agir retarde le geste qui sauve, l'élévation seule sans compression est insuffisante, et le garrot est un geste exceptionnel réservé aux hémorragies non contrôlables autrement, non un réflexe de premier recours."
  },
  {
    theme: "🩺 Santé – Plaie et risque infectieux",
    q: "Pendant le pansage, un stagiaire se griffe superficiellement l'avant-bras sur un clou rouillé qui dépasse d'une porte de box. La plaie est peu profonde et le saignement s'arrête rapidement.",
    choices: [
      "Puisque la plaie est superficielle et ne saigne presque plus, l'AE considère l'incident clos sans autre action",
      "L'AE nettoie et protège la plaie, informe la famille (ou le responsable pour un majeur) de la nature de la blessure — objet rouillé — afin de vérifier le statut vaccinal antitétanique et de consulter si besoin, et note l'incident",
      "L'AE désinfecte la plaie avec un produit trouvé dans la sellerie, sans se soucier de sa date de péremption ni de son usage prévu",
      "L'AE couvre la plaie avec un pansement mais ne juge pas utile d'en informer qui que ce soit, la blessure semblant bénigne"
    ],
    correct: 1,
    expl: "Une plaie même superficielle causée par un objet rouillé, en milieu équestre (contact avec la terre, le fumier), expose à un <strong>risque de tétanos</strong>. Même mineure, elle doit être nettoyée, protégée, et signalée à la famille ou au responsable du stagiaire afin de vérifier le statut vaccinal et d'orienter si besoin vers une consultation. Minimiser l'incident sans le signaler, ou utiliser un produit non destiné à cet usage, ne garantit pas une prise en charge adaptée."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Juste avant la séance, l'AE remarque qu'un cavalier porte un casque visiblement fissuré sur la calotte, suite à une chute lors d'une précédente sortie.",
    choices: [
      "Elle laisse le cavalier participer avec ce casque, une fissure superficielle n'affectant pas, selon elle, la protection réelle",
      "Elle retire ce casque de l'usage, propose un casque conforme de prêt du club, et explique qu'un casque ayant subi un choc ou visiblement endommagé ne garantit plus sa capacité de protection, même si les dégâts semblent mineurs",
      "Elle demande au cavalier de porter le casque fissuré uniquement pour l'échauffement, puis de le retirer pour le reste de la séance",
      "Elle autorise la séance sans casque du tout, jugeant qu'un casque endommagé est plus dangereux qu'une tête nue"
    ],
    correct: 1,
    expl: "Un casque homologué qui a subi un choc, ou qui présente une fissure visible, perd sa capacité de protection même si les dégâts paraissent mineurs : sa structure interne peut être compromise. Il doit être <strong>retiré de l'usage</strong> et remplacé par un équipement conforme. Aucune situation ne justifie de contourner cette règle : le port du casque homologué reste la protection obligatoire de base."
  },
  {
    theme: "📋 Construction de séance",
    q: "Une AE a préparé une fiche de séance détaillée pour un groupe débutant, mais dès l'échauffement, elle observe que plusieurs cavaliers ne maîtrisent pas des acquis qu'elle pensait déjà installés (arrêt, changement de direction).",
    choices: [
      "Elle applique sa fiche de séance à la lettre, considérant que la modifier en cours de route serait un manque de rigueur professionnelle",
      "Elle ajuste en temps réel les objectifs et les exercices prévus à partir de ce qu'elle observe réellement du niveau du groupe, tout en gardant la structure générale et les impératifs de sécurité de sa séance",
      "Elle arrête la séance et renvoie les cavaliers, considérant que le groupe n'est pas prêt pour la séance prévue",
      "Elle ignore l'écart observé et poursuit sans rien signaler, pour ne pas déstabiliser le groupe"
    ],
    correct: 1,
    expl: "Une fiche de séance est un outil de préparation, pas un carcan rigide : la construction d'une séance sécurisée suppose d'<strong>ajuster en continu</strong> les objectifs et exercices aux caractéristiques réellement observées du public, tout en conservant la structure et les impératifs de sécurité prévus. Ni l'application aveugle de la fiche initiale, ni l'arrêt pur et simple de la séance, ni le silence sur l'écart observé ne correspondent à une adaptation pédagogique réelle."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "À la fin d'un cycle, plusieurs cavaliers du groupe encadré par l'AE semblent prêts à valider leur Galop suivant. L'encadrant diplômé habituellement présent est absent ce jour-là.",
    choices: [
      "L'AE peut faire passer et valider seule l'évaluation, dès lors qu'elle connaît bien le niveau de chaque cavalier",
      "L'AE peut continuer à faire progresser le groupe sur les acquis du Galop visé, mais la validation de l'évaluation relève d'un encadrant diplômé qualifié pour cette responsabilité ; en son absence, l'évaluation est reportée plutôt que validée par l'AE seule",
      "L'AE peut valider seule l'évaluation à condition de la faire confirmer par téléphone par le responsable absent",
      "L'AE peut valider seule l'évaluation si elle filme la séance pour que le responsable la valide a posteriori"
    ],
    correct: 1,
    expl: "L'AE exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus : elle peut faire progresser un groupe vers un niveau donné, mais la <strong>validation d'une évaluation</strong> relève d'un encadrant qualifié pour cette responsabilité. Ni une confirmation téléphonique à distance, ni un enregistrement vidéo validé après coup, ne remplacent la présence et la responsabilité effective de cet encadrant au moment de l'évaluation : à défaut, elle est reportée."
  },
  {
    theme: "🚨 Conduite à tenir – Commotion",
    q: "Après une chute, un cavalier se relève seul, dit qu'il va bien et veut immédiatement remonter à cheval. Un témoin signale cependant qu'il a semblé perdre connaissance quelques secondes juste après la chute.",
    choices: [
      "Puisque le cavalier semble bien aller et le demande lui-même, l'AE le laisse remonter immédiatement",
      "L'AE ne le laisse pas remonter, l'installe au repos, le surveille, informe les parents ou le responsable, et oriente vers un avis médical, une perte de connaissance même brève après une chute pouvant signaler une commotion dont les signes s'aggravent parfois avec un léger différé",
      "L'AE le laisse remonter, mais seulement pour terminer l'exercice en cours, puis l'arrête définitivement après",
      "L'AE ne s'inquiète que si le cavalier se plaint lui-même d'un symptôme, l'absence de plainte spontanée suffisant à exclure tout risque"
    ],
    correct: 1,
    expl: "Toute perte de connaissance, même brève, après une chute avec choc à la tête doit faire suspecter une <strong>commotion cérébrale</strong>, dont certains signes peuvent apparaître avec un délai. Le cavalier ne doit pas reprendre l'activité, même partiellement, même s'il se sent bien et ne se plaint de rien : il faut le mettre au repos, prévenir les responsables et orienter vers un avis médical. Se fier à sa seule impression de bien-être immédiat n'est pas suffisant."
  },
  {
    theme: "🛡️ Sécurité / Lieu de pratique",
    q: "Avant sa séance en carrière, l'AE constate que le sol est devenu très dur et inégal par endroits, après une période de sécheresse, sans qu'aucun entretien récent n'ait été réalisé.",
    choices: [
      "Elle démarre la séance normalement, le sol dur n'étant selon elle un problème que pour les allures rapides",
      "Elle adapte le programme (limitation des allures, évitement des zones les plus dégradées) ou change de lieu de pratique si l'état du sol présente un risque réel pour les chevaux et les cavaliers, la sécurité du lieu étant un préalable à toute séance",
      "Elle informe seulement les cavaliers de faire attention, sans modifier ni le lieu ni le programme prévu",
      "Elle attend un futur entretien du sol par les services techniques, prévu « prochainement », sans rien changer pour cette séance"
    ],
    correct: 1,
    expl: "L'état du sol conditionne directement la sécurité de la séance : un sol trop dur et inégal augmente le risque de chute et de blessure, y compris à des allures modérées. Il appartient à l'AE d'<strong>adapter son programme</strong> ou de changer de lieu si le risque est réel, la sécurité du lieu de pratique étant un préalable à toute séance. Une simple consigne de prudence verbale, ou l'attente d'un entretien futur non garanti, ne suffisent pas à sécuriser la situation présente."
  },
  {
    theme: "🚨 Conduite à tenir – Épistaxis",
    q: "Après un coup de tête reçu accidentellement d'un cheval pendant le pansage, un stagiaire se met à saigner abondamment du nez, sans autre signe inquiétant.",
    choices: [
      "L'AE lui fait pencher la tête en arrière pour éviter que le sang ne coule sur ses vêtements",
      "L'AE le fait s'asseoir, tête légèrement penchée en avant, lui fait comprimer fermement les ailes du nez pendant plusieurs minutes sans relâcher, et surveille l'arrêt du saignement, en alertant si celui-ci persiste ou si d'autres signes apparaissent",
      "L'AE l'allonge à plat pour limiter l'effort cardiaque le temps que le saignement s'arrête seul",
      "L'AE lui fait moucher fort immédiatement pour « dégager le nez » avant de faire quoi que ce soit d'autre"
    ],
    correct: 1,
    expl: "Face à une <strong>épistaxis</strong>, il faut installer la victime assise, tête penchée en avant (et non en arrière, ce qui ferait déglutir le sang et risquerait des nausées ou fausses routes), et comprimer fermement les ailes du nez sans relâcher plusieurs minutes. Il faut surveiller l'évolution et alerter si le saignement persiste ou si d'autres signes apparaissent. Pencher la tête en arrière, allonger la victime, ou lui faire moucher fort immédiatement sont des erreurs fréquentes à éviter."
  },
  {
    theme: "🚨 Conduite à tenir – Gestion du groupe",
    q: "Pendant que l'AE porte secours à un cavalier tombé et légèrement blessé, le reste du groupe reste monté à cheval, sans consigne, à proximité immédiate.",
    choices: [
      "L'AE reste concentrée uniquement sur la victime et laisse le reste du groupe livré à lui-même le temps de la prise en charge",
      "L'AE sécurise rapidement la situation en confiant la surveillance du reste du groupe (mise à pied si besoin, éloignement du lieu de l'incident) à une personne responsable disponible ou en donnant des consignes claires et brèves aux cavaliers, avant de se consacrer pleinement à la victime et à l'alerte",
      "L'AE interrompt la prise en charge de la victime toutes les minutes pour vérifier le reste du groupe",
      "L'AE demande au cavalier le moins expérimenté du groupe de gérer les autres pendant qu'elle s'occupe de la victime"
    ],
    correct: 1,
    expl: "En cas d'incident, il faut à la fois <strong>sécuriser rapidement</strong> le reste du groupe (consignes claires, mise à pied si besoin, délégation à une personne responsable disponible) et se consacrer pleinement à la victime et à l'alerte, sans fragmenter l'un au détriment de l'autre. Laisser le groupe sans consigne, interrompre sans cesse la prise en charge de la victime, ou confier cette responsabilité à un cavalier non qualifié pour cela ne garantissent pas la sécurité de l'ensemble."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
