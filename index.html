<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 22 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>22 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le gérant demande à l'AE de préparer seule, chaque semaine et sur toute la saison, un groupe de cavaliers confirmés visant la technique du Galop 6 (maniabilité avancée, sauts d'obstacles enchaînés), sans qu'un titulaire d'un diplôme professionnel n'intervienne jamais sur ce créneau.",
    choices: [
      "C'est conforme : l'AE peut encadrer tout niveau de cavaliers dès lors qu'elle en a l'expérience personnelle",
      "Ce n'est pas conforme : la carte professionnelle de l'AE l'habilite à enseigner des publics débutants jusqu'au Galop 4, sous la responsabilité d'un enseignant qualifié ; au-delà de ce niveau, l'encadrement technique relève d'un titulaire de diplôme professionnel",
      "C'est conforme, à condition que l'AE ait elle-même un niveau de pratique au moins équivalent au Galop 6",
      "Ce n'est pas conforme, mais uniquement parce qu'il s'agit d'un engagement sur toute une saison ; un remplacement ponctuel sur ce même public serait autorisé"
    ],
    correct: 1,
    expl: "Le référentiel de l'Animateur d'Équitation limite son périmètre d'enseignement aux <strong>publics débutants, jusqu'au Galop 4</strong>, exercé sous la responsabilité d'un enseignant qualifié (titulaire d'un diplôme professionnel de niveau IV ou plus). Au-delà de ce niveau technique, la préparation d'un Galop 5/6 avec des exercices avancés sort de son champ d'action, quelle que soit sa propre expérience de cavalière ou la durée de l'engagement."
  },
  {
    theme: "🚨 Conduite à tenir – Choc allergique (piqûre)",
    q: "Pendant une sortie en extérieur, un stagiaire connu pour être allergique aux piqûres de guêpes se fait piquer au cou. En quelques minutes, son visage commence à gonfler et sa voix devient rauque ; il dit avoir du mal à respirer.",
    choices: [
      "Elle l'allonge complètement à plat sur le dos, jambes surélevées, et attend de voir si les symptômes s'atténuent avant d'alerter qui que ce soit",
      "Elle appelle immédiatement le 15/112, utilise sans délai le stylo auto-injecteur d'adrénaline du stagiaire s'il en a un sur lui, et le maintient en position semi-assise pour faciliter sa respiration",
      "Elle lui fait avaler un comprimé antihistaminique pris dans la trousse de secours et attend son effet avant d'envisager d'appeler les secours",
      "Elle applique uniquement du froid sur la piqûre et surveille l'évolution sans alerter, le gonflement du visage n'étant pas selon elle un signe de gravité en soi"
    ],
    correct: 1,
    expl: "Un gonflement du visage/de la gorge avec difficulté respiratoire après une piqûre chez une personne allergique évoque un <strong>choc anaphylactique</strong>, urgence vitale. La conduite adaptée : alerte immédiate du 15/112, utilisation sans délai de l'auto-injecteur d'adrénaline si la victime en possède un, et position semi-assise pour soulager la respiration (l'allonger à plat peut au contraire l'aggraver). Attendre ou se limiter à un geste local fait perdre un temps critique."
  },
  {
    theme: "🛡️ Sécurité / Matériel et harnachement",
    q: "Juste avant une séance montée, l'AE constate que la boucle de la jugulaire du casque d'un stagiaire est cassée. Le stagiaire propose de monter quand même « en tenant la jugulaire avec les doigts pendant la séance ».",
    choices: [
      "Elle accepte cette solution, le stagiaire s'engageant à rester attentif et à ne pas lâcher la jugulaire",
      "Elle refuse : une jugulaire dont la boucle ne peut plus être fermée solidement ne garantit plus le maintien du casque en cas de chute, et le stagiaire ne peut pas monter tant que ce défaut n'est pas corrigé (casque remplacé ou réparé)",
      "Elle autorise la séance mais seulement au pas, pensant que cela suffit à compenser le risque",
      "Elle demande simplement au stagiaire de bien serrer son casque avec les mains au moment où il sent qu'il va tomber"
    ],
    correct: 1,
    expl: "La <strong>jugulaire</strong> a pour fonction de maintenir le casque en place lors d'un choc ou d'une chute ; un maintien manuel n'est pas fiable, en particulier au moment précis où les mains sont nécessaires pour se protéger ou tenir les rênes. Un casque dont la jugulaire ne peut plus être fermée solidement doit être retiré de l'usage et remplacé avant toute nouvelle séance, quelle que soit l'allure prévue."
  },
  {
    theme: "🩺 Santé – Hygiène et matériel partagé",
    q: "En aidant un jeune stagiaire à ajuster son casque, l'AE remarque des signes évocateurs de poux (lentes visibles à la base des cheveux) ; les casques de la structure sont partagés entre plusieurs cavaliers d'une séance à l'autre, sans protection individuelle systématique.",
    choices: [
      "Elle ne change rien à l'organisation habituelle, les poux ne se transmettant selon elle que par contact direct entre cheveux, jamais par un objet comme un casque",
      "Elle évite que ce casque soit directement réutilisé par un autre stagiaire sans protection intermédiaire (bonnet hygiénique), en informe la famille du stagiaire concerné, et rappelle au responsable de la structure l'intérêt de systématiser une protection hygiénique sous les casques partagés",
      "Elle interdit sur-le-champ à ce stagiaire toute activité et l'isole du reste du groupe pour le reste de la journée, sans en informer la famille avant la fin de la séance",
      "Elle traite elle-même la chevelure du stagiaire avec un produit anti-poux qu'elle a sur elle, sans en parler à la famille"
    ],
    correct: 1,
    expl: "Les poux peuvent se transmettre par contact direct mais aussi par le <strong>partage d'objets en contact avec la tête</strong> (casques, bonnets). Face à un cas suspecté, l'AE évite la réutilisation directe du casque, informe la famille pour la prise en charge adaptée, et relaie l'information au responsable de la structure pour renforcer l'usage de protections hygiéniques individuelles. Elle n'a ni à traiter elle-même médicalement l'enfant, ni à l'exclure brutalement sans information préalable de la famille."
  },
  {
    theme: "📋 Construction de séance / Prise en compte du public",
    q: "Un stagiaire découvre l'équitation pour la première fois. Face au poney, il se fige, recule, respire vite et refuse catégoriquement de s'approcher, malgré les encouragements. La séance est prévue avec mise en selle dans les dix premières minutes selon la fiche de séance initiale.",
    choices: [
      "Elle le fait monter quand même rapidement, estimant que la peur disparaîtra une fois en selle et que suivre la fiche de séance prévue prime",
      "Elle adapte immédiatement sa progression : elle revient à une approche à pied, au rythme du stagiaire (observation, contact progressif, pansage), et reporte la mise en selle tant que la peur intense n'est pas apaisée",
      "Elle demande à un autre stagiaire du groupe de monter à sa place pendant qu'il regarde, pensant que l'exemple suffira à le rassurer rapidement",
      "Elle insiste fermement en expliquant que « tout le monde a peur au début » et le fait avancer de force jusqu'au poney"
    ],
    correct: 1,
    expl: "La construction d'une séance sécurisée tient compte des <strong>caractéristiques réelles du public</strong>, y compris émotionnelles. Une peur intense et un refus catégorique sont un signal à respecter : la progression doit être adaptée (retour à une approche à pied, contact progressif) plutôt que suivre mécaniquement la fiche de séance initiale. Forcer un stagiaire paniqué augmente le risque de mouvement brusque, dangereux pour lui comme pour l'animal."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un cheval de la structure présente un comportement dangereux répété (ruades vers les humains) lors des soins. Le responsable diplômé de la structure est injoignable pour la journée. L'AE décide seule d'engager une procédure de vente définitive de ce cheval en son nom, considérant que la gestion de la cavalerie fait partie de sa mission d'AE.",
    choices: [
      "C'est conforme : l'AE participe à la gestion de la cavalerie, ce qui inclut la décision de céder un animal jugé dangereux",
      "Ce n'est pas conforme : l'AE participe à la gestion et l'animation de la cavalerie sous la supervision d'un titulaire de diplôme professionnel ; elle peut et doit retirer temporairement ce cheval des activités par précaution, mais une décision structurelle comme sa vente relève du responsable diplômé, pas d'une décision autonome de l'AE",
      "Ce n'est pas conforme, mais uniquement parce qu'elle aurait dû attendre le retour du responsable avant même d'écarter le cheval des activités",
      "C'est conforme dès lors qu'elle informe le responsable après coup, une fois la vente engagée"
    ],
    correct: 1,
    expl: "L'AE <strong>participe à la gestion et à l'animation de la cavalerie sous la supervision</strong> d'un titulaire de diplôme professionnel. Face à un danger immédiat, elle peut et doit prendre la mesure de précaution qui s'impose (écarter temporairement le cheval des activités), mais une décision structurelle et engageante comme la vente définitive d'un animal dépasse son périmètre d'autonomie et doit être validée par le responsable diplômé de la structure."
  },
  {
    theme: "🚨 Conduite à tenir – Brûlure",
    q: "Pendant les travaux d'écurie, un stagiaire se brûle l'avant-bras au contact du pot d'échappement d'un engin utilisé pour le fumier. La peau rougit immédiatement et une cloque commence à se former.",
    choices: [
      "Elle perce immédiatement la cloque pour « évacuer la brûlure » puis applique une pommade grasse avant de couvrir",
      "Elle refroidit sans attendre la zone à l'eau tempérée (ni glacée ni chaude) pendant une quinzaine de minutes en continu, sans percer la cloque ni appliquer de corps gras, puis couvre d'un pansement stérile non adhérent et surveille",
      "Elle applique directement de la glace en contact direct avec la peau pour stopper la douleur le plus vite possible",
      "Comme il n'y a « qu'une cloque », elle considère que ce n'est pas grave, ne refroidit pas la zone et laisse le stagiaire reprendre l'activité normalement"
    ],
    correct: 1,
    expl: "Le geste de premiers secours pour une <strong>brûlure</strong> est un refroidissement immédiat et prolongé à l'eau tempérée (environ 15 minutes), sans percer les cloques (barrière naturelle contre l'infection) ni appliquer de corps gras (retient la chaleur, favorise l'infection). La glace en contact direct peut aggraver la lésion (gelure). Une brûlure avec cloque n'est jamais anodine et nécessite ce geste avant toute reprise d'activité, avec surveillance et avis médical si besoin."
  },
  {
    theme: "🛡️ Sécurité collective / Organisation de l'espace",
    q: "Pour aller plus vite, l'AE amène les poneys sellés vers la carrière en laissant le portillon ouvert derrière elle « pour repartir ensuite plus facilement », le temps d'installer son matériel. Un pré avec d'autres chevaux et une route se trouvent juste à proximité.",
    choices: [
      "C'est acceptable pour un court instant, tant qu'elle reste visuellement à portée du portillon",
      "Elle referme systématiquement le portillon dès qu'elle et les poneys sont passés, avant toute autre tâche, pour éviter tout risque de divagation d'un animal vers une zone dangereuse comme une route",
      "Ce n'est un problème que si des chevaux sont effectivement présents dans le pré adjacent au moment précis",
      "Elle peut laisser le portillon ouvert dès lors qu'elle prévient oralement les autres personnes présentes sur le site"
    ],
    correct: 1,
    expl: "La sécurisation des <strong>zones de circulation et d'accès</strong> impose de refermer systématiquement portillons et clôtures dès leur franchissement, avant toute autre tâche, en particulier à proximité d'une voie de circulation. Un accès laissé ouvert « pour plus tard », même brièvement et sous surveillance visuelle partielle, crée un risque de divagation d'un animal vers une zone dangereuse, indépendamment de la présence effective d'autres chevaux au moment précis."
  },
  {
    theme: "📋 Construction de séance / Sécurité de la sortie",
    q: "L'AE s'apprête à partir pour une sortie en extérieur avec un groupe. Au moment de vérifier son sac avant le départ, elle constate que la trousse de premiers secours habituellement présente est absente.",
    choices: [
      "Elle part quand même, considérant qu'aucun incident grave n'est jamais survenu lors des sorties précédentes",
      "Elle ne part pas tant qu'une trousse de premiers secours n'est pas disponible : elle va en chercher une avant le départ, ou reporte/adapte la sortie si cela n'est pas possible dans un délai raisonnable",
      "Elle part en se disant qu'elle appellera simplement les secours par téléphone en cas de besoin, sans autre matériel",
      "Elle part et compte sur le fait qu'un des cavaliers du groupe a peut-être, individuellement, de quoi improviser des soins"
    ],
    correct: 1,
    expl: "La préparation d'une sortie en extérieur, éloignée de la structure, fait partie de la <strong>construction sécurisée de la séance</strong> : disposer d'une trousse de premiers secours est une condition de départ, pas un détail facultatif. Un téléphone permet d'alerter les secours mais ne remplace pas les moyens de premiers gestes en attendant leur arrivée. En son absence, l'AE doit s'en procurer une avant de partir ou adapter/reporter la sortie."
  },
  {
    theme: "🚨 Conduite à tenir – Hypoglycémie",
    q: "Un stagiaire connu comme diabétique devient soudainement pâle, tremblant, en sueurs, et semble légèrement confus pendant le pansage, mais reste conscient et répond quand on lui parle, sans difficulté à avaler.",
    choices: [
      "Elle le fait asseoir, lui donne à consommer rapidement un aliment ou une boisson sucrée, surveille son état, et alerte le 15/112 si aucune amélioration rapide n'apparaît ou si son état s'aggrave",
      "Comme il reste conscient, elle ne fait rien de particulier et le laisse simplement s'asseoir quelques minutes avant de reprendre l'activité",
      "Elle lui fait avaler de force une boisson sucrée même s'il montrait des signes de troubles de la déglutition, car le resucrage prime toujours sur tout autre risque",
      "Elle l'allonge immédiatement à plat dos et attend son réveil complet sans lui donner à manger ni à boire"
    ],
    correct: 0,
    expl: "Les signes (pâleur, tremblements, sueurs, confusion légère) chez un stagiaire diabétique évoquent une <strong>hypoglycémie</strong>. Tant que la personne est consciente et capable d'avaler, un resucrage rapide (sucre, boisson sucrée) est le geste adapté, avec surveillance et appel du 15/112 en l'absence d'amélioration rapide ou en cas d'aggravation. À l'inverse, en cas de trouble de la conscience ou de la déglutition, il ne faut jamais faire boire ou manger, en raison du risque de fausse route, et alerter immédiatement les secours."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du matériel, hygiène, construction de séance : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>

</html>
