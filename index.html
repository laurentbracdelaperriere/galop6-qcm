<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 12 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>12 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le responsable de la structure, absent pour la journée, demande par téléphone à une AE de préparer seule, sans aucune supervision d'un titulaire de diplôme de niveau IV ou plus, un cavalier confirmé pour une prochaine compétition de saut d'obstacles. Cette mission relève-t-elle du champ de compétence de l'AE ?",
    choices: [
      "Oui, dès lors que le responsable en donne l'autorisation par téléphone, cette autorisation orale suffisant à couvrir n'importe quelle organisation",
      "Non : le cœur de métier de l'AE est de conduire des séances de découverte et d'initiation, toujours sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus ; la préparation autonome d'un cavalier confirmé en vue d'une compétition, sans cette supervision, sort de son champ de compétence habituel",
      "Oui, un cavalier confirmé nécessitant moins d'encadrement qu'un débutant, l'AE peut à ce titre s'affranchir de la supervision habituellement requise",
      "Non, car il est interdit à une AE de s'occuper d'un cavalier confirmé, quel que soit le contexte"
    ],
    correct: 1,
    expl: "Le cœur de métier de l'AE consiste à conduire des séances de <strong>découverte et d'initiation</strong>, toujours sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus (BPJEPS ou équivalent). La préparation autonome d'un cavalier confirmé pour une compétition, sans cette supervision, sort de ce champ de compétence habituel — une autorisation orale ponctuelle ne suffit pas à créer cette compétence, et le niveau du cavalier ne dispense pas de la supervision requise."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Pendant le pansage, un cheval rue et atteint un stagiaire à la jambe. La plaie saigne abondamment ; le stagiaire reste conscient et parle normalement.",
    choices: [
      "L'AE nettoie la plaie à l'eau puis laisse le stagiaire se reposer assis, en attendant de voir si le saignement s'arrête tout seul",
      "L'AE comprime fermement la plaie avec un tissu propre (ou ses mains gantées si possible), allonge la victime, alerte immédiatement le 15/112 en décrivant l'importance du saignement, et surveille son état de conscience jusqu'à l'arrivée des secours",
      "L'AE retire tout objet ou corps étranger visible dans la plaie avant de la comprimer, pour ne pas gêner la compression",
      "L'AE fait d'abord marcher le stagiaire jusqu'à l'infirmerie du club, la marche permettant de vérifier qu'il n'y a pas de fracture associée"
    ],
    correct: 1,
    expl: "Face à une <strong>hémorragie</strong>, la priorité est de comprimer directement la plaie pour limiter la perte de sang, d'allonger la victime, d'alerter sans délai le 15/112 en précisant l'abondance du saignement, et de surveiller en continu l'état de conscience en attendant les secours. On ne retire jamais un corps étranger empalé (risque d'aggraver l'hémorragie) et on ne fait pas marcher une victime blessée à la jambe avant d'avoir écarté tout risque de fracture ou d'aggravation."
  },
  {
    theme: "🩺 Santé / Certificat médical",
    q: "Un cavalier majeur doit renouveler sa licence pratiquant. Il répond « oui » à l'une des questions du questionnaire de santé fédéral (auto-questionnaire). Que doit-il fournir pour que sa licence soit validée ?",
    choices: [
      "Rien de plus : répondre au questionnaire de santé suffit toujours à valider la licence, quelle que soit la réponse donnée",
      "Une simple attestation sur l'honneur rédigée par lui-même certifiant qu'il n'a « pas de problème particulier »",
      "Un certificat médical de non contre-indication à la pratique de l'équitation, daté de moins d'un an, car une réponse positive à une question du questionnaire de santé impose la production d'un certificat",
      "Un certificat médical uniquement s'il souhaite participer à une compétition, la licence loisir seule ne l'exigeant en aucun cas"
    ],
    correct: 2,
    expl: "Depuis la réforme de 2021, si le pratiquant répond « non » à toutes les questions du questionnaire de santé, une simple attestation suffit. Mais dès qu'<strong>une réponse est « oui »</strong>, un <strong>certificat médical</strong> de non contre-indication de moins d'un an doit être déposé pour valider la licence. Une attestation sur l'honneur rédigée par le cavalier lui-même ne remplace jamais ce certificat dans ce cas."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Un enfant débutant arrive pour sa séance avec son propre casque, apporté de la maison : un casque de vélo aux normes CE, mais qui n'est pas un casque équestre. L'AE doit-elle le laisser pratiquer avec ?",
    choices: [
      "Oui, un casque aux normes CE offre une protection équivalente quel que soit le sport auquel il est destiné",
      "Non : un casque de vélo n'est pas conçu pour les chocs propres à l'équitation (zones de protection, fixation, résistance) ; l'AE doit lui fournir un casque conforme aux normes spécifiques de l'équitation avant qu'il ne pratique",
      "Oui, à condition que les parents aient donné leur accord écrit pour l'utilisation de ce casque",
      "Non, car il est interdit à un enfant de porter un casque qui ne lui appartient pas en propre"
    ],
    correct: 1,
    expl: "Un casque de vélo répond à une norme conçue pour les chutes et chocs typiques du vélo, pas pour ceux de l'équitation (chute de hauteur, risque de coup de sabot, zones de protection différentes). L'AE doit refuser ce casque et fournir un <strong>casque conforme aux normes spécifiques à l'équitation</strong>. L'accord des parents ne change rien au niveau de protection réel offert par un équipement inadapté."
  },
  {
    theme: "📋 Construction de séance",
    q: "Une AE a prévu une séance en extérieur avec un groupe de cavaliers. Peu avant le départ, un orage se rapproche nettement, avec des éclairs visibles au loin.",
    choices: [
      "Elle maintient la sortie comme prévu, un peu de pluie ne remettant pas en cause une séance déjà organisée",
      "Elle reporte ou annule la sortie extérieure, un orage proche exposant le groupe à un risque de foudre et pouvant provoquer des réactions imprévisibles des chevaux ; elle adapte la séance en intérieur ou la reporte",
      "Elle raccourcit simplement le trajet prévu, sans changer le lieu de la séance",
      "Elle laisse chaque cavalier décider individuellement s'il souhaite partir ou non malgré l'orage"
    ],
    correct: 1,
    expl: "Un orage proche constitue un <strong>risque de sécurité majeur</strong> : risque de foudre en extérieur et risque de réactions de panique chez les chevaux, difficiles à anticiper. Construire une séance sécurisée implique d'adapter ou de reporter l'activité en fonction des conditions réelles, plutôt que de maintenir le programme initial ou de laisser chacun décider individuellement de s'exposer au danger."
  },
  {
    theme: "📞 Protocole d'alerte",
    q: "Un stagiaire américain non francophone se blesse gravement pendant la séance. Un autre stagiaire affirme qu'il faut absolument composer le 112 car le 15 « ne fonctionnerait pas » pour appeler du secours à un étranger. Qu'en est-il réellement ?",
    choices: [
      "C'est exact : le 15 est réservé aux appelants de nationalité française, il faut donc composer uniquement le 112 dans ce cas",
      "C'est faux : en France, le 15 (SAMU) comme le 112 (numéro d'urgence européen) aboutissent tous deux aux services de secours et sont accessibles à toute personne présente sur le territoire, quelle que soit sa nationalité ; l'essentiel est de transmettre clairement la localisation et l'état de la victime, au besoin avec l'aide d'un interprète",
      "C'est faux, car en réalité aucun des deux numéros ne fonctionne pour un étranger ; il faut contacter directement l'ambassade des États-Unis",
      "C'est exact, et il faut en plus préciser au régulateur la nationalité de la victime avant toute autre information pour qu'il puisse traiter l'appel"
    ],
    correct: 1,
    expl: "En France, le <strong>15</strong> (SAMU) et le <strong>112</strong> (numéro d'urgence européen) aboutissent tous deux aux services de secours et sont accessibles à toute personne présente sur le territoire, indépendamment de sa nationalité. La priorité en cas de barrière de langue est de transmettre des informations claires (localisation, état de la victime), en s'appuyant si besoin sur une autre personne pour traduire — la nationalité de la victime n'est jamais l'information à donner en premier."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise",
    q: "Un jeune cavalier connu comme diabétique (information présente sur sa fiche sanitaire) devient pâle, tremblant et en sueurs pendant l'exercice, tout en restant conscient et capable de répondre.",
    choices: [
      "L'AE l'encourage à continuer l'exercice quelques minutes de plus, le mouvement pouvant l'aider à se sentir mieux",
      "L'AE arrête immédiatement l'exercice, fait asseoir le cavalier, lui donne du sucre conformément aux indications de sa fiche sanitaire s'il reste conscient, surveille son état, et alerte le 15 si aucune amélioration n'apparaît rapidement ou en cas de perte de connaissance",
      "L'AE lui donne immédiatement son traitement personnel contre le diabète rangé dans son sac, sans autre vérification",
      "L'AE attend la fin de la séance pour en parler aux parents, les signes observés n'étant pas assez clairs pour justifier une interruption"
    ],
    correct: 1,
    expl: "Pâleur, tremblements et sueurs chez un cavalier diabétique évoquent une possible <strong>hypoglycémie</strong>. Il faut arrêter l'effort, faire asseoir, donner du sucre s'il reste conscient et si sa fiche sanitaire le prévoit, surveiller l'évolution, et alerter le 15 en l'absence d'amélioration rapide ou en cas de perte de connaissance. On n'administre jamais un traitement médicamenteux personnel (comme l'insuline) sans consigne médicale précise, et on n'attend jamais la fin de la séance pour agir face à des signes évocateurs."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une AE encadre seule une reprise et estime se sentir tout à fait capable de gérer un groupe plus nombreux que ce qui est habituellement prévu pour ce type d'activité. Peut-elle décider seule d'accueillir davantage de cavaliers sur cette base ?",
    choices: [
      "Oui, le nombre de cavaliers encadrables par un même encadrant est entièrement laissé à l'appréciation personnelle de celui qui encadre la séance",
      "Non : des règles techniques de sécurité fixent des effectifs maximum encadrables selon le niveau des pratiquants et le type d'activité ; l'AE doit s'y conformer même si elle se sent personnellement capable d'encadrer davantage de cavaliers",
      "Oui, à condition d'en informer oralement les cavaliers supplémentaires avant le début de la séance",
      "Non, car aucune reprise ne peut jamais dépasser quatre cavaliers, quel que soit le niveau ou l'encadrant"
    ],
    correct: 1,
    expl: "Les effectifs maximum encadrables par séance sont fixés par des <strong>règles techniques de sécurité</strong>, qui tiennent compte du niveau des pratiquants et du type d'activité — ce n'est pas une appréciation laissée au ressenti personnel de l'encadrant, aussi expérimenté se sente-t-il. Le sentiment de compétence personnelle ne remplace pas le respect de ce cadre."
  },
  {
    theme: "🛡️ Sécurité / Matériel",
    q: "Juste avant une séance, l'AE remarque qu'une sangle de selle est effilochée par endroits, avec plusieurs fils apparents.",
    choices: [
      "Elle resserre simplement la sangle un peu plus fort que d'habitude pour compenser l'usure visible",
      "Elle retire immédiatement cette sangle du service, la remplace par une sangle en bon état avant la séance, et signale le matériel défectueux pour réparation ou remplacement",
      "Elle utilise la sangle telle quelle pour cette séance, mais prévoit de la signaler après coup si elle y pense",
      "Elle confie la sangle au cavalier le plus expérimenté du groupe, considérant que lui seul est en mesure d'évaluer si elle est encore utilisable"
    ],
    correct: 1,
    expl: "Une sangle effilochée présente un risque réel de <strong>rupture en cours de séance</strong>, avec un danger direct pour le cavalier (selle qui tourne ou se détache). Le contrôle du matériel avant la séance fait partie des responsabilités de l'encadrant : tout élément défectueux doit être retiré du service immédiatement, remplacé, et signalé — resserrer davantage ou reporter le signalement à plus tard ne supprime pas le risque."
  },
  {
    theme: "📋 Construction de séance",
    q: "Une AE expérimentée improvise sa séance sans fiche de séance écrite, expliquant qu'elle « a l'habitude » et connaît le groupe. Le formateur lui indique que c'est insuffisant. Pourquoi une fiche de séance écrite reste-t-elle nécessaire, même pour une AE expérimentée ?",
    choices: [
      "Parce que la fiche de séance est avant tout une formalité administrative exigée par le club, sans lien avec la sécurité ou la pédagogie de la séance",
      "Parce qu'elle formalise les objectifs, les exercices prévus, l'anticipation des risques et l'adaptation au public, ce qui structure la sécurité et la cohérence pédagogique de la séance, au-delà de la seule expérience ou mémoire de l'encadrant",
      "Parce qu'elle n'est utile qu'en cas de contrôle inopiné d'un inspecteur, sans autre intérêt pour la conduite de la séance elle-même",
      "Parce qu'elle est obligatoire uniquement pour les séances avec des cavaliers mineurs, jamais pour un public adulte"
    ],
    correct: 1,
    expl: "La fiche de séance formalise les <strong>objectifs pédagogiques</strong>, les exercices prévus, l'anticipation des risques et l'adaptation au public réellement présent. Elle structure la sécurité et la cohérence de la séance au-delà de la seule expérience ou mémoire de l'encadrant, qui peut omettre un point important en improvisant. Ce n'est ni une simple formalité administrative, ni un outil réservé au contrôle ou au seul public mineur."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
