<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 9 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>9 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une association loi 1901 propose des cours d'équitation totalement gratuits, animés bénévolement par un cavalier expérimenté mais non diplômé, non déclaré auprès des services de l'État. Le président de l'association affirme que cela ne pose aucun problème puisqu'aucune rémunération n'est versée. A-t-il raison au regard de l'obligation de qualification du Code du sport ?",
    choices: [
      "Non, l'obligation de qualification de l'article L.212-1 du Code du sport s'applique à toute personne qui encadre une activité sportive, qu'elle soit rémunérée ou non",
      "Oui : l'article L.212-1 du Code du sport soumet à l'obligation de qualification et de déclaration l'exercice contre rémunération ; un encadrement strictement bénévole et non rémunéré n'entre pas dans le champ de cette obligation, même si d'autres règles de sécurité et de responsabilité civile continuent de s'appliquer",
      "Non, le bénévolat n'est toléré que pour l'encadrement de cavaliers déjà licenciés depuis plus d'un an",
      "Oui, mais uniquement si l'association n'est pas affiliée à la Fédération Française d'Équitation"
    ],
    correct: 1,
    expl: "L'article <strong>L.212-1 du Code du sport</strong> vise précisément les personnes qui, <strong>contre rémunération</strong>, enseignent, animent, encadrent ou entraînent une activité physique ou sportive. Un encadrement strictement bénévole, sans aucune contrepartie financière, échappe donc à cette obligation de qualification et de déclaration — même s'il reste soumis aux règles générales de sécurité et à la responsabilité civile de droit commun. C'est un point souvent mal maîtrisé : l'absence de diplôme n'est pas illégale en soi, c'est l'exercice rémunéré sans qualification qui l'est."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Pendant la pause goûter, un enfant de 9 ans avale de travers un morceau de pomme et se met soudain à ne plus pouvoir parler ni tousser efficacement, les mains portées à la gorge. Il reste conscient. Quelle est la conduite à tenir ?",
    choices: [
      "Tu l'installes en position semi-assise, tu le rassures et tu attends que l'obstruction se résorbe seule avant d'intervenir",
      "Buste penché en avant, tu donnes jusqu'à 5 claques vigoureuses entre les omoplates ; si l'obstruction persiste, tu enchaînes avec jusqu'à 5 compressions abdominales (méthode de Heimlich), en alternant les deux techniques, et tu alertes le 15 si cela ne se résout pas rapidement",
      "Tu lui fais immédiatement avaler un grand verre d'eau pour aider le morceau à descendre",
      "Tu introduis directement tes doigts dans sa bouche pour tenter d'attraper le morceau coincé, avant tout autre geste"
    ],
    correct: 1,
    expl: "Face à une <strong>obstruction complète des voies aériennes</strong> chez une personne consciente, le geste de référence est : buste penché en avant, <strong>jusqu'à 5 claques dans le dos</strong> entre les omoplates, puis si cela ne suffit pas, <strong>jusqu'à 5 compressions abdominales</strong> (méthode de Heimlich), en alternant. Faire boire la victime ou chercher le corps étranger au doigt sont des erreurs classiques et dangereuses : le liquide ou le geste peuvent aggraver l'obstruction. Si les gestes échouent, l'alerte au 15 est indispensable."
  },
  {
    theme: "🩺 Santé / Aptitude",
    q: "Un enfant de 7 ans s'inscrit pour la toute première fois de sa vie dans un club équestre, sans avoir jamais été licencié auparavant dans aucune fédération sportive. Ses parents pensent qu'un simple questionnaire de santé type « QS-SPORT », rempli et signé par eux, suffit à valider cette première licence, comme cela se ferait pour un renouvellement.",
    choices: [
      "Ils ont raison : le questionnaire de santé QS-SPORT suffit systématiquement, qu'il s'agisse d'une première licence ou d'un renouvellement",
      "Ils ont tort : le dispositif du questionnaire de santé QS-SPORT ne s'applique qu'aux renouvellements de licence ; pour une première délivrance, un certificat médical de non contre-indication à la pratique de l'équitation reste exigé",
      "Ils ont tort, car aucun mineur ne peut être licencié dans une fédération sportive avant l'âge de 8 ans",
      "Ils ont raison, mais seulement si l'enfant pratique en loisir et jamais en compétition"
    ],
    correct: 1,
    expl: "Le questionnaire de santé « QS-SPORT », issu de l'arrêté du 20 avril 2017, allège les démarches lors du <strong>renouvellement</strong> d'une licence sportive (une réponse NON à tout dispense de certificat). Il ne remplace pas l'exigence d'un <strong>certificat médical de non contre-indication</strong> lors de la <strong>première délivrance</strong> de la licence, étape où l'aptitude du pratiquant n'a encore jamais été formellement évaluée par un médecin."
  },
  {
    theme: "📋 Construction de séance / Sécurité du lieu",
    q: "Une séance de saut d'obstacles est prévue en carrière extérieure. Il a plu abondamment toute la nuit ; à l'œil, le sable semble praticable, mais tu sais que certaines zones peuvent être détrempées et glissantes sans que cela se voie au premier regard. Les cavaliers sont prêts à démarrer. Que fais-tu avant de lancer les premiers sauts ?",
    choices: [
      "Tu fais immédiatement galoper le groupe sur toute la carrière pour « faire sécher » le sol plus vite avant de sauter",
      "Tu vérifies concrètement l'état du terrain (test au pas et au trot sur les différentes zones, y compris devant et après les obstacles) avant toute mise en activité de saut, et tu adaptes ou reportes les exercices si une zone présente un risque de glissade",
      "Tu réduis uniquement la hauteur des obstacles, sans vérifier l'état réel du sol, en te fiant à l'aspect visuel du sable",
      "Tu laisses chaque cavalier juger individuellement, selon son propre ressenti en piste, s'il souhaite ou non sauter ce jour-là"
    ],
    correct: 1,
    expl: "La sécurité du lieu de pratique impose un <strong>contrôle concret de l'état du terrain</strong>, en particulier après de fortes pluies, avant toute activité à risque comme le saut d'obstacles : une impression visuelle ne suffit pas, une zone peut sembler praticable et se révéler glissante à l'usage. L'AE doit tester le terrain et adapter ou reporter les exercices concernés, plutôt que de se fier à l'apparence, de réduire seulement la hauteur, ou de reporter la décision sur les cavaliers eux-mêmes."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un stagiaire en formation Animateur d'Équitation, pas encore titulaire du titre, souhaite valider ses heures de stage pratique en encadrant seul, sans présence ni supervision de son tuteur, un groupe de cavaliers débutants pendant que celui-ci s'occupe d'une autre tâche au club. Est-ce conforme ?",
    choices: [
      "Oui, un stagiaire en fin de formation peut encadrer seul dès lors qu'il maîtrise le contenu technique de la séance",
      "Non : tant qu'il n'est pas titulaire du titre professionnel (donc de la qualification requise par l'article L.212-1), un stagiaire ne peut pas encadrer seul en autonomie complète ; il doit rester sous la responsabilité effective et la supervision d'un tuteur qualifié pendant sa période de formation",
      "Oui, à condition que le stagiaire ait déjà validé la totalité des modules théoriques, même sans avoir passé les épreuves pratiques",
      "Non, mais uniquement parce que les stagiaires n'ont pas le droit de porter la tenue du club durant leur formation"
    ],
    correct: 1,
    expl: "Un stagiaire en formation n'est pas encore titulaire de la qualification exigée par l'article <strong>L.212-1 du Code du sport</strong> pour encadrer en autonomie. Sa pratique pédagogique en club s'effectue donc <strong>sous la responsabilité et la supervision effective d'un tuteur qualifié</strong> ; le laisser encadrer seul, sans aucune présence ni contrôle, expose la structure comme le stagiaire à un exercice non conforme, quelle que soit sa maîtrise technique personnelle."
  },
  {
    theme: "📞 Protocole d'alerte",
    q: "En pleine randonnée équestre dans une zone rurale isolée, un cavalier chute et se blesse sérieusement. Ton téléphone n'a aucun réseau chez ton propre opérateur, et l'écran est verrouillé sans code disponible dans l'urgence. Peux-tu malgré tout alerter les secours ?",
    choices: [
      "Non, sans réseau de son propre opérateur ni déverrouillage du téléphone, aucun appel d'urgence n'est possible : il faut se déplacer vers la structure la plus proche",
      "Oui : le 112, numéro d'urgence européen, est accessible même téléphone verrouillé et bascule automatiquement sur n'importe quel réseau mobile disponible dans la zone, y compris celui d'un autre opérateur que le sien",
      "Oui, mais uniquement le 15 (SAMU), seul numéro capable de fonctionner sans réseau de son propre opérateur",
      "Non, le 112 nécessite obligatoirement une carte SIM active et un téléphone déverrouillé, comme n'importe quel autre appel"
    ],
    correct: 1,
    expl: "Le <strong>112</strong>, numéro d'urgence européen, est conçu pour rester joignable dans un maximum de situations : il fonctionne même si le téléphone est <strong>verrouillé</strong>, et bascule automatiquement sur le réseau d'un <strong>autre opérateur</strong> disponible localement lorsque celui de l'abonné est hors de portée. C'est une différence importante avec les numéros nationaux classiques, à connaître pour les sorties en zone isolée."
  },
  {
    theme: "🩺 Santé / Accueil du public",
    q: "Une cavalière mineure arrive au club sous traitement antibiotique pour une angine ; elle dit se sentir « un peu fatiguée mais ça va », sans fièvre apparente. Ses parents, qui l'ont déposée, n'ont laissé aucune consigne particulière ni sur la fiche sanitaire ni oralement. Que fait l'AE ?",
    choices: [
      "Il fait participer la cavalière à la séance normale, sans restriction : le sport est bénéfique et ne peut pas aggraver une angine en cours de traitement",
      "Il tient compte de l'état de fatigue rapporté, consulte la fiche sanitaire disponible et, en cas de doute sur l'aptitude à un effort normal, adapte l'intensité de sa participation, voire contacte les parents avant de trancher — la simple présence au club ne valant pas systématiquement aptitude à un effort physique intense",
      "Il interdit purement et simplement toute présence de la cavalière au club, y compris pour observer le cours, dès qu'un traitement médicamenteux est en cours",
      "Il se fie uniquement à la déclaration orale de la cavalière elle-même, sans jamais consulter la fiche sanitaire ni chercher à recontacter les parents"
    ],
    correct: 1,
    expl: "L'accueil en sécurité suppose de croiser l'état rapporté par le pratiquant avec les informations de la <strong>fiche sanitaire</strong> et, en cas d'incertitude sur l'aptitude à l'effort, de solliciter les responsables légaux plutôt que de trancher seul dans un sens ou dans l'autre. Ni l'automatisme « on participe comme si de rien n'était », ni l'exclusion systématique, ni la confiance aveugle en la seule parole de l'enfant ne relèvent d'une prise en compte sérieuse de son état."
  },
  {
    theme: "📋 Construction de séance",
    q: "Un créneau accueille exceptionnellement un groupe hétérogène : plusieurs cavaliers tout juste débutants et un cavalier bien plus confirmé, faute d'autre créneau disponible pour ce dernier. Ta fiche de séance, préparée à l'avance, ne visait que des débutants complets. Que fais-tu ?",
    choices: [
      "Tu appliques la fiche de séance telle quelle pour tout le groupe, y compris pour le cavalier confirmé, afin de ne pas complexifier l'organisation",
      "Tu différencies les situations d'apprentissage selon les niveaux réellement présents — ateliers distincts, exercices en autonomie renforcée pour le cavalier confirmé — tout en maintenant un niveau de sécurité adapté à chacun, plutôt que de niveler la séance uniquement sur les débutants",
      "Tu demandes au cavalier confirmé de rester spectateur ce jour-là, faute de fiche de séance prévue pour son niveau",
      "Tu annules la séance de tout le groupe, une fiche de séance ne pouvant légitimement s'adresser qu'à un seul niveau à la fois"
    ],
    correct: 1,
    expl: "Construire une séance sécurisée et pédagogiquement pertinente implique de <strong>prendre en compte les caractéristiques réelles du public</strong> présent, y compris son hétérogénéité non anticipée. Une fiche de séance se différencie : ateliers ou consignes distincts selon le niveau, pour que chacun progresse en sécurité, plutôt que d'appliquer un contenu uniforme inadapté, d'exclure un cavalier ou d'annuler la séance."
  },
  {
    theme: "🛡️ Sécurité / Affichage",
    q: "Un parent, avant d'inscrire son enfant, demande à voir la qualification de l'AE qui encadrera les cours. Le responsable du club répond que ce n'est pas nécessaire car l'éducateur est bien déclaré auprès de la DRAJES, et que cette déclaration administrative suffit en soi. A-t-il raison ?",
    choices: [
      "Oui, la déclaration auprès de la DRAJES est strictement confidentielle et ne peut en aucun cas être communiquée aux familles",
      "Non : au-delà de la déclaration administrative, les établissements d'activités physiques et sportives doivent afficher de manière visible dans leurs locaux la qualification de leurs éducateurs sportifs ainsi que l'attestation d'assurance ; la déclaration en DRAJES n'exonère pas de cette obligation d'affichage accessible au public",
      "Oui, car seule l'attestation d'assurance doit être affichée, la qualification des éducateurs restant une information strictement interne",
      "Non, mais uniquement si l'établissement accueille des mineurs de moins de 10 ans"
    ],
    correct: 1,
    expl: "Les établissements d'activités physiques et sportives ont une <strong>obligation d'affichage</strong> dans leurs locaux, visible du public : qualifications des éducateurs sportifs qui y exercent, attestation d'assurance, et modalités d'organisation des secours. La déclaration administrative en DRAJES (carte professionnelle) est une condition préalable à l'exercice, mais elle ne dispense pas l'établissement de rendre cette information accessible aux familles sur place."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cheval donne un coup de tête brusque qui heurte un cavalier au niveau du crâne pendant les soins au box. Celui-ci perd connaissance quelques secondes, puis se réveille, dit se sentir bien et demande à reprendre immédiatement sa séance montée. Que fais-tu ?",
    choices: [
      "Comme il affirme aller bien, tu le laisses remonter tout de suite : sa propre parole suffit à juger de son état",
      "Même brève et suivie d'un réveil apparemment normal, toute perte de connaissance impose de ne pas remettre la personne en activité : tu alertes les secours (15 ou 112), tu la maintiens au repos, allongée et sous surveillance, sans la remettre à cheval avant avis médical",
      "Tu attends simplement 5 minutes montre en main, sans alerter personne, avant de le laisser reprendre sa séance normalement",
      "Tu lui fais boire une boisson sucrée et, si les vertiges disparaissent, tu le laisses reprendre la séance comme si de rien n'était"
    ],
    correct: 1,
    expl: "Toute <strong>perte de connaissance</strong>, même brève et suivie d'un réveil apparemment normal, est un signe de gravité qui impose l'<strong>alerte des secours</strong> (15 ou 112) et le maintien au repos sous surveillance, sans reprise d'activité avant avis médical — le ressenti immédiat de la victime, même rassurant, n'est pas fiable pour écarter un traumatisme crânien. Attendre quelques minutes sans alerter, ou se fier à une boisson sucrée, ne remplace en rien cette évaluation médicale."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
