<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 29 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>29 août 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Enseignement rémunéré hors structure",
    q: "Un cavalier propose à l'AE de lui donner, en dehors de toute structure et de tout diplôme d'Etat sur place, des cours particuliers hebdomadaires rémunérés directement de la main à la main.",
    choices: [
      "Elle accepte, un accord entre adultes consentants suffisant à couvrir ce type de prestation",
      "Elle accepte, à condition d'établir une facture pour que la prestation soit déclarée fiscalement",
      "Elle refuse : enseigner une activité physique ou sportive contre rémunération suppose un diplôme d'Etat ou une qualification reconnue équivalente (Code du sport, art. L.212-1), que son diplôme fédéral d'Animateur d'Équitation ne constitue pas à lui seul",
      "Elle accepte, mais limite chaque séance à moins de trente minutes pour que cela ne soit pas considéré comme un véritable cours"
    ],
    correct: 2,
    expl: "L'article <strong>L.212-1 du Code du sport</strong> réserve l'enseignement rémunéré d'une activité physique ou sportive aux titulaires d'un diplôme, titre à finalité professionnelle ou certificat de qualification garantissant la compétence en matière de sécurité. Le certificat fédéral d'Animateur d'Équitation habilite à animer sous l'autorité pédagogique d'un titulaire qualifié, pas à enseigner seul et contre rémunération en dehors de ce cadre. Ni la facturation ni la brièveté de la séance ne changent cette exigence."
  },
  {
    theme: "🚨 Conduite à tenir – Crise convulsive",
    q: "Un stagiaire connu comme épileptique est pris de secousses généralisées et tombe au sol pendant un temps de pansage.",
    choices: [
      "Elle le maintient fermement au sol par les épaules et les jambes pour l'empêcher de se blesser pendant les secousses",
      "Elle glisse un objet entre ses dents pour l'empêcher de se mordre la langue",
      "Elle écarte les objets dangereux autour de lui, protège sa tête, ne le contient pas et ne met rien dans sa bouche, chronomètre la crise, et alerte les secours si elle se prolonge, se répète ou constitue une première crise ; à l'arrêt des convulsions, elle le place en position latérale de sécurité s'il ne reprend pas connaissance complètement",
      "Elle le redresse en position assise dès les premières secousses pour l'aider à respirer plus facilement"
    ],
    correct: 2,
    expl: "Face à une crise convulsive, il ne faut ni contenir la personne ni introduire un objet dans sa bouche, gestes inutiles et dangereux (risque de fracture, d'étouffement) : on protège l'environnement, on chronomètre, et on alerte le <strong>15</strong> en cas de première crise, de crise prolongée (au-delà de 5 minutes) ou répétée sans reprise de conscience. Après l'arrêt, la PLS prévient l'inhalation en cas de vomissement."
  },
  {
    theme: "🛡️ Sécurité du lieu – Cheval à la longe et public à pied",
    q: "Pendant que l'AE travaille un cheval à la longe qui a tendance à ruer en fin d'exercice, un groupe de visiteurs traverse à pied le bord de la carrière pour rejoindre les boxes.",
    choices: [
      "Elle continue l'exercice normalement, les visiteurs étant censés faire attention par eux-mêmes",
      "Elle interrompt l'exercice, ramène le cheval au pas ou à l'arrêt, et attend que les visiteurs aient dégagé une distance de sécurité suffisante avant de reprendre, plutôt que de compter sur leur seule vigilance",
      "Elle continue mais réduit légèrement la longueur de la longe pour rester plus proche du cheval",
      "Elle demande simplement aux visiteurs de presser le pas sans modifier son exercice"
    ],
    correct: 1,
    expl: "Un cheval qui présente un comportement identifié à risque (ici, des ruades en fin d'exercice) à proximité immédiate de piétons impose d'interrompre l'activité et d'assurer une distance de sécurité effective avant de reprendre, plutôt que de reporter la responsabilité sur la vigilance supposée des tiers ou de modifier un détail technique sans traiter le danger réel."
  },
  {
    theme: "🚨 Conduite à tenir – Épistaxis",
    q: "Un stagiaire reçoit un coup de longe accidentel sur le nez et présente un saignement de nez abondant.",
    choices: [
      "Elle lui fait pencher la tête en arrière et lui pince le nez pour empêcher le sang de couler vers l'extérieur",
      "Elle l'assoit, tête légèrement penchée en avant, lui comprime fermement les ailes du nez pendant plusieurs minutes sans relâcher, et consulte si le saignement ne s'arrête pas ou si un traumatisme plus large est suspecté",
      "Elle l'allonge complètement à plat sur le dos en attendant que le saignement s'arrête seul",
      "Elle lui fait moucher fort à plusieurs reprises pour évacuer les caillots avant de faire quoi que ce soit d'autre"
    ],
    correct: 1,
    expl: "En cas de saignement de nez, la tête doit être penchée en <strong>avant</strong> (et non en arrière, ce qui fait avaler le sang et masque une hémorragie réelle) et les ailes du nez comprimées fermement en continu pendant plusieurs minutes ; un mouchage fort avant la compression relance le saignement. Un traumatisme facial associé impose une consultation."
  },
  {
    theme: "⚖️ Réglementation encadrement – Bénévolat et champ de compétence",
    q: "Le club propose à l'AE d'encadrer bénévolement, sans aucune rémunération, une séance de perfectionnement technique avancé habituellement réservée à un enseignant titulaire d'un diplôme d'Etat, en avançant que l'absence de rémunération change la situation.",
    choices: [
      "Elle accepte : l'absence de rémunération la dispense de toute limite liée à son niveau de diplôme",

      "Elle accepte, en réduisant simplement la difficulté technique des exercices pour compenser l'absence d'un enseignant diplômé"
    ],
    correct: 2,
    expl: "La rémunération conditionne l'obligation de diplôme au titre de l'article L.212-1 du Code du sport, mais l'obligation générale de sécurité et de compétence envers les pratiquants ne disparaît pas en situation bénévole : un contenu technique avancé requiert l'encadrement d'un titulaire qualifié, rémunéré ou non. Une décharge ou un allègement improvisé du contenu ne remplacent pas cet encadrement."
  },
  {
    theme: "🚨 Conduite à tenir – Allergie sévère (anaphylaxie)",
    q: "Un stagiaire dont les parents ont signalé une allergie sévère aux piqûres de guêpe, avec ordonnance d'un stylo auto-injecteur d'adrénaline fourni au club, se fait piquer pendant un temps au pré et commence à gonfler au visage.",
    choices: [
      "Elle observe l'évolution pendant quelques minutes avant d'envisager d'utiliser le stylo auto-injecteur, pour ne pas l'utiliser inutilement",
      "Elle utilise sans délai le stylo auto-injecteur d'adrénaline prescrit conformément à l'ordonnance, puis alerte immédiatement les secours (15), même si les signes semblent s'atténuer ensuite",
      "Elle donne un antihistaminique de la trousse de secours générale en attendant de voir si cela suffit, sans utiliser le stylo prescrit",
      "Elle attend l'arrivée des parents, prévenus par téléphone, avant d'utiliser le matériel prescrit"

    correct: 1,
    expl: "Face à des signes d'allergie sévère chez une personne disposant d'une prescription d'adrénaline auto-injectable, le geste est immédiat, conformément à l'ordonnance, suivi d'une alerte systématique des secours : une réaction anaphylactique peut évoluer très vite et rechuter après une amélioration apparente. Attendre, substituer un antihistaminique non prescrit pour ce contexte, ou attendre les parents, retarde un geste vital."
  },
  {
    theme: "📋 Construction de séance – Restriction médicale non lue",
    q: "Un stagiaire revient d'une entorse de cheville avec un certificat médical de reprise mentionnant explicitement l'absence d'appui prolongé en position debout et un évitement des positions d'étrier serrées. L'AE n'a pas consulté ce certificat avant la séance et prévoit une reprise classique avec un temps de pansage debout prolongé et des étriers serrés.",
    choices: [
      "Elle maintient la séance prévue, le certificat n'ayant pas été présenté formellement en début de séance",
      "Elle prend connaissance des restrictions avant toute pratique, adapte le contenu de la séance (limitation du temps debout, réglage adapté ou dispense temporaire de cette contrainte) et ne fait pas comme si le certificat n'existait pas",
      "Elle maintient la séance normale, en demandant simplement au stagiaire de dire s'il ressent une douleur",
      "Elle annule totalement la présence du stagiaire à toute activité du club jusqu'à nouvel avis médical, sans chercher d'adaptation possible"
    ],
    correct: 1,
    expl: "Un certificat médical de reprise avec restrictions engage l'encadrant dès qu'il en a connaissance : la séance doit être adaptée à ces limitations précises, ni ignorée au prétexte d'un défaut de présentation formelle, ni gérée par la seule vigilance du stagiaire quant à la douleur. Une éviction totale et systématique, sans recherche d'adaptation, n'est pas non plus la réponse proportionnée."
  },
  {
    theme: "🚨 Conduite à tenir – Brûlure thermique légère",
    q: "En manipulant une bouilloire dans le local du club, un stagiaire se brûle légèrement l'avant-bras avec de l'eau chaude ; la peau rougit et une petite cloque commence à apparaître.",
    choices: [
      "Elle refroidit immédiatement la brûlure à l'eau du robinet, tiède à fraîche (pas glacée), pendant une quinzaine de minutes, sans percer la cloque, retire les bijoux ou vêtements serrés proches de la zone, et surveille l'évolution",
      "Elle applique immédiatement du beurre ou une pommade grasse sur la zone pour apaiser la douleur",
      "Elle perce la cloque avec une aiguille désinfectée pour évacuer le liquide et accélérer la cicatrisation",
      "Elle applique un glaçon directement sur la peau brûlée pour stopper rapidement la sensation de chaleur"
    ],
    correct: 0,
    expl: "Une brûlure thermique se refroidit à l'eau courante tempérée pendant plusieurs minutes (environ un quart d'heure), sans glace directe (qui aggrave la lésion par le froid) ; on ne perce jamais une cloque (risque infectieux) et on n'applique ni corps gras ni pommade non prescrite, qui emprisonnent la chaleur et gênent l'examen médical ultérieur."

  {
    theme: "⚖️ Réglementation encadrement – Double poste simultané non supervisable",
    q: "Pour gagner du temps, le club demande à l'AE de superviser en même temps un groupe en carrière au trot-galop et un second groupe non monté pansant à l'écurie, les deux postes n'étant pas visibles l'un depuis l'autre.",
    choices: [

      "Elle accepte, à condition de désigner un stagiaire responsable du second groupe en son absence",

      "Elle accepte, en confiant au groupe monté la consigne de continuer les exercices seuls pendant ses passages à l'écurie"
    ],
    correct: 2,
    expl: "La surveillance effective et continue des pratiquants est une condition de sécurité de base : un encadrant seul ne peut pas garantir une vigilance réelle sur deux postes simultanés et non visibles l'un de l'autre, a fortiori avec un groupe monté évoluant à une allure rapide. Des allers-retours, une délégation à un stagiaire non qualifié, ou un groupe monté laissé sans surveillance directe ne répondent pas à cette exigence."
  },
  {
    theme: "🚨 Conduite à tenir – Fracture ouverte",
    q: "Suite à une chute de cheval, un stagiaire présente une plaie au niveau de l'avant-bras d'où dépasse un fragment osseux, avec une déformation visible du membre.",
    choices: [
      "Elle tente de repositionner doucement l'os pour limiter la déformation avant l'arrivée des secours",
      "Elle ne mobilise pas le membre, ne tente aucune remise en place, couvre la plaie d'un tissu propre sans appuyer sur l'os visible, immobilise le membre dans la position trouvée si elle en a les moyens, et alerte les secours en décrivant précisément la situation",

    expl: "Une fracture ouverte ne se réaligne jamais sur place (risque d'aggraver les lésions vasculaires et nerveuses) : on immobilise dans la position trouvée, on couvre la plaie sans comprimer l'os exposé, et on alerte les secours avec une description précise. Tester la mobilité ou repositionner l'os sont des gestes proscrits pour un secouriste non médical."

  {

  {

    choices: [

  {

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, hygiène et construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
