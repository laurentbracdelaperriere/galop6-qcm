<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 1er septembre 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>1er septembre 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Autorité pédagogique absente",
    q: "L'enseignant diplômé d'État du club est malade le jour même. Le gérant demande à l'AE d'assurer seule, contre rémunération, l'intégralité des cours de la journée pour des groupes de débutants (niveaux Club), sans qu'aucun titulaire de diplôme de niveau IV ou plus ne soit désigné responsable pédagogique ni joignable ce jour-là.",
    choices: [
      "Elle peut assurer seule ces cours, le niveau Club étant en dessous du niveau Amateur explicitement exclu de ses prérogatives, ce qui suffit à couvrir la situation",
      "L'AE exerce toujours sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, quel que soit le niveau du public encadré : en l'absence de toute personne ainsi qualifiée désignée et joignable ce jour-là, elle ne peut pas assumer seule la responsabilité pédagogique de ces cours rémunérés",
      "Elle peut le faire à condition de limiter chaque cours à trente minutes, une durée réduite étant réputée neutraliser l'exigence d'autorité pédagogique",
      "Elle peut le faire si le gérant, non diplômé, accepte par écrit d'endosser lui-même la responsabilité pédagogique de la journée"
    ],
    correct: 1,
    expl: "Le périmètre de l'Animateur d'Équitation, fixé par le règlement fédéral et le livret pédagogique de la qualification, prévoit un exercice systématiquement placé sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus (BPJEPS, BEES, DE, DES). Cette condition ne dépend ni du niveau technique du public encadré, ni de la durée des cours : l'absence de toute personne qualifiée désignée et joignable pour assumer cette autorité pédagogique empêche l'AE de prendre seule la responsabilité de cours rémunérés, quelle que soit la bonne volonté du gérant non diplômé."
  },
  {

    choices: [
      "Le caractère informel et privé de l'arrangement, en dehors de toute structure, place cette activité hors du champ de l'obligation de qualification prévue par le Code du sport",

      "Cette activité est licite si l'AE informe simplement le voisin, oralement, qu'elle n'est pas titulaire d'un diplôme d'État"

    expl: "L'article L.212-1 du Code du sport vise « enseigner, animer ou encadrer une activité physique ou sportive […] contre rémunération », sans distinguer selon que cet enseignement s'exerce au sein d'une structure déclarée ou dans un cadre privé et informel. Un cours particulier payant reste donc un enseignement sportif rémunéré au sens de la loi : ni l'absence de structure, ni le montant perçu, ni une simple information orale au client ne dispensent l'AE de respecter le périmètre et les conditions d'encadrement attachés à sa qualification, notamment l'autorité pédagogique d'un titulaire de niveau IV ou plus."
  },
  {
    theme: "⚖️ Réglementation encadrement – Encadrement bénévole",
    q: "Le club traverse une période difficile. Par attachement à la structure, l'AE propose d'encadrer, strictement bénévolement et sans aucune contrepartie financière ou en nature, les mêmes créneaux qu'elle assurait auparavant contre salaire.",
    choices: [
      "L'obligation de qualification prévue par l'article L.212-1 du Code du sport vise spécifiquement l'enseignement sportif « contre rémunération » : en l'absence de toute contrepartie financière ou en nature, cette obligation particulière ne s'applique plus, sans que cela dispense pour autant l'AE de respecter les règles générales de sécurité et sa responsabilité en cas de faute",
      "Le bénévolat pur ne change rien : les mêmes exigences de qualification que pour un enseignement rémunéré continuent de s'appliquer à l'identique, y compris en l'absence de toute contrepartie",
      "Le bénévolat dispense totalement l'AE de toute forme de responsabilité, y compris en cas de faute caractérisée dans l'encadrement de la séance",
      "Le bénévolat n'est autorisé que si un contrat écrit de bénévolat est déposé en préfecture avant chaque créneau encadré"

    correct: 0,
    expl: "L'article L.212-1 du Code du sport encadre spécifiquement l'enseignement, l'animation ou l'encadrement d'une activité sportive « contre rémunération ». Un encadrement strictement bénévole, sans contrepartie financière ni en nature, sort donc du champ précis de cette obligation de qualification. Cela ne signifie toutefois pas une absence totale de cadre : les règles générales de sécurité des pratiquants et des tiers, ainsi que la responsabilité civile en cas de faute dans l'organisation ou la surveillance de l'activité, continuent de s'appliquer pleinement, bénévolat ou non."
  },
  {
    theme: "🛡️ Sécurité des pratiquants – Information sur l'assurance",
    q: "Un adulte débutant s'inscrit pour une unique « séance découverte » et refuse de souscrire une licence, expliquant qu'il « verra plus tard » s'il continue et ne veut pas payer une assurance pour un seul essai.",
    choices: [
      "Puisqu'il ne s'agit que d'une séance unique et non d'une inscription à l'année, aucune obligation légale relative à l'assurance ne concerne le club ni l'AE dans ce cas précis",

      "Il suffit de lui faire signer une décharge écrite renonçant à tout recours contre le club pour se dispenser de toute question d'assurance",
      "Cette obligation d'information ne concerne que les mineurs ; un adulte est réputé averti des risques sans qu'aucune information spécifique ne soit nécessaire"
    ],
    correct: 1,
    expl: "L'article L.321-1 du Code du sport impose aux groupements sportifs d'informer leurs adhérents et pratiquants de leur intérêt à souscrire un contrat d'assurance de personnes couvrant les dommages corporels auxquels leur pratique sportive peut les exposer. Cette obligation d'information s'applique dès la première pratique, y compris une séance découverte unique, s'adresse aussi bien aux adultes qu'aux mineurs, et n'est pas remplacée par une simple décharge de responsabilité signée par le pratiquant."
  },
  {
    theme: "🛡️ Sécurité des pratiquants – Absence d'assurance du club",
    q: "En évoquant le budget du club, le gérant confie à l'AE que la structure n'a jamais souscrit d'assurance couvrant sa responsabilité civile, « faute de moyens, et parce qu'il n'y a jamais eu de souci jusqu'ici ».",
    choices: [
      "L'absence d'incident passé démontre que cette assurance n'est pas indispensable et relève d'un choix de gestion propre au club, sans enjeu réglementaire particulier",
      "L'article L.321-1 du Code du sport impose aux groupements sportifs de souscrire des garanties d'assurance couvrant leur responsabilité civile ainsi que celle de leurs préposés, salariés ou bénévoles, et son défaut est pénalement sanctionné ; l'AE doit signaler la situation plutôt que la considérer comme un simple choix de gestion",
      "Cette obligation d'assurance ne concerne que les structures accueillant des mineurs ; un club n'accueillant que des adultes en est dispensé",

    correct: 1,
    expl: "L'article L.321-1 du Code du sport impose aux groupements sportifs (associations, sociétés) de souscrire, pour l'exercice de leur activité, des garanties d'assurance couvrant leur responsabilité civile ainsi que celle de leurs préposés salariés ou bénévoles et des pratiquants. Le défaut de souscription de cette assurance par le dirigeant d'une association sportive est pénalement sanctionné. Il ne s'agit donc pas d'un simple choix de gestion laissé à l'appréciation du club selon son historique d'incidents ou son public : l'AE, informée d'une telle absence, doit la signaler plutôt que la laisser sans suite."
  },
  {
    theme: "🛡️ Sécurité des pratiquants – Distance de sécurité entre binômes",
    q: "Dans une carrière de taille restreinte, l'AE fait travailler simultanément deux cavaliers aux longues rênes et un troisième à la longe, sans avoir organisé au préalable de zones ou de distances de sécurité entre ces trois binômes évoluant en même temps.",
    choices: [
      "Elle peut laisser les trois binômes s'organiser spontanément entre eux dans l'espace disponible, l'expérience de l'AE suffisant à intervenir en cas de besoin",
      "Avant de démarrer les exercices, elle définit et fait respecter des zones ou sens de circulation garantissant une distance de sécurité suffisante entre les trois binômes, plutôt que de compter sur une gestion improvisée une fois l'activité commencée",
      "Elle réduit uniquement la vitesse d'exécution des exercices, ce qui suffit à elle seule à garantir la sécurité malgré l'absence d'organisation spatiale préalable",
      "Elle considère que ce risque ne concerne que le travail monté, et non le travail aux longues rênes ou à la longe, réputé sans danger de collision"

    expl: "Faire évoluer simultanément plusieurs binômes cheval-cavalier ou meneur dans un espace restreint expose à un risque réel de collision, de bousculade ou de réaction de peur en chaîne. La sécurité des pratiquants impose d'organiser au préalable les zones, sens de circulation et distances de sécurité entre les groupes avant de démarrer l'exercice, plutôt que de laisser les binômes s'organiser spontanément, de se contenter de ralentir le rythme, ou de sous-estimer ce risque pour des exercices non montés comme le travail aux longues rênes ou à la longe."

  {

  {

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, hygiène et construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
