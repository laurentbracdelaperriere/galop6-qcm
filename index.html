<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 19 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>19 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un club fonctionne toute l'année en ne faisant appel qu'à des AE, sans qu'aucun titulaire de diplôme professionnel de niveau IV ou plus (BPJEPS, DEJEPS, BEES...) ne soit jamais présent ni rattaché à la structure : les AE assurent seules, à tour de rôle, l'intégralité des cours d'initiation.",
    choices: [
      "C'est conforme : l'AE est un diplôme fédéral qui l'habilite à enseigner seule, sans qu'un professionnel diplômé soit nécessairement rattaché à la structure",
      "Ce n'est pas conforme : l'exercice de l'AE suppose l'existence, au sein de la structure, d'une autorité pédagogique exercée par un titulaire de diplôme de niveau IV ou plus ; l'absence structurelle et permanente d'un tel professionnel ne peut être compensée par la seule présence d'AE, même expérimentées",
      "C'est conforme, à condition que chaque AE justifie d'au moins cinq ans d'expérience bénévole dans le club",
      "Ce n'est pas conforme, mais uniquement pour les cours accueillant des cavaliers mineurs ; pour un public exclusivement adulte, les AE peuvent fonctionner seules en permanence"
    ],
    correct: 1,
    expl: "L'AE encadre l'initiation et la découverte des activités équestres <strong>sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, DEJEPS, BEES ou équivalent). Cette autorité pédagogique doit exister de façon effective au sein de la structure : une organisation où aucun professionnel de ce niveau n'est jamais présent ni responsable ne respecte pas ce cadre, quelle que soit l'ancienneté des AE ou l'âge du public encadré."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise avec perte de connaissance",
    q: "Pendant le pansage, un stagiaire pâlit, dit se sentir mal, puis perd connaissance quelques secondes en glissant au sol. Quand l'AE le rejoint, il respire normalement et son thorax se soulève régulièrement, mais il ne répond pas quand elle lui parle.",
    choices: [
      "Elle l'assoit contre un mur, tête penchée entre les genoux, et lui fait boire immédiatement de l'eau sucrée pour le « faire revenir à lui »",
      "Elle le place en position latérale de sécurité, vérifie qu'il continue de respirer normalement, alerte le 15/112 en décrivant la situation, et le surveille sans le laisser seul jusqu'à l'arrivée des secours ou son réveil complet",
      "Comme il respire normalement, elle considère qu'il s'agit d'un simple malaise sans gravité et le laisse allongé sur le dos pendant qu'elle va prévenir un collègue, sans alerter les secours dans l'immédiat",
      "Elle le relève dès qu'il rouvre les yeux et le fait remarcher immédiatement pour « vérifier que tout va bien » avant de décider s'il faut alerter quelqu'un"
    ],
    correct: 1,
    expl: "Face à une <strong>victime inconsciente qui respire normalement</strong>, il faut la placer en position latérale de sécurité (PLS) pour maintenir ses voies aériennes libres, alerter le 15/112, et la surveiller en continu sans la laisser seule. Faire boire une personne inconsciente, la laisser sans surveillance sur le dos, ou la faire se relever brutalement dès qu'elle rouvre les yeux expose à un risque d'étouffement ou de récidive du malaise."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Un stagiaire mineur arrive à sa séance en ayant oublié son casque d'équitation ; il propose d'utiliser le casque de vélo qu'il a dans son sac pour ne pas manquer la séance montée.",
    choices: [
      "L'AE accepte : un casque de vélo protège « à peu près » de la même façon la tête en cas de chute",
      "L'AE accepte, mais uniquement pour des exercices au pas, considérant le risque comme réduit à cette allure",
      "L'AE n'autorise pas la monte avec ce casque non conforme à la norme équestre en vigueur ; le stagiaire peut participer aux activités à pied (pansage, soins) mais ne monte pas tant qu'un casque d'équitation homologué n'est pas disponible",
      "L'AE laisse le stagiaire monter sans aucun casque pour cette unique séance, en lui demandant d'apporter le sien la prochaine fois"
    ],
    correct: 2,
    expl: "Le port du casque à la <strong>norme équestre en vigueur (EN 1384)</strong> est obligatoire pour tout cavalier de moins de 18 ans dès qu'il est en selle. Un casque conçu pour un autre usage, comme le vélo, n'est pas conforme à cette norme et n'offre pas les mêmes garanties de protection en cas de chute de cheval : seule l'absence d'activité montée reste possible sans casque équestre homologué, quelle que soit l'allure envisagée."
  },
  {
    theme: "🚨 Conduite à tenir – Coup de chaleur",
    q: "En période de forte chaleur, un stagiaire devient très rouge, transpire abondamment, et se plaint de maux de tête et de vertiges pendant un exercice au trot.",
    choices: [
      "Elle lui fait boire d'un trait une boisson très sucrée et glacée, tout en poursuivant la séance à une allure réduite pour ne pas couper l'élan du groupe",
      "Elle arrête immédiatement l'effort, met le stagiaire à l'ombre au frais, le découvre partiellement, le refroidit avec de l'eau fraîche, le fait boire par petites gorgées s'il est conscient et capable d'avaler, le surveille et alerte le 15/112 en cas d'aggravation (confusion, somnolence, vomissements, perte de connaissance)",
      "Elle attend la fin de la séance prévue avant de s'occuper spécifiquement de lui, les maux de tête liés à la chaleur étant selon elle fréquents et sans gravité chez les cavaliers",
      "Elle le fait uniquement rester au pas sur son cheval à l'ombre, pensant qu'une activité légère aide à « faire circuler le sang »"
    ],
    correct: 1,
    expl: "Face à des <strong>signes précoces d'un coup de chaleur</strong> (rougeur, sueurs abondantes, maux de tête, vertiges), il faut arrêter l'effort sans délai, mettre au frais, refroidir progressivement (eau fraîche, linges humides), hydrater par petites gorgées si la victime est consciente, surveiller et alerter le 15/112 dès l'apparition de signes de gravité (confusion, somnolence, vomissements, perte de connaissance). Poursuivre l'effort, même réduit, ou attendre la fin de séance, retarde une prise en charge qui doit être immédiate."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "L'AE veut emmener un groupe pour une balade sur des chemins hors de la structure équestre. Parmi les mineurs du groupe, l'un est inscrit au club depuis longtemps et a signé la fiche d'inscription annuelle générale, mais aucune autorisation spécifique pour cette sortie hors du site n'a été donnée par ses parents.",
    choices: [
      "Elle l'emmène quand même : l'inscription annuelle générale vaut accord implicite des parents pour toutes les activités proposées par le club, y compris hors du site",
      "Elle ne l'emmène pas dans ce groupe hors structure tant qu'une autorisation parentale n'a pas été donnée spécifiquement pour cette sortie ; elle le rattache pour cette séance à une activité se déroulant sur la structure",
      "Elle part avec le groupe complet et appelle les parents depuis le chemin pour leur demander une confirmation orale une fois la sortie déjà commencée",
      "Elle demande à un autre mineur du groupe, dont les parents ont signé, de confirmer verbalement à sa place que « ça ne posera pas de problème »"
    ],
    correct: 1,
    expl: "La participation d'un mineur à une activité, en particulier une <strong>sortie hors de la structure équestre</strong>, suppose que ses parents ou représentants légaux en aient été informés et l'aient spécifiquement autorisée. Une inscription générale au club ne vaut pas autorisation pour toute activité, et une confirmation orale tardive ou indirecte ne remplace pas cette autorisation préalable."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme crânien",
    q: "Un stagiaire chute et se cogne la tête ; il portait son casque. Il ne perd pas connaissance et dit « ça va » tout de suite après, mais quelques minutes plus tard il se plaint que « la tête tourne » et vomit une fois.",
    choices: [
      "Comme il n'a pas perdu connaissance et portait un casque, l'AE le laisse se reposer seul à l'écart quelques minutes puis le remet en selle s'il « se sent mieux »",
      "Le port du casque et l'absence de perte de connaissance initiale suffisent à écarter tout risque ; elle se contente de noter l'épisode pour en informer les parents le soir",
      "Elle considère que les vertiges et le vomissement après un choc à la tête sont des signes de gravité, même sans perte de connaissance ni casque endommagé ; elle ne le laisse pas seul, ne le remet pas à cheval, et alerte le 15/112 sans délai",
      "Elle donne un antalgique au stagiaire et le laisse rentrer seul chez lui à pied pour se reposer au calme"
    ],
    correct: 2,
    expl: "Après un <strong>choc à la tête</strong>, des vertiges et un vomissement, même unique, sont des signes de gravité qui imposent un avis médical urgent, indépendamment du port du casque et même en l'absence de perte de connaissance initiale. La victime ne doit pas être laissée seule, ni remise en selle, ni renvoyée seule chez elle : l'AE alerte le 15/112 sans délai."
  },
  {
    theme: "🛡️ Sécurité du lieu de pratique",
    q: "Juste avant sa séance, l'AE remarque un affaissement du sol avec un trou visible dans un coin de la carrière extérieure.",
    choices: [
      "Elle utilise la carrière normalement : un trou visible et localisé ne représente pas selon elle un danger réel pour des cavaliers vigilants",
      "Elle demande seulement oralement aux cavaliers de « faire attention » en passant à cet endroit, sans modifier son tracé ni en parler à personne d'autre",
      "Elle interdit l'accès à cette zone, adapte immédiatement le tracé de sa séance pour l'éviter totalement, et informe sans délai le responsable de la structure de ce qu'elle a constaté",
      "Elle annule entièrement la séance, sans chercher à savoir si un autre espace de travail est disponible sur la structure ni en informer le responsable"
    ],
    correct: 2,
    expl: "La <strong>sécurité du lieu de pratique</strong> relève de la responsabilité de l'AE qui constate le danger : elle doit écarter les cavaliers de la zone dangereuse, adapter son tracé pour l'éviter complètement, et signaler sans délai l'anomalie au responsable de la structure afin qu'elle soit réparée. Se contenter d'une consigne orale, ignorer le danger, ou annuler sans chercher de solution ni prévenir personne ne répond pas correctement à la situation."
  },
  {
    theme: "🚨 Conduite à tenir – Arrêt cardio-respiratoire",
    q: "Un parent accompagnateur adulte s'effondre soudainement pendant qu'il observe la séance ; il ne répond pas quand l'AE lui parle et le stimule, et sa respiration est absente ou très irrégulière.",
    choices: [
      "Elle attend quelques minutes pour voir s'il « reprend ses esprits » avant d'envisager d'alerter les secours",
      "Elle le place d'abord en position latérale de sécurité, puis attend l'arrivée des secours sans autre geste, pour ne pas risquer de lui faire mal en le massant",
      "Elle masse uniquement une fois les secours arrivés sur place, pour laisser les professionnels prendre le relais dès le départ",
      "Elle fait alerter le 15/112 sans délai (elle-même ou par un témoin), débute immédiatement les compressions thoraciques, utilise un défibrillateur automatisé externe dès qu'il est disponible en suivant ses instructions vocales, et poursuit la réanimation jusqu'à l'arrivée des secours"
    ],
    correct: 3,
    expl: "Une victime qui ne répond pas et ne respire pas normalement est en <strong>arrêt cardio-respiratoire</strong> : il faut alerter sans délai, débuter immédiatement les compressions thoraciques et utiliser un défibrillateur automatisé externe (DAE) dès qu'il est disponible, un DAE pouvant être utilisé par tout témoin sans formation médicale grâce à ses instructions vocales. La PLS est contre-indiquée dans ce cas, et chaque minute sans massage réduit fortement les chances de survie : attendre n'est jamais une option."
  },
  {
    theme: "📋 Construction de séance / Progression pédagogique",
    q: "L'AE prépare une séance de saut d'obstacles pour des cavaliers débutants qui n'ont jamais sauté. Pour « voir leur niveau rapidement », elle envisage de leur faire directement sauter une barre à 60 cm au trot enlevé dès le début de la séance.",
    choices: [
      "Elle programme cette approche directe : le passage rapide à l'obstacle permet selon elle d'évaluer efficacement le niveau réel du groupe",
      "Elle construit une progression adaptée : exercices préparatoires au sol (cavalettis, barres à terre), puis obstacles très bas franchis d'abord au pas ou au trot assis, avant d'introduire un obstacle plus engageant une fois les prérequis maîtrisés par le groupe",
      "Elle démarre directement à 60 cm, mais uniquement pour les deux cavaliers du groupe qui lui semblent « les plus à l'aise à l'œil », les autres regardant depuis le centre de la carrière",
      "Elle propose l'obstacle à 60 cm à tout le groupe, en demandant simplement de ralentir l'allure si un cavalier semble en difficulté au moment de sauter"
    ],
    correct: 1,
    expl: "Une séance sécurisée repose sur une <strong>progression pédagogique</strong> adaptée au niveau réel du public : pour des débutants qui n'ont jamais sauté, il faut partir d'exercices préparatoires simples et peu risqués avant d'introduire un obstacle plus engageant. Exposer directement des débutants à un obstacle inadapté « pour tester », même en le réservant à quelques-uns ou en ajustant seulement l'allure, ne constitue pas une progression sécurisée et expose le groupe à un risque de chute évitable."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion d'atteinte du rachis",
    q: "Un cavalier chute lourdement et reste au sol ; il se plaint d'une vive douleur dans le cou en essayant légèrement de bouger, et ressent des fourmillements dans les bras.",
    choices: [
      "L'AE l'aide à se relever doucement pour l'installer plus confortablement en position assise, en le soutenant sous les bras",
      "Elle retire son casque immédiatement pour « mieux voir s'il a une plaie à la tête » avant l'arrivée des secours",
      "Elle ne mobilise pas la victime, lui demande de rester immobile sans essayer de se relever ni de tourner la tête, maintient le contact verbal avec elle, et alerte le 15/112 sans délai en décrivant les symptômes rapportés (douleur cervicale, fourmillements)",
      "Comme il n'y a pas de saignement visible, elle attend quelques minutes que « la douleur passe » avant de décider s'il faut réellement alerter les secours"
    ],
    correct: 2,
    expl: "Une douleur cervicale associée à des <strong>fourmillements dans les membres</strong> après une chute violente évoque une possible atteinte du rachis : il ne faut ni relever la victime, ni retirer son casque, ni la faire bouger de quelque façon que ce soit. L'AE la maintient immobile, garde le contact verbal, et alerte le 15/112 sans délai en décrivant précisément les symptômes observés, sans attendre une amélioration spontanée."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, urgences vitales, sécurité du lieu, progression pédagogique : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu de pratique, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
