<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 25 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>25 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le titulaire du diplôme de niveau IV référent de la structure est placé en arrêt maladie pour plusieurs semaines. Le gérant demande à l'AE de continuer à assurer seule l'ensemble des cours comme d'habitude, en le contactant simplement par téléphone en cas de problème sérieux.",
    choices: [
      "Elle accepte : un contact téléphonique possible en cas de pépin suffit à couvrir la période d'absence du titulaire",
      "Elle accepte, mais réduit d'elle-même et sans en informer personne le nombre de séances qu'elle assure seule",
      "Elle refuse d'assurer seule la totalité des cours tant qu'aucun titulaire de diplôme de niveau IV ou plus n'assure une présence ou un remplacement effectif permettant une réelle autorité pédagogique, et elle alerte le gérant sur ce point",
      "Elle accepte, à condition de faire signer par écrit au titulaire absent un accord de principe valable pour toute la durée de son arrêt"
    ],
    correct: 2,
    expl: "L'AE, diplôme de niveau III, doit exercer sous l'<strong>autorité pédagogique effective</strong> d'un titulaire de diplôme de niveau IV ou plus. Cette autorité suppose une présence ou un remplacement réel permettant d'encadrer, de trancher et d'intervenir si besoin — un simple contact téléphonique occasionnel en cas de problème grave, ou un accord écrit donné une fois pour toute une période d'absence, ne constitue pas cette autorité pédagogique. L'AE doit signaler la situation plutôt que d'assurer seule l'intégralité de l'activité sur la durée."
  },
  {
    theme: "🚨 Conduite à tenir – Fracture ouverte",
    q: "Après une chute, un stagiaire présente une déformation nette de l'avant-bras avec un fragment osseux visible à travers la peau. Il est conscient et se plaint d'une douleur très vive.",
    choices: [
      "Elle tente de remettre doucement l'os en place pour limiter les dégâts en attendant les secours",
      "Elle ne mobilise pas le bras, ne touche pas à la plaie ni à l'os visible, couvre la victime, la rassure, ne lui donne ni à boire ni à manger, et alerte immédiatement les secours",
      "Elle immobilise fermement le bras avec une attelle de fortune avant d'alerter les secours, pour éviter tout mouvement supplémentaire",
      "Elle lui fait boire un peu d'eau sucrée pour prévenir un malaise le temps que les secours arrivent"
    ],
    correct: 1,
    expl: "Face à une <strong>fracture ouverte</strong>, l'AE ne mobilise jamais le membre atteint et ne tente en aucun cas de remettre l'os en place : seul un geste de professionnel de santé est adapté. Elle ne touche pas à la plaie, ne donne ni à boire ni à manger (une anesthésie peut être nécessaire), rassure et couvre la victime contre le froid, puis <strong>alerte sans délai</strong> les secours (15 ou 18) en restant auprès d'elle jusqu'à leur arrivée."
  },
  {
    theme: "🩺 Santé – Allergie alimentaire",
    q: "Pendant une pause, un parent apporte un gâteau fait maison pour partager avec le groupe, sans indiquer précisément les ingrédients utilisés. L'AE sait qu'un des stagiaires présents est connu comme allergique aux fruits à coque.",
    choices: [
      "Elle laisse le stagiaire allergique goûter une toute petite part, pour ne pas le mettre à l'écart du groupe",
      "Elle empêche la distribution de ce gâteau au stagiaire allergique tant qu'elle n'a pas la certitude, confirmée par le parent qui l'a préparé, qu'il ne contient aucun fruit à coque ni trace",
      "Elle lui demande simplement de faire attention et de s'arrêter de manger s'il ressent quelque chose d'inhabituel",
      "Elle laisse faire, considérant que c'est aux parents du stagiaire allergique de gérer ce risque en dehors des séances"
    ],
    correct: 1,
    expl: "Face à un risque <strong>allergique connu</strong>, l'AE applique le principe de précaution : un aliment dont la composition exacte n'est pas garantie ne doit pas être donné à un stagiaire allergique, même en petite quantité et même si aucune réaction n'est encore survenue. Attendre un symptôme pour réagir, ou renvoyer la responsabilité aux parents pendant que l'activité se déroule sous sa surveillance, expose inutilement le stagiaire à un risque grave et évitable."
  },
  {
    theme: "📋 Construction de séance",
    q: "L'AE prépare une séance en extérieur pour l'après-midi. La météo annonce un risque d'orage en fin de journée, sans certitude sur l'horaire exact. Elle prévoit sa fiche de séance sans y intégrer d'alternative, en se disant qu'elle avisera sur place si le temps se dégrade.",
    choices: [
      "C'est une approche adaptée : improviser une solution au moment où l'orage arrive permet de rester réactive selon la situation réelle",
      "Elle aurait dû prévoir dès la préparation de la séance une solution de repli (report, activité en intérieur ou en manège) en cas de dégradation météo, plutôt que de compter sur l'improvisation le moment venu",
      "Elle aurait dû annuler purement et simplement la séance dès qu'un risque d'orage est annoncé, même incertain sur l'horaire",
      "Cela ne change rien à la préparation de la séance : la décision d'interrompre ou non revient uniquement au titulaire du diplôme professionnel, pas à l'AE"
    ],
    correct: 1,
    expl: "Construire une séance <strong>sécurisée</strong> implique d'anticiper les aléas prévisibles, dont la météo, dès la préparation — pas seulement de réagir une fois le risque déjà là. Prévoir une solution de repli (report, activité en intérieur ou en manège couvert) fait partie du travail de préparation. Cela ne veut pas dire annuler par principe dès qu'un risque incertain est annoncé, ni que la vigilance météo pendant la séance ne concernerait que le titulaire du diplôme professionnel : l'AE encadrant la séance reste elle aussi actrice de cette vigilance."
  },
  {
    theme: "🛡️ Sécurité collective – Carrière",
    q: "Pendant que plusieurs cavaliers évoluent au trot en carrière selon un sens de circulation défini, un stagiaire récemment arrivé coupe la piste en diagonale sans respecter ce sens ni les distances de sécurité avec les autres.",
    choices: [
      "Elle continue de superviser l'exercice en cours sans interrompre, en gardant simplement un œil plus attentif sur ce stagiaier",
      "Elle interrompt l'exercice en cours le temps de rappeler clairement les règles de circulation à l'ensemble du groupe, avant de reprendre",
      "Elle attend la fin de l'exercice prévu pour aborder le sujet avec le stagiaire concerné, en aparté",
      "Elle demande aux autres cavaliers de s'écarter davantage de ce stagiaier, sans revenir sur les règles de circulation elles-mêmes"
    ],
    correct: 1,
    expl: "Les règles de <strong>circulation en carrière</strong> (sens, distances, priorités entre allures) existent pour prévenir les collisions entre cavaliers. Un manquement en cours d'exercice crée un risque immédiat pour l'ensemble du groupe et doit être corrigé sur-le-champ, pas différé à la fin de l'exercice ni compensé seulement en éloignant les autres : l'AE interrompt et rappelle la règle à tous avant de reprendre en sécurité."
  },
  {
    theme: "🚨 Conduite à tenir – Coup de chaleur",
    q: "Lors d'une séance en plein soleil pendant une vague de chaleur, un stagiaire devient confus, peine à répondre correctement aux questions simples, et sa peau est chaude mais sèche, sans transpiration visible.",
    choices: [
      "Elle le fait boire abondamment et rapidement en priorité, avant toute autre action",
      "Elle reconnaît des signes de gravité (confusion, absence de transpiration), alerte immédiatement les secours, l'installe à l'ombre et le refroidit avec des linges frais et humides sans le laisser seul, sans le forcer à boire tant qu'il reste confus",
      "Elle l'asperge d'eau glacée pour faire chuter sa température corporelle le plus vite possible",
      "Elle le fait s'asseoir à l'ombre quelques minutes pour voir si ça passe, sans alerter puisqu'il n'a pas perdu connaissance"
    ],
    correct: 1,
    expl: "La <strong>confusion associée à une peau chaude et sèche</strong> (absence de transpiration) signale un coup de chaleur potentiellement grave, une urgence à ne pas sous-estimer même sans perte de connaissance. L'AE alerte sans attendre, installe la victime à l'ombre, la refroidit progressivement avec des linges frais et humides (une eau glacée provoque un choc thermique à éviter), et ne la fait pas boire tant que sa conscience est altérée — un trouble de conscience augmentant le risque de fausse route."
  },
  {
    theme: "🛡️ Sécurité du lieu – Sol de carrière",
    q: "Après une forte pluie de la nuit, l'AE arrive pour sa séance du matin et constate que certaines zones de la carrière sont détrempées et glissantes, alors que le reste du sol semble praticable.",
    choices: [
      "Elle déroule la séance prévue à l'identique, la carrière restant globalement praticable",
      "Elle vérifie l'état réel du sol avant de commencer, et adapte le contenu prévu (éviter les zones glissantes, limiter les allures vives ou les sauts) plutôt que de dérouler le programme tel quel",
      "Elle annule systématiquement toute séance montée dès qu'une partie du sol est humide, même limitée",
      "Elle laisse chaque cavalier juger lui-même des zones à éviter pendant l'exercice, sans consigne collective au préalable"
    ],
    correct: 1,
    expl: "La sécurité du lieu de pratique s'apprécie <strong>avant</strong> de démarrer une séance : un sol partiellement détrempé et glissant après de fortes pluies peut provoquer des glissades dangereuses, en particulier aux allures vives ou aux sauts. L'AE vérifie l'état réel du terrain et adapte son contenu en conséquence, sans pour autant annuler par principe une séance restant praticable ailleurs, et sans reporter cette évaluation sur les cavaliers eux-mêmes en l'absence de consigne collective claire."
  },
  {
    theme: "🩺 Santé – Traitement de crise absent",
    q: "Un stagiaire connu comme asthmatique arrive à sa séance en réalisant qu'il a oublié son inhalateur de secours à la maison. Il ne présente aucun symptôme au moment de l'accueil et insiste pour pratiquer normalement.",
    choices: [
      "Elle le laisse pratiquer exactement comme prévu, puisqu'il ne présente aucun symptôme visible pour l'instant",
      "Elle adapte ou limite l'intensité de l'effort demandé tant que son traitement de crise n'est pas disponible, et en informe les responsables, plutôt que de le laisser pratiquer normalement en pariant sur l'absence de crise",
      "Elle lui interdit toute présence sur le site tant qu'il n'a pas récupéré son inhalateur",
      "Elle lui demande simplement de prévenir immédiatement s'il ressent une gêne respiratoire pendant l'effort, sans rien changer par ailleurs"
    ],
    correct: 1,
    expl: "L'absence du <strong>traitement de crise</strong> d'un stagiaire asthmatique connu constitue un facteur de risque réel en cas d'effort intense, même en l'absence de symptôme au moment de l'accueil. L'AE ne se contente pas d'attendre un signe d'alerte pendant la pratique : elle adapte ou limite l'effort demandé, informe les responsables de la situation, plutôt que de pratiquer normalement en pariant sur l'absence de crise — sans pour autant exclure systématiquement le stagiaire de toute présence sur site."
  },
  {
    theme: "📋 Sécurité du matériel – Parcours d'obstacles",
    q: "L'AE reprend en fin de journée un parcours de petits obstacles utilisé sans incident par un autre groupe le matin même. Elle prévoit de l'utiliser tel quel avec son groupe suivant, sans revérifier son état.",
    choices: [
      "C'est une approche raisonnable : le parcours ayant déjà été utilisé sans problème le matin, il n'y a pas besoin de le revérifier",
      "Elle vérifie l'état du matériel (barres, chandeliers, plots) avant chaque utilisation, y compris lorsqu'il a déjà servi sans incident plus tôt dans la journée, plutôt que de se fier au contrôle précédent",
      "Elle se contente d'un rapide coup d'œil visuel depuis la sortie de la carrière, sans s'approcher du parcours",
      "Elle délègue cette vérification aux cavaliers du groupe suivant, qui la préviendront s'ils remarquent un problème en s'échauffant"
    ],
    correct: 1,
    expl: "Le fait qu'un parcours ait été utilisé sans incident par un groupe précédent ne garantit pas son état quelques heures plus tard : un chandelier peut avoir été déplacé ou déstabilisé, une barre fissurée ou mal reposée. Vérifier le matériel <strong>avant chaque utilisation</strong>, indépendamment des contrôles antérieurs dans la même journée, fait partie de la sécurité du lieu de pratique — un contrôle visuel distant ou délégué aux cavaliers ne remplace pas cette vérification par l'encadrant."
  },
  {
    theme: "🚨 Conduite à tenir – Alerter les secours",
    q: "Face à un accident sérieux nécessitant l'intervention des secours, l'AE compose le 15. Une fois la situation décrite (lieu, nature de l'accident, état de la victime), l'opérateur continue de lui poser des questions.",
    choices: [
      "Elle raccourcit l'appel dès que l'essentiel est dit, pour retourner au plus vite s'occuper de la victime",
      "Elle reste en ligne et répond aux questions de l'opérateur jusqu'à ce qu'il l'autorise explicitement à raccrocher, en suivant ses consignes",
      "Elle confie l'appel à un stagiaire présent pour pouvoir s'occuper de la victime pendant ce temps, sans vérifier ensuite que l'appel a bien abouti",
      "Elle attend d'avoir stabilisé complètement la victime avant d'appeler, afin de pouvoir donner des informations plus précises et complètes"
    ],
    correct: 1,
    expl: "Alerter les secours ne se limite pas à décrire une fois la situation : l'AE doit <strong>rester en ligne</strong> et suivre les consignes de l'opérateur, qui peut donner des instructions pour les premiers gestes ou avoir besoin de précisions complémentaires, jusqu'à ce qu'il indique explicitement que l'appel peut être terminé. L'alerte doit être donnée le plus tôt possible, pas après avoir tenté de stabiliser seule la victime, et déléguer l'appel sans s'assurer qu'il a bien été passé fait courir le risque qu'aucun secours ne soit réellement prévenu."
  }
];
let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, santé, construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
