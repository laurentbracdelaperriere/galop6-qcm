<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 3 septembre 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>3 septembre 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Périmètre de l'AE",
    q: "Le gérant du club, en sous-effectif ce jour-là, demande à l'AE d'encadrer seule, contre rémunération, un cours pour un groupe de cavaliers confirmés, aucun titulaire de diplôme professionnel (BPJEPS ou plus) n'étant présent ni joignable sur la structure.",
    choices: [
      "Elle accepte, le niveau confirmé du groupe rendant la supervision d'un diplômé d'État moins nécessaire que pour des débutants",
      "Elle refuse d'assurer seule cet encadrement rémunéré en l'absence de toute autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus, quel que soit le niveau du public concerné",
      "Elle accepte, à condition de faire signer une décharge de responsabilité aux cavaliers avant le cours",
      "Elle accepte pour cette fois seulement, en réduisant le cours à de la simple longe individuelle"
    ],
    correct: 1,
    expl: "La qualification d'AE ne permet pas d'encadrer seule, contre rémunération, hors de la présence et de l'autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus (Code du sport, art. L.212-1 et s.) : le niveau du public, une décharge signée par les cavaliers ou un contenu de séance allégé ne changent rien à cette exigence d'encadrement."
  },
  {
    theme: "🚨 Conduite à tenir – Fracture ouverte suspectée",
    q: "Après une chute, un cavalier présente un avant-bras très déformé avec un fragment osseux visible affleurant à travers la peau ; il est conscient, saigne modérément à cet endroit.",
    choices: [
      "Elle tente de replacer doucement le bras dans un axe normal avant de le poser, pour limiter la douleur en attendant les secours",
      "Elle couvre la plaie d'un pansement stérile sans appuyer sur l'os ni tenter de le repositionner, immobilise le membre dans la position trouvée sans forcer, ne donne rien à boire ni à manger, et alerte immédiatement les secours",
      "Elle nettoie abondamment la plaie à l'eau avant de la couvrir, pour limiter le risque infectieux avant l'arrivée des secours",
      "Elle applique un garrot serré au-dessus de la plaie par précaution, le saignement pouvant s'aggraver à tout moment"
    ],
    correct: 1,
    expl: "Devant une fracture ouverte, on ne réduit jamais la déformation ni ne nettoie la plaie soi-même : on couvre simplement d'un pansement stérile sans appuyer sur l'os, on immobilise dans la position trouvée sans forcer, on ne donne rien par voie orale (anesthésie possible aux urgences) et on alerte sans délai. Un garrot n'est justifié qu'en cas d'hémorragie massive incontrôlable, non ici."
  },
  {
    theme: "🩺 Hygiène – Suspicion de teigne (dermatophytose)",
    q: "L'AE remarque sur l'encolure d'un cheval plusieurs petites plaques rondes sans poils, à bordure squameuse, qui s'étendent depuis quelques jours ; plusieurs stagiaires ont pansé ce cheval à mains nues cette semaine.",
    choices: [
      "Elle continue à faire panser ce cheval normalement, ces plaques étant probablement de simples frottements de harnachement",
      "Elle écarte ce cheval du contact direct et du matériel commun tant qu'un avis vétérinaire n'a pas écarté une teigne, fait désinfecter le matériel utilisé, et recommande aux stagiaires concernés de surveiller leur peau et de consulter en cas de lésion similaire",
      "Elle traite elle-même les plaques avec un antifongique à usage humain trouvé dans la pharmacie du club",
      "Elle isole uniquement le matériel de pansage de ce cheval, sans modifier son utilisation en cours ni informer les stagiaires"
    ],
    correct: 1,
    expl: "La teigne équine est une zoonose fongique très contagieuse par contact direct et par le matériel : toute lésion évocatrice (plaques rondes alopéciques squameuses) impose d'écarter le cheval du contact et du matériel commun jusqu'à avis vétérinaire, de désinfecter le matériel utilisé et d'alerter les personnes exposées, sans attendre ni traiter soi-même l'animal."
  },
  {
    theme: "🛡️ Sécurité du lieu – Carrière détrempée après un orage",
    q: "Après un violent orage, la carrière prévue pour la séance présente de larges flaques et un sol visiblement gorgé d'eau par endroits, sans que le planning ne prévoie de changement.",
    choices: [
      "Elle maintient la séance normalement dans cette carrière, en évitant simplement les flaques les plus visibles au trot et au galop",
      "Elle évalue l'état réel du sol avant de faire évoluer les chevaux, et renonce à cette carrière au profit d'un autre lieu adapté ou d'un contenu de séance au pas si aucune surface sûre n'est disponible, plutôt que de maintenir le programme initial en comptant sur l'évitement des flaques",
      "Elle réduit uniquement les allures au trot, en excluant le galop, sans autre vérification du terrain",
      "Elle décale la séance de quinze minutes en espérant que l'eau s'infiltre suffisamment"
    ],
    correct: 1,
    expl: "Un sol détrempé et irrégulier après un orage augmente fortement le risque de glissade et de blessure : l'AE évalue réellement l'état du terrain avant d'y faire évoluer les chevaux et adapte le lieu ou le contenu de la séance en conséquence, plutôt que de maintenir le programme en misant sur l'évitement des flaques ou un simple délai insuffisant."
  },
  {
    theme: "📋 Construction de séance – Allergie non signalée découverte en séance",
    q: "En cours de séance de pansage, un stagiaire adulte présente soudainement des plaques rouges qui démangent sur les bras et le visage au contact du cheval, sans antécédent connu ni allergie mentionnée sur sa fiche.",
    choices: [
      "Elle lui fait porter des gants et continuer le pansage à distance du cheval, la réaction étant probablement mineure",
      "Elle l'éloigne immédiatement du contact avec le cheval et de la zone, surveille l'apparition d'autres signes (gêne respiratoire, gonflement du visage, malaise), et oriente vers un avis médical si les symptômes persistent ou s'aggravent",
      "Elle lui demande de se laver rapidement les mains et de reprendre le pansage si les démangeaisons diminuent",
      "Elle attend la fin de la séance pour voir si les plaques disparaissent d'elles-mêmes avant d'agir"
    ],
    correct: 1,
    expl: "Une réaction cutanée brutale au contact d'un animal, même sans antécédent connu, impose d'éloigner immédiatement la personne de l'exposition et de surveiller l'apparition de signes de gravité (respiratoires, gonflement, malaise), qui évoqueraient une réaction allergique évolutive nécessitant un avis médical sans délai. Poursuivre le contact même à distance, ou attendre la fin de séance, retarde une prise en charge éventuellement nécessaire."
  },
  {
    theme: "⚖️ Réglementation encadrement – Mineur sans autorisation à jour",
    q: "Un enfant se présente pour une séance de découverte alors que sa fiche sanitaire de liaison et l'autorisation parentale ne sont pas remplies, son parent l'ayant simplement déposé avant de repartir travailler, injoignable dans l'immédiat.",
    choices: [
      "Elle fait participer l'enfant à la séance comme les autres, les documents pouvant être régularisés le lendemain",
      "Elle ne fait pas participer l'enfant à l'activité tant que l'autorisation parentale et la fiche sanitaire ne sont pas recueillies, et cherche une solution d'accueil non risquée en attendant de joindre le parent",
      "Elle fait participer l'enfant, mais uniquement à des exercices à pied sans monte, considérant cela comme suffisamment sûr sans document",
      "Elle demande à un autre enfant présent de confirmer verbalement que la famille est d'accord pour le laisser participer"
    ],
    correct: 1,
    expl: "L'autorisation parentale et la fiche sanitaire de liaison (antécédents, allergies, personnes à prévenir) sont des conditions préalables à l'accueil d'un mineur sur une activité à risque : en leur absence, l'enfant ne participe pas à l'activité, y compris à pied, et une solution d'attente sans risque est recherchée plutôt que de régulariser après coup ou de se fier à un accord oral non vérifié."
  },
  {
    theme: "🚨 Conduite à tenir – Choc anaphylactique après piqûre de guêpe",
    q: "Un stagiaire piqué par une guêpe pendant le pansage voit en quelques minutes son visage et ses lèvres gonfler, développe des plaques sur tout le corps et commence à avoir du mal à respirer ; il indique posséder un stylo auto-injecteur d'adrénaline prescrit pour ce risque connu.",
    choices: [
      "Elle l'installe au calme, surveille l'évolution sans utiliser le stylo auto-injecteur, celui-ci devant être réservé à un médecin, et attend de voir si les symptômes régressent avant d'alerter",
      "Elle aide immédiatement à l'utilisation du stylo auto-injecteur d'adrénaline prescrit, installe la personne en position adaptée à son état (assise si gêne respiratoire, allongée jambes surélevées en l'absence de gêne respiratoire), et alerte les secours sans délai en décrivant les signes",
      "Elle fait d'abord boire un antihistaminique trouvé dans une trousse de secours avant d'envisager toute autre mesure",
      "Elle attend l'arrivée des secours sans intervenir, pour ne pas risquer d'aggraver la situation en utilisant un dispositif médical"
    ],
    correct: 1,
    expl: "Des signes d'anaphylaxie (œdème du visage, urticaire généralisée, gêne respiratoire) après une piqûre imposent l'usage sans délai du stylo auto-injecteur d'adrénaline prescrit à la personne concernée, l'installation en position adaptée à son état, et une alerte immédiate des secours : attendre, se limiter à un antihistaminique, ou refuser d'utiliser le dispositif prescrit expose à une aggravation potentiellement mortelle en quelques minutes."
  },
  {
    theme: "🛡️ Sécurité collective – Refus de porter le casque",
    q: "Un cavalier adulte, bon niveau, demande à monter sans casque pour la séance, expliquant qu'il « monte comme ça depuis toujours » et que cela ne le dérange pas d'assumer le risque.",
    choices: [
      "Elle accepte, un cavalier adulte étant libre d'assumer lui-même ce risque pour sa propre sécurité",
      "Elle n'engage pas la séance tant que le cavalier ne porte pas un casque conforme, le port du casque étant une règle de sécurité de la structure et de l'activité encadrée, quel que soit le niveau ou l'âge du cavalier",
      "Elle accepte, à condition que le cavalier reste uniquement au pas pendant toute la séance",
      "Elle accepte pour cette séance, mais l'informe qu'elle refusera la prochaine fois"
    ],
    correct: 1,
    expl: "Le port du casque est une règle de sécurité qui s'impose à toute personne montée dans le cadre d'une activité encadrée, indépendamment de l'âge, du niveau ou de l'accord personnel du cavalier à assumer un risque : l'AE n'engage pas la séance sans ce port, ni en le limitant au pas ni en tolérant une exception ponctuelle."

  {

      "Elle lui propose de l'eau uniquement, un apport sucré pouvant être dangereux sans avis médical préalable"
    ],
    correct: 1,
    expl: "Des signes évocateurs d'hypoglycémie chez un diabétique connu et conscient, capable d'avaler, justifient un resucrage rapide immédiat, une surveillance au repos, et une alerte des secours en l'absence d'amélioration rapide ou en cas de perte de connaissance. Le laisser sans apport sucré, le faire poursuivre une activité, ou refuser tout resucrage par prudence excessive retardent une prise en charge simple et efficace."
  },
  {
    theme: "⚖️ Réglementation encadrement – Niveau de public encadrable par l'AE",
    q: "Le club souhaite confier à l'AE, seule sur le terrain sous la responsabilité générale mais non la présence physique constante d'un titulaire de diplôme professionnel disponible à proximité immédiate, la préparation individuelle d'un cavalier au concours de saut d'obstacles de niveau régional.",
    choices: [
      "Elle accepte cette mission de perfectionnement technique de haut niveau, sa qualification d'AE couvrant tout type de public dès lors qu'un responsable existe quelque part dans la structure",

      "Elle accepte, à condition que le cavalier signe une attestation reconnaissant les limites de compétence de l'encadrant"
    ],
    correct: 1,
    expl: "La qualification d'AE est adaptée à l'animation et à l'encadrement de publics de découverte et de premiers niveaux dans un cadre défini par la fédération, sous l'autorité pédagogique effective d'un titulaire de diplôme professionnel ; elle ne couvre pas la préparation technique individualisée à la compétition de niveau régional. Réduire le contenu à du plat ou faire signer une attestation ne pallient pas ce dépassement de périmètre."

  {

    expl: "Une sangle nettement effilochée peut céder brutalement sous tension, y compris au pas : elle doit être retirée de l'usage sans délai et remplacée, sans chercher à compenser par un resserrage supplémentaire, un repositionnement de la zone abîmée ou une limitation d'allure, qui ne suppriment pas le risque de rupture."
  },
  {
    theme: "🚨 Conduite à tenir – Saignement de nez important après un coup de longe",

    choices: [
      "Elle lui fait pencher la tête en arrière pour éviter que le sang ne coule sur les vêtements, en attendant que ça s'arrête",

    expl: "Un saignement de nez se prend en charge tête penchée en avant (jamais en arrière, pour éviter d'avaler ou d'inhaler le sang), en pinçant fermement la partie molle du nez sans relâcher trop tôt, avec du froid en complément ; un avis médical s'impose si le saignement persiste ou en cas de doute sur une fracture associée au traumatisme. Pencher la tête en arrière ou se moucher immédiatement après favorisent au contraire la reprise du saignement ou son inhalation."
  },
  {
    theme: "🩺 Hygiène – Suspicion de gale ou de poux chez un stagiaire",

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, santé, construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
