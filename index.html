<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 27 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>27 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "En pleine séance en manège, le titulaire du diplôme référent doit s'absenter en urgence et demande à l'AE de continuer seule les 40 minutes restantes, en étant injoignable pendant ce temps.",
    choices: [
      "Elle continue normalement la séance, celle-ci ayant déjà débuté sous l'autorité du diplômé avant son départ",
      "Elle adapte ou interrompt l'activité tant qu'aucun titulaire de diplôme de niveau IV ou plus n'est en mesure d'assurer une autorité pédagogique effective et joignable, et en informe la structure",
      "Elle continue mais raccourcit elle-même la séance de moitié, sans en avertir ni le diplômé ni la structure",
      "Elle confie la supervision informelle du reste du groupe à un stagiaire plus expérimenté pendant qu'elle continue à encadrer normalement"
    ],
    correct: 1,
    expl: "L'autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus doit être <strong>continue</strong> pendant toute la séance (Code du sport, art. L.212-1 et s.) : qu'elle ait débuté sous ce cadre ne suffit pas si le diplômé devient injoignable. L'AE adapte ou interrompt l'activité et alerte la structure, plutôt que de décider seule une solution de fortune ou de déléguer à un stagiaire non qualifié."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise et perte de connaissance brève",
    q: "Après une longue attente debout au soleil, un stagiaire pâlit, dit se sentir mal, puis perd connaissance quelques secondes avant de se réveiller, un peu confus mais répondant aux questions.",
    choices: [
      "Elle le fait immédiatement se relever et marcher pour \"faire circuler le sang\"",
      "Elle l'allonge, surélève ses jambes, desserre les vêtements serrés, vérifie le retour à un état normal, et alerte les secours si la perte de connaissance se prolonge, se répète ou si des signes inhabituels apparaissent",
      "Elle le fait asseoir tête entre les genoux et lui fait boire aussitôt un verre d'eau sucrée, avant même qu'il ait pleinement repris conscience",
      "Elle considère qu'il s'agit d'un simple coup de chaud sans gravité et le renvoie en activité dès qu'il rouvre les yeux"
    ],
    correct: 1,
    expl: "Après une perte de connaissance brève, on allonge la personne, jambes surélevées, on desserre ce qui pourrait gêner, et on surveille le retour à un état normal avant toute reprise d'activité ; les secours sont alertés si la situation se prolonge, se répète ou paraît inhabituelle. On ne fait <strong>jamais boire</strong> quelqu'un qui n'a pas pleinement repris conscience (risque de fausse route), et on ne minimise pas une perte de connaissance, même brève."
  },
  {
    theme: "🩺 Santé – Traitement anticoagulant et saignement",
    q: "L'AE sait qu'un stagiaire adulte est sous traitement anticoagulant. Il se coupe légèrement le doigt et le saignement met un temps inhabituellement long à s'arrêter malgré une compression.",
    choices: [
      "Elle attend que le saignement s'arrête tout seul, comme pour n'importe quelle petite coupure, sans rien changer à sa prise en charge",
      "Elle maintient une compression prolongée et ferme, surveille l'évolution, et oriente vers un avis médical si le saignement ne se contrôle pas rapidement, en tenant compte du traitement connu du stagiaire",
      "Elle pose un garrot serré au-dessus de la coupure pour arrêter le saignement plus vite",
      "Elle laisse la plaie à l'air libre sans compression, pour que le sang coagule plus vite au contact de l'air"
    ],
    correct: 1,
    expl: "Une compression franche et prolongée reste le geste de base devant un saignement, mais un traitement anticoagulant connu impose une vigilance accrue et une orientation médicale rapide si le saignement persiste. Un <strong>garrot</strong> n'est jamais indiqué pour une coupure superficielle qui saigne longtemps, et laisser une plaie sans compression ne favorise pas la coagulation : c'est une idée fausse."
  },
  {
    theme: "📋 Construction de séance – Orage en carrière extérieure",
    q: "En pleine séance dans une carrière extérieure clôturée de barrières métalliques, l'AE entend le tonnerre se rapprocher et voit le ciel s'assombrir rapidement.",
    choices: [
      "Elle continue la séance tant qu'il ne pleut pas, la pluie étant selon elle le seul vrai risque à surveiller",
      "Elle interrompt immédiatement l'activité, fait mettre pied à terre, et évacue vers un bâtiment en dur en s'éloignant des structures métalliques et des arbres isolés, jusqu'à la fin de l'épisode orageux",
      "Elle fait mettre pied à terre mais reste avec le groupe près de la clôture métallique de la carrière, à l'abri sous un arbre isolé en bordure",
      "Elle raccourcit simplement les rênes et fait poursuivre la séance au pas, jugeant que l'orage est encore loin"
    ],
    correct: 1,
    expl: "Le tonnerre qui se rapproche impose d'interrompre immédiatement l'activité et de rejoindre un bâtiment en dur, en s'éloignant des éléments qui attirent la foudre (clôtures métalliques, arbres isolés) : ce sont des refuges dangereux, pas des abris. Attendre la pluie pour réagir, ou continuer même au pas, expose inutilement le groupe."
  },
  {
    theme: "🛡️ Sécurité collective – Cheval suspendu par l'attache",
    q: "En écurie, un cheval attaché avec une longe classique recule brutalement et se retrouve suspendu par la tête, paniqué et se débattant.",
    choices: [
      "Elle s'approche immédiatement de la tête du cheval pour tenter de le calmer à la main",
      "Elle écarte les personnes de la zone de danger et détache ou coupe la longe dès que possible en toute sécurité pour libérer le cheval, sans jamais se placer dans l'axe de ses mouvements de panique",
      "Elle laisse le cheval se débattre seul jusqu'à ce qu'il se calme spontanément, sans intervenir",
      "Elle tire fermement sur la longe pour l'aider à se redresser plus vite"
    ],
    correct: 1,
    expl: "Un cheval suspendu par l'attache et pris de panique peut se blesser gravement et blesser quiconque s'approche dans l'axe de ses mouvements : la priorité est d'écarter les personnes puis de libérer l'animal (détacher ou couper la longe) dès que cela peut être fait en sécurité. S'approcher de la tête ou tirer sur la longe aggrave le risque, et ne pas intervenir du tout expose le cheval à une blessure sérieuse."
  },
  {
    theme: "🚨 Conduite à tenir – Réaction allergique sévère",
    q: "Un stagiaire connu comme allergique aux piqûres de guêpes, disposant d'un auto-injecteur d'adrénaline prescrit dont l'AE connaît la procédure d'usage, se fait piquer et présente rapidement un gonflement du visage et une gêne respiratoire.",
    choices: [
      "Elle attend de voir si les symptômes s'aggravent avant d'utiliser l'auto-injecteur, pour ne pas l'administrer inutilement",
      "Elle alerte immédiatement les secours (15/112), utilise l'auto-injecteur d'adrénaline prescrit selon la procédure connue, et surveille le stagiaire en position adaptée jusqu'à leur arrivée",
      "Elle donne un antihistaminique oral qu'elle a dans sa propre trousse, jugé plus rapide à administrer que l'auto-injecteur",
      "Elle allonge le stagiaire et attend simplement l'arrivée de ses parents, prévenus par téléphone"
    ],
    correct: 1,
    expl: "Devant des signes de réaction allergique sévère (gonflement du visage, gêne respiratoire) chez une personne disposant d'un auto-injecteur d'adrénaline prescrit, l'urgence est d'alerter les secours et d'utiliser sans délai ce dispositif selon la procédure connue : chaque minute compte face à un risque de choc anaphylactique. Attendre, substituer un médicament personnel non prescrit, ou se contenter de prévenir les parents ne remplace pas l'alerte des secours ni l'usage de l'auto-injecteur."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une structure demande à l'AE de faire passer et valider seule les Galops d'un groupe de cavaliers, en l'absence de tout titulaire de diplôme professionnel, \"puisqu'elle connaît bien le niveau de chacun\".",
    choices: [
      "Elle accepte et fait passer les évaluations seule, sa connaissance du groupe suffisant selon elle à garantir l'objectivité de la validation",
      "Elle refuse de valider seule cette évaluation en l'absence d'autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus, et transmet la demande à la structure pour qu'un diplômé l'organise",
      "Elle accepte, à condition de faire valider ses évaluations a posteriori par un diplômé, une fois les Galops déjà délivrés aux stagiaires",
      "Elle accepte de faire passer les évaluations, mais uniquement pour les stagiaires qu'elle encadre depuis plus d'un an"
    ],
    correct: 1,
    expl: "Valider une évaluation de niveau relève d'un acte pédagogique qui requiert la même autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus que l'enseignement lui-même : l'ancienneté du suivi ou une bonne connaissance du groupe ne s'y substituent pas. Une validation a posteriori par un diplômé ne répare pas l'absence d'autorité pédagogique effective au moment de l'évaluation elle-même."
  },
  {
    theme: "🩺 Santé – Grossesse déclarée et poursuite de la pratique",
    q: "Une stagiaire régulière informe l'AE qu'elle est enceinte de quelques semaines et souhaite continuer à monter normalement comme avant, sans en avoir parlé à son médecin.",
    choices: [
      "Elle la laisse continuer à pratiquer exactement comme avant, la grossesse ne changeant rien tant qu'elle se sent bien",
      "Elle lui indique qu'une activité à risque de chute comme l'équitation nécessite un avis médical actualisé confirmant l'absence de contre-indication, l'oriente vers cette démarche, et n'envisage une pratique adaptée qu'au vu des préconisations obtenues",
      "Elle lui interdit d'elle-même, définitivement et sans en discuter, toute activité équestre pour le reste de sa grossesse",
      "Elle la fait uniquement participer à l'entretien du cheval au sol, sans lui expliquer pourquoi ni évoquer la démarche à suivre"
    ],
    correct: 1,
    expl: "Une grossesse modifie les risques d'une activité exposée aux chutes : l'aptitude doit être réévaluée par un avis médical actualisé, comme pour toute situation nouvelle affectant l'aptitude à la pratique. L'AE n'a ni à laisser continuer sans réévaluation, ni à trancher seule une interdiction médicale de sa propre initiative ; elle oriente vers la démarche appropriée et explique sa décision plutôt que d'écarter la stagiaire sans dialogue."
  },
  {
    theme: "📋 Sécurité du matériel – Sangle effilochée avant le montoir",
    q: "Juste avant de faire monter les stagiaires, l'AE remarque qu'une sangle présente une zone très effilochée près de la boucle, sur une selle déjà posée sur un cheval prêt à être monté.",
    choices: [
      "Elle laisse monter avec cette sangle pour cette séance, en surveillant simplement de plus près ce cheval pendant le cours",
      "Elle retire immédiatement cette sangle de l'utilisation, la remplace avant de faire monter, et signale le matériel défectueux à la structure pour qu'il soit réparé ou écarté durablement",
      "Elle resserre davantage la sangle pour compenser la zone fragilisée",
      "Elle change uniquement de cheval le stagiaire prévu sur cette selle, en gardant la même sangle sur un autre cheval pour la suite de la séance"
    ],
    correct: 1,
    expl: "Une sangle effilochée près de la boucle est un point de rupture identifié : elle doit être retirée de l'usage avant tout montoir, pas seulement surveillée de plus près pendant le cours. Resserrer ne renforce pas une zone fragilisée, et déplacer la sangle sur un autre cheval ne fait que reporter le même risque ailleurs plutôt que de l'écarter."
  },
  {
    theme: "🚨 Conduite à tenir – Coup de sabot dans l'abdomen",
    q: "Pendant le pansage, un stagiaire se fait surprendre par un cheval qui rue et reçoit un coup de sabot dans le ventre ; il se plie de douleur mais reste conscient, la douleur persistant nettement après quelques minutes.",
    choices: [
      "Elle le fait s'asseoir et boire un peu d'eau pour qu'il se détende, en attendant que la douleur passe naturellement",
      "Elle allonge le stagiaire au calme, ne lui donne ni à boire ni à manger, surveille son état, et alerte les secours devant un traumatisme abdominal par coup de sabot avec douleur persistante",
      "Elle lui fait reprendre une activité légère pour \"vérifier que tout va bien\", la douleur devant disparaître rapidement si ce n'est pas grave",
      "Elle applique une poche de froid directement sur la zone et considère que cela suffit, sans surveillance particulière ni alerte"
    ],
    correct: 1,
    expl: "Un coup de sabot dans l'abdomen avec douleur qui persiste évoque un possible traumatisme interne : on allonge la victime au calme, on ne lui donne <strong>ni à boire ni à manger</strong> (au cas où une intervention serait nécessaire), on surveille son état et on alerte les secours. Faire reprendre une activité ou se contenter d'une poche de froid sans alerte ni surveillance méconnaît la gravité potentielle d'un tel traumatisme."
  }
];
let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, santé, construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
