<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 24 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>24 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une AE est sollicitée par une colonie de vacances, structure totalement extérieure à son club employeur, pour encadrer seule des activités poney pendant un séjour d'une semaine, contre une rémunération versée directement par l'organisateur du séjour. Aucun titulaire de diplôme de niveau IV ou plus n'est prévu sur place pour cette activité.",
    choices: [
      "Elle accepte : le lien avec un organisme extérieur à son club habituel change le cadre et l'autorise à agir en toute autonomie",
      "Elle accepte, à condition que les activités restent limitées à des baptêmes poney très simples, sans exercice technique",
      "Elle refuse d'encadrer seule cette activité : quel que soit l'employeur ou l'organisateur, l'AE reste un diplôme de niveau III qui doit toujours agir sous l'autorité pédagogique d'un titulaire de niveau IV ou plus pour exercer contre rémunération",
      "Elle accepte, à condition d'être couverte par une assurance responsabilité civile personnelle pour la durée du séjour"
    ],
    correct: 2,
    expl: "Le périmètre d'exercice de l'AE est attaché à sa <strong>qualification</strong>, pas à l'identité de l'employeur ou de l'organisateur qui la sollicite. Diplôme de niveau III, l'AE doit toujours agir <strong>sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, DE, DES...) pour encadrer contre rémunération, qu'il s'agisse de son club habituel ou d'une colonie de vacances extérieure. Ni la simplicité apparente de l'activité (baptêmes poney), ni une assurance personnelle ne créent de dérogation à cette autorité pédagogique obligatoire."
  },
  {
    theme: "🚨 Conduite à tenir – Chute avec le cheval",
    q: "Lors d'un exercice, un cheval trébuche et tombe, entraînant son cavalier au sol sous lui. L'animal se débat pour se relever pendant que le cavalier reste coincé quelques instants sous son poids.",
    choices: [
      "Elle se précipite immédiatement pour dégager le cavalier de sous le cheval, avant même que celui-ci ne se soit relevé",
      "Elle évalue d'abord le danger que représente le cheval en train de se débattre, sécurise la zone et n'intervient auprès du cavalier qu'une fois l'animal relevé et écarté ou maîtrisé, avant d'alerter si besoin",
      "Elle laisse le cavalier gérer seul la situation avec le cheval, sans intervenir, pour ne pas se mettre en danger elle-même",
      "Elle attrape immédiatement le cheval par la bride pour le forcer à se relever plus vite, sans se soucier du cavalier au sol"
    ],
    correct: 1,
    expl: "Le premier réflexe d'un secouriste est toujours de <strong>protéger</strong> avant d'agir : un cheval qui se débat pour se relever peut blesser gravement quiconque s'approche trop tôt, y compris le sauveteur. L'AE évalue le danger, sécurise la zone (autres cavaliers, cheval), et n'intervient auprès de la victime qu'une fois le danger animal maîtrisé — jamais en se précipitant sous un cheval encore instable, ni en abandonnant la victime, ni en agissant sur le cheval sans considérer le cavalier au sol."
  },
  {
    theme: "🩺 Santé – Accueil et aptitude",
    q: "Un nouveau stagiaire se présente pour sa toute première séance. L'AE réalise qu'aucune fiche de renseignements sur sa santé (allergies, traitements en cours, antécédents) n'a été demandée ni recueillie par la structure lors de son inscription.",
    choices: [
      "Elle démarre la séance normalement : en l'absence d'information transmise, elle part du principe qu'il n'y a aucune contre-indication",
      "Elle signale le manque à l'accueil et fait en sorte que ces informations essentielles soient recueillies avant que le stagiaire ne pratique, plutôt que de commencer sans aucune visibilité sur son état de santé",
      "Elle demande oralement au stagiaire, entre deux exercices déjà commencés, s'il a des soucis de santé particuliers",
      "Elle considère que ce n'est pas de son ressort et que seul le certificat médical compte, indépendamment des autres informations de santé"
    ],
    correct: 1,
    expl: "Connaître les <strong>informations de santé essentielles</strong> d'un pratiquant (allergies, traitements, contre-indications) avant qu'il ne commence à pratiquer fait partie des conditions d'un accueil sécurisé, au même titre que le certificat médical. Débuter une séance sans aucune visibilité sur l'état de santé d'un stagiaire expose à ne pas savoir réagir en cas d'incident (allergie, traitement en cours). L'AE doit faire remonter ce manque et s'assurer que ces informations sont recueillies avant la pratique, pas pendant ni après."
  },
  {
    theme: "📋 Construction de séance",
    q: "L'AE reçoit la semaine prochaine un groupe qu'elle n'a encore jamais encadré : des adultes débutants complets, alors qu'elle anime d'ordinaire des groupes d'enfants déjà initiés. Elle prévoit de reprendre telle quelle la fiche de séance qui fonctionnait bien avec ses groupes habituels, « puisque les objectifs restent globalement les mêmes ».",
    choices: [
      "Elle reprend la fiche telle quelle : une fiche de séance qui a fait ses preuves reste valable quel que soit le public",
      "Elle adapte les exercices à la marge, sur place, si elle sent que ça ne convient pas au groupe, sans revoir la fiche à l'avance",
      "Elle construit une fiche de séance spécifique à ce nouveau public avant la séance, en tenant compte de ses caractéristiques propres (âge, niveau, découverte totale de l'activité) plutôt que de transposer un contenu pensé pour un public différent",
      "Elle simplifie uniquement le vocabulaire employé pendant la séance, en gardant les mêmes exercices et le même déroulé"
    ],
    correct: 2,
    expl: "Une fiche de séance doit être construite en tenant compte des <strong>caractéristiques du public</strong> auquel elle s'adresse (âge, niveau, expérience). Un contenu pensé pour des enfants déjà initiés n'est pas transposable sans adaptation à des adultes découvrant totalement l'activité : les repères, les risques et les besoins pédagogiques diffèrent. Anticiper cette adaptation avant la séance, plutôt que d'improviser sur place ou de se contenter d'ajuster le vocabulaire, fait partie de la construction sécurisée d'une séance."
  },
  {
    theme: "🛡️ Sécurité des tiers",
    q: "Pendant que l'AE encadre un groupe monté en manège, elle remarque des parents venus assister à la séance qui entrent directement dans l'enceinte du manège, pour prendre des photos de plus près, pendant que les chevaux évoluent.",
    choices: [
      "Elle continue la séance sans interrompre, en leur demandant simplement à distance de faire attention",
      "Elle interrompt l'activité en cours, fait sortir immédiatement ces personnes de l'enceinte de pratique, et ne reprend qu'une fois la zone à nouveau sécurisée",
      "Elle laisse faire tant qu'ils restent le long de la clôture, sans s'approcher directement des chevaux en mouvement",
      "Elle demande aux cavaliers de ralentir l'allure pour limiter le risque, sans faire sortir les personnes présentes"
    ],
    correct: 1,
    expl: "La sécurité que l'AE doit garantir concerne les <strong>pratiquants mais aussi les tiers</strong> présents sur le lieu de pratique. Des personnes non encadrées à l'intérieur même de l'enceinte où évoluent des chevaux en activité représentent un danger immédiat, pour elles-mêmes comme pour le déroulement de la séance (cheval qui s'écarte, panique). L'AE doit interrompre l'activité, faire sortir ces personnes de la zone de pratique, et ne reprendre qu'une fois celle-ci de nouveau sécurisée — continuer en réduisant seulement l'allure ou en tolérant leur présence près de la clôture ne suffit pas."
  },
  {
    theme: "🚨 Conduite à tenir – Étouffement",
    q: "Pendant une pause, un stagiaire avale de travers un bonbon donné par un camarade. Il se met à tousser fortement, les yeux larmoyants, mais parvient encore à parler et à respirer entre deux quintes de toux.",
    choices: [
      "Elle pratique immédiatement la manœuvre de Heimlich, pour évacuer le corps étranger avant qu'il ne s'enfonce davantage",
      "Elle donne cinq claques vigoureuses dans le dos, entre les deux omoplates, comme premier geste systématique",
      "Elle ne pratique aucune manœuvre de désobstruction, encourage le stagiaire à tousser pour aider à expulser le corps étranger, l'installe dans la position où il se sent le mieux et le surveille attentivement",
      "Elle lui fait boire de l'eau rapidement pour l'aider à faire passer le corps étranger"
    ],
    correct: 2,
    expl: "Tant que la victime peut encore <strong>parler et tousser efficacement</strong>, l'obstruction des voies aériennes est partielle : la toux reste le mécanisme le plus efficace pour évacuer le corps étranger. Aucune manœuvre de désobstruction (claques dans le dos, Heimlich) ne doit être pratiquée dans ce cas — ces gestes sont réservés à l'obstruction totale, quand la victime ne peut plus ni parler, ni tousser, ni respirer. Il faut encourager la toux, installer la personne confortablement, et la surveiller attentivement ; lui faire boire de l'eau est à proscrire tant qu'elle tousse."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "À la fin d'un cycle qu'elle a animé seule, l'AE estime que plusieurs de ses stagiaires ont le niveau pour valider leur Galop suivant. Le titulaire du diplôme professionnel de la structure, habituellement chargé de ces évaluations, est absent ce jour-là et injoignable.",
    choices: [
      "Elle fait passer et valide elle-même officiellement le Galop, considérant qu'elle connaît bien le niveau réel de ses stagiaires",
      "Elle transmet ses observations sur le niveau des stagiaires au titulaire du diplôme professionnel, à qui revient la responsabilité de l'évaluation et de la validation officielle, et attend son retour pour organiser le passage",
      "Elle fait passer le Galop et le valide, puis en informe simplement le titulaire du diplôme après coup",
      "Elle demande à un autre stagiaire du club, plus expérimenté, de valider le passage à sa place"
    ],
    correct: 1,
    expl: "L'AE agit <strong>sous l'autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus, qui reste responsable de l'évaluation et de la validation officielle des acquis de ses stagiaires. Elle peut observer, préparer et transmettre son avis sur le niveau atteint, mais ne peut ni valider seule, ni faire valider par un tiers non qualifié, ni régulariser après coup une validation qu'elle aurait faite seule : ces décisions relèvent du titulaire du diplôme, jamais de l'AE agissant en autonomie."
  },
  {
    theme: "🩺 Santé – Aptitude du jour",
    q: "Un stagiaire régulier arrive pour sa séance en expliquant qu'il a vomi ce matin même avant de partir, mais qu'il se sent « un peu mieux maintenant ». Il insiste pour monter, expliquant que c'est son seul créneau de la semaine.",
    choices: [
      "Elle le laisse monter normalement puisqu'il affirme se sentir mieux et qu'il n'a plus de symptômes visibles au moment de l'accueil",
      "Elle propose une séance allongée à pied uniquement, sans monter à cheval, comme compromis",
      "Elle ne le laisse pas pratiquer ce jour-là compte tenu de l'épisode récent, l'installe au repos, informe les personnes responsables de lui, et l'oriente vers un avis médical si les symptômes réapparaissent",
      "Elle le laisse monter en lui demandant de prévenir immédiatement s'il se sent à nouveau mal pendant la séance"
    ],
    correct: 2,
    expl: "Un épisode de vomissement survenu le jour même, juste avant la séance, signale un <strong>état de santé incompatible avec la pratique</strong> à ce moment précis, quel que soit le ressenti subjectif du stagiaire ou son envie de ne pas manquer sa séance. L'AE ne pratique pas d'évaluation médicale : elle applique le principe de précaution, ne le fait pas pratiquer ce jour-là, l'installe au repos, en informe les responsables (parents ou lui-même s'il est majeur), et oriente vers un avis médical si besoin. Un compromis (marche à pied, surveillance renforcée pendant l'effort) ne lève pas ce risque."
  },
  {
    theme: "📋 Construction de séance / Sécurité du groupe",
    q: "Suite au regroupement de deux créneaux annulés, l'AE se retrouve seule face à un groupe de douze cavaliers débutants montés, alors qu'elle encadre habituellement des groupes de six. Aucun second encadrant n'est disponible.",
    choices: [
      "Elle assure la séance comme prévu avec les douze cavaliers, en restant simplement plus attentive",
      "Elle réduit le contenu technique de la fiche de séance, sans réduire le nombre de cavaliers montés en même temps",
      "Elle adapte le déroulement pour rester en mesure de surveiller et d'intervenir efficacement sur l'ensemble du groupe — par exemple en scindant le groupe en sous-groupes qui alternent temps montés et temps à pied — plutôt que de faire évoluer les douze cavaliers montés simultanément sous sa seule surveillance",
      "Elle demande aux cavaliers les plus autonomes de surveiller eux-mêmes les débutants pendant qu'elle s'occupe du reste du groupe"
    ],
    correct: 2,
    expl: "La sécurité d'une séance montée dépend de la capacité réelle de l'encadrant à <strong>surveiller et intervenir</strong> sur l'ensemble des pratiquants. Un groupe deux fois plus nombreux que d'habitude, avec des débutants, dépasse ce qu'une seule AE peut raisonnablement maîtriser en simultané à cheval. Rester simplement plus attentive, alléger seulement le contenu technique, ou reporter la surveillance sur d'autres cavaliers (non qualifiés pour cela) ne compense pas ce dépassement : il faut adapter l'organisation elle-même, par exemple en alternant des sous-groupes montés et à pied, pour rester en mesure d'assurer une surveillance effective."
  },
  {
    theme: "🛡️ Sécurité collective",
    q: "En pleine séance montée en carrière, un cheval non monté, resté mal attaché près des installations, se détache et se retrouve en liberté à proximité immédiate du groupe en plein exercice.",
    choices: [
      "Elle continue la séance normalement en gardant un œil sur le cheval en liberté, tant qu'il reste calme",
      "Elle interrompt immédiatement l'exercice en cours, fait arrêter et regrouper les cavaliers montés à distance du cheval en liberté, avant de faire sécuriser ou récupérer l'animal",
      "Elle envoie un cavalier du groupe, monté, rattraper lui-même le cheval en liberté pendant que les autres continuent l'exercice",
      "Elle descend immédiatement de cheval elle-même pour courir après l'animal en liberté, en laissant le groupe monté sans consigne"
    ],
    correct: 1,
    expl: "Un cheval en liberté à proximité d'un groupe monté en activité représente un <strong>risque immédiat</strong> (réaction de panique, ruade, collision) pour l'ensemble des cavaliers. La priorité est d'interrompre l'exercice en cours et de mettre le groupe monté à distance de sécurité, avant de s'occuper de sécuriser ou de récupérer l'animal échappé. Laisser la séance se poursuivre en simple surveillance, envoyer un cavalier du groupe intervenir seul, ou abandonner le groupe sans consigne pour courir après le cheval expose inutilement les pratiquants."
  }
];
let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du matériel, hygiène, construction de séance : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
