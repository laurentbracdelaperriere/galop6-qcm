<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 20 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>20 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une structure propose des baptêmes poney pour de très jeunes enfants (4-5 ans) encadrés en carrière, ainsi que des cours de perfectionnement en extérieur pour des cavaliers confirmés préparant un Galop 7. Le gérant souhaite confier les deux types de séances à la même AE, seule, sans qu'aucun titulaire de diplôme professionnel ne soit jamais présent.",
    choices: [
      "C'est possible pour les deux types de séances : l'AE est habilitée à encadrer tout public et tout niveau dès lors qu'elle exerce sous couvert de la structure",
      "L'AE peut encadrer le baptême poney des tout-petits en initiation, mais l'encadrement de cavaliers confirmés en perfectionnement vers un Galop 7 dépasse le périmètre de l'AE et relève d'un titulaire de diplôme professionnel, avec, dans les deux cas, une autorité pédagogique de ce professionnel effective au sein de la structure",
      "L'AE peut encadrer les deux, à condition que le perfectionnement en extérieur se limite au pas",
      "Aucune des deux séances n'est possible pour une AE, qui ne peut encadrer que du soin aux chevaux, jamais de séances montées"
    ],
    correct: 1,
    expl: "L'AE encadre la <strong>découverte et l'initiation</strong> des activités équestres, pas le perfectionnement de cavaliers confirmés visant un niveau technique avancé, qui relève d'un titulaire de diplôme professionnel de niveau IV ou plus (BPJEPS, DEJEPS, BEES). Dans tous les cas, cette action s'exerce sous l'autorité pédagogique effective d'un tel professionnel au sein de la structure, et non en autonomie totale et permanente."
  },
  {
    theme: "🚨 Conduite à tenir – Hémorragie externe",
    q: "En maniant une fourche, un stagiaire se coupe profondément l'avant-bras ; le sang coule abondamment et en continu, sans jaillissement pulsatile.",
    choices: [
      "Elle place un garrot serré immédiatement au-dessus de la plaie avant toute autre chose, considérant que c'est le geste réflexe pour toute coupure qui saigne beaucoup",
      "Elle exerce une compression directe et continue sur la plaie avec un tissu propre ou sa main protégée, allonge si besoin le stagiaire, alerte le 15/112, et ne relâche la pression que sur avis des secours ou si elle doit poser un pansement compressif",
      "Elle nettoie d'abord soigneusement la plaie à l'eau et au savon avant de songer à arrêter le saignement",
      "Elle surélève simplement le bras sans exercer de pression, en attendant de voir si le saignement ralentit tout seul avant d'alerter qui que ce soit"
    ],
    correct: 1,
    expl: "Face à une <strong>hémorragie externe</strong>, le geste de premiers secours est la compression directe immédiate et continue sur la plaie, associée à une alerte au 15/112 ; la surélévation du membre peut compléter la compression mais ne la remplace pas. Le garrot est réservé aux hémorragies massives non contrôlables par compression (notamment avec jaillissement pulsatile) ou aux situations où la compression est impossible ; nettoyer la plaie avant d'arrêter le saignement retarde un geste vital prioritaire."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Après une chute, l'AE constate que le casque du cavalier, bien attaché au moment de l'impact, présente une fissure visible et un éclat de mousse manquant sur la coque.",
    choices: [
      "Comme le cavalier ne présente aucun symptôme et dit « n'avoir rien senti », l'AE l'autorise à remonter avec ce même casque pour terminer la séance",
      "Elle retire immédiatement ce casque de l'usage : un casque ayant subi un choc visible ne doit plus être utilisé, même sans symptôme apparent chez le cavalier, et un casque de remplacement conforme doit être fourni avant toute remontée",
      "Elle répare provisoirement la fissure avec du ruban adhésif et autorise la remontée en expliquant que ce n'est « qu'esthétique »",
      "Elle continue d'utiliser le casque pour cette séance mais prévoit de le signaler « la prochaine fois » au responsable du club"
    ],
    correct: 1,
    expl: "Un <strong>casque ayant absorbé un choc</strong> voit sa structure interne endommagée, même quand les dégâts visibles semblent mineurs ou que le cavalier ne ressent rien : il perd une part significative de sa capacité de protection et ne doit plus être utilisé. L'AE le retire immédiatement de la circulation et fournit un casque de remplacement conforme avant toute remontée, sans réparation de fortune ni report du signalement."
  },
  {
    theme: "🩺 Santé – Aptitude et accueil du public",
    q: "Un stagiaire adulte, nouvellement inscrit, se présente à sa première séance montée sans avoir fourni le certificat médical ou l'attestation de santé demandés par la structure à l'inscription. Il insiste pour monter « juste cette fois », affirmant être en pleine forme.",
    choices: [
      "L'AE le laisse monter pour cette première séance, considérant que l'apparence physique du stagiaire suffit à juger de son aptitude",
      "Elle refuse qu'il monte tant que le document requis n'a pas été fourni à la structure, quelle que soit l'apparence de bonne santé du stagiaire, et l'oriente vers une activité non montée ou vers l'accueil pour régulariser sa situation",
      "Elle le fait monter mais uniquement au pas, pensant que cette allure ne présente aucun risque en l'absence de certificat",
      "Elle demande au stagiaire de signer une simple décharge manuscrite sur place, ce qui selon elle remplace valablement le document médical requis"
    ],
    correct: 1,
    expl: "L'attestation ou le certificat médical conditionnant la pratique est une exigence d'<strong>accueil et de suivi de la santé du pratiquant</strong>, indépendante de son apparence physique ou de l'allure pratiquée : l'AE n'a pas à en juger elle-même et ne peut s'y substituer par une décharge signée sur place. Tant que ce document n'est pas régularisé auprès de la structure, elle n'engage pas le stagiaire dans une activité montée."
  },
  {
    theme: "📋 Construction de séance / Fiche de séance",
    q: "L'AE arrive pour animer une séance de pansage et de manipulation avec un groupe qu'elle ne connaît pas, sans avoir préparé de fiche de séance ni s'être renseignée sur le niveau et l'âge des participants, pensant « improviser sur place selon l'ambiance du groupe ».",
    choices: [
      "C'est une pratique acceptable : une séance de pansage, jugée peu risquée, ne nécessite selon elle ni préparation écrite ni prise d'informations préalables sur le groupe",
      "Une préparation minimale est indispensable même pour une activité à pied : objectifs, déroulement, sécurité et adaptation au public doivent être anticipés avant la séance, y compris pour une activité perçue comme peu risquée, car la proximité avec le cheval au sol comporte elle aussi des dangers spécifiques (morsure, coup de pied, piétinement)",
      "La préparation écrite n'est obligatoire que pour les séances montées ; les activités de soin ne l'exigent jamais",
      "Elle peut improviser sans problème dès lors que le groupe est composé d'adultes, la préparation préalable n'étant nécessaire que pour les mineurs"
    ],
    correct: 1,
    expl: "La construction d'une <strong>séance sécurisée</strong> repose sur une préparation qui anticipe objectifs, déroulement et adaptation au public, quelle que soit l'activité proposée. Une activité à pied comme le pansage n'est pas sans risque : la proximité immédiate avec le cheval expose à des dangers spécifiques (morsure, coup de pied, piétinement) qui doivent être anticipés dans l'organisation de la séance, indépendamment de l'âge du public."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion de fracture du membre",
    q: "En descendant de cheval, un stagiaire se tord la cheville et ne peut plus poser le pied au sol ; la zone commence à gonfler et il ressent une vive douleur au moindre mouvement.",
    choices: [
      "L'AE lui retire immédiatement sa botte pour « voir l'ampleur des dégâts » et masse la zone pour faire circuler le sang",
      "Elle l'aide à marcher jusqu'au vestiaire en le faisant s'appuyer sur la jambe blessée pour « tester » si ça passe",
      "Elle ne mobilise pas le membre, ne retire pas la chaussure, immobilise la zone dans la position où elle se trouve si possible sans forcer, et alerte le 15/112 ou fait alerter les secours en décrivant les symptômes",
      "Elle applique uniquement une pommade anti-inflammatoire sur la zone et renvoie le stagiaire se reposer chez lui sans consulter davantage"
    ],
    correct: 2,
    expl: "Face à une <strong>suspicion de fracture ou d'entorse grave</strong>, il ne faut ni mobiliser le membre, ni le faire porter le poids du corps, ni retirer la chaussure qui peut faire office d'immobilisation partielle : on laisse le membre dans la position trouvée, on évite tout mouvement inutile, et on alerte les secours en décrivant précisément les symptômes (douleur, déformation, impossibilité d'appui)."
  },
  {
    theme: "🛡️ Sécurité / Matériel et harnachement",
    q: "Juste avant le départ d'une séance montée, l'AE remarque qu'une sangle de selle présente une couture effilochée sur plusieurs centimètres, sans être totalement rompue.",
    choices: [
      "Elle laisse partir le cavalier avec cette sangle, la couture n'étant pas totalement rompue et le trajet prévu se limitant au pas",
      "Elle retire ce matériel de l'usage et le remplace par une sangle en bon état avant tout départ, quelle que soit l'allure prévue pour la séance",
      "Elle resserre simplement la sangle un peu plus fort pour compenser la fragilité de la couture",
      "Elle demande au cavalier de surveiller lui-même la sangle pendant la séance et de prévenir s'il sent un problème"
    ],
    correct: 1,
    expl: "Un <strong>équipement de sécurité endommagé</strong>, comme une sangle dont la couture est effilochée, doit être retiré de l'usage avant tout départ, sans attendre une rupture complète : ce type de défaut peut céder brutalement sous l'effort et provoquer une chute grave. Ni le resserrage, ni la limitation d'allure, ni la vigilance demandée au cavalier ne compensent un matériel défaillant."
  },
  {
    theme: "🚨 Conduite à tenir – Crise convulsive",
    q: "Pendant une séance à pied, un stagiaire s'effondre soudainement et son corps est agité de mouvements convulsifs incontrôlés ; il ne répond à aucune sollicitation.",
    choices: [
      "Elle tente de le maintenir fermement au sol pour arrêter les mouvements et lui place immédiatement un objet dans la bouche pour l'empêcher de se mordre la langue",
      "Elle écarte les objets et personnes pouvant le blesser autour de lui, ne le maintient pas de force, ne met rien dans sa bouche, chronomètre la durée de la crise, et alerte le 15/112 pendant la crise ou dès qu'elle se termine, notamment si elle dépasse quelques minutes ou se répète",
      "Elle attend simplement la fin des mouvements sans intervenir ni surveiller quoi que ce soit, puis laisse le stagiaire seul se reposer",
      "Elle jette immédiatement de l'eau froide sur le visage du stagiaire pour tenter d'arrêter la crise plus vite"
    ],
    correct: 1,
    expl: "Face à une <strong>crise convulsive</strong>, il ne faut ni contenir les mouvements par la force, ni introduire quoi que ce soit dans la bouche de la victime (risque de blessure et d'étouffement), mais écarter le danger autour d'elle, chronométrer la crise, et alerter le 15/112, en particulier si elle se prolonge ou se répète. La victime doit ensuite être surveillée sans être laissée seule jusqu'au retour à un état de conscience normal."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une AE encadre seule un groupe de cavaliers ; parmi eux, un enfant de 6 ans n'a jamais approché de poney et découvre totalement l'univers équestre, dans le même temps qu'un adulte qui prépare activement son Galop 5 avec des exercices techniques de maniabilité au trot et au galop.",
    choices: [
      "Cette organisation est conforme dans son ensemble : l'AE peut encadrer simultanément découverte et préparation technique avancée, quel que soit le niveau visé",
      "L'accueil de l'enfant débutant en découverte relève bien du périmètre de l'AE, mais la préparation active d'un adulte vers un Galop 5 avec exercices techniques avancés dépasse ce périmètre et doit être encadrée par un titulaire de diplôme professionnel",
      "C'est non conforme uniquement à cause de la présence d'un enfant de 6 ans, jugé trop jeune pour toute activité équestre encadrée par une AE",
      "C'est conforme si l'AE consacre au moins la moitié du temps de séance à chacun des deux profils"
    ],
    correct: 1,
    expl: "Le <strong>périmètre de l'AE</strong> couvre l'initiation et la découverte des activités équestres pour tous les publics, y compris les jeunes enfants, mais pas la préparation technique avancée vers un niveau de Galop élevé avec des exercices poussés à des allures rapides, qui relève d'un titulaire de diplôme professionnel. Mélanger les deux publics dans une même séance encadrée par la seule AE ne rend pas conforme la partie qui dépasse ce périmètre."
  },
  {
    theme: "📋 Construction de séance / Sécurité collective",
    q: "L'AE organise un exercice de trot enlevé en manège avec un groupe de six cavaliers débutants montés, sans définir de sens de circulation ni de distance de sécurité entre les chevaux, laissant chacun évoluer « comme il le sent ».",
    choices: [
      "C'est acceptable pour un groupe restreint de six cavaliers, jugé suffisamment petit pour se réguler naturellement",
      "L'AE doit définir un sens de circulation commun et faire respecter une distance de sécurité suffisante entre les chevaux avant de lancer l'exercice, pour prévenir les risques de collision, de coup de pied ou d'effet de groupe incontrôlé propres au travail monté collectif",
      "Ce n'est un problème qu'au galop ; au trot enlevé, l'absence de consignes de circulation ne présente pas de risque particulier",
      "Il suffit que l'AE reste attentive visuellement, sans avoir besoin de donner de consignes explicites de circulation ou de distance avant l'exercice"
    ],
    correct: 1,
    expl: "La <strong>gestion de la sécurité collective</strong> en manège impose de fixer un sens de circulation clair et une distance de sécurité entre les chevaux avant tout exercice monté en groupe, car l'absence de règles favorise les collisions, les coups de pied et les réactions de groupe difficiles à maîtriser, y compris à des allures modérées comme le trot enlevé. Une simple vigilance visuelle de l'AE, sans consignes explicites données au groupe, ne suffit pas à prévenir ces risques."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, urgences vitales, sécurité du matériel, construction de séance : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
