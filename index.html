<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 13 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>13 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le titulaire du BPJEPS qui a commencé une reprise débutants doit s'absenter une heure. Il demande à l'AE de continuer seule la séance, en précisant qu'elle peut l'appeler sur son portable en cas de problème.",
    choices: [
      "C'est conforme : être joignable par téléphone suffit à assurer l'autorité pédagogique requise, quelle que soit la distance",
      "Ce n'est pas conforme : l'AE exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, ce qui suppose sa présence effective sur la structure pour intervenir si nécessaire ; une simple joignabilité téléphonique à distance ne remplace pas cette présence",
      "C'est conforme, car une reprise déjà commencée par un professionnel peut ensuite être terminée par n'importe quel encadrant, diplômé ou non",
      "Ce n'est pas conforme, car une AE ne peut jamais se retrouver seule avec un groupe, même quelques minutes, en aucune circonstance"
    ],
    correct: 1,
    expl: "L'AE agit toujours sous l'<strong>autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus (BPJEPS, DE...), ce qui implique la présence effective de ce professionnel sur la structure, en mesure d'intervenir directement si besoin. Un simple contact téléphonique à distance ne constitue pas cette présence, même pour une absence brève et même si la reprise avait été lancée par le diplômé."
  },
  {
    theme: "🚨 Conduite à tenir – Chute",
    q: "Un cavalier chute de cheval pendant l'exercice. Il reste au sol, inconscient, mais il respire normalement.",
    choices: [
      "L'AE relève doucement la victime pour l'installer assise contre une clôture, pensant que cette position facilite sa respiration",
      "L'AE dégage la zone de tout danger (chevaux), place la victime en position latérale de sécurité puisqu'elle respire, sans la déplacer inutilement, alerte le 15/112, et surveille sa respiration jusqu'à l'arrivée des secours",
      "L'AE retire immédiatement le casque de la victime pour examiner sa tête, avant toute autre action",
      "L'AE attend que la victime reprenne connaissance seule avant d'alerter les secours, pour ne pas déranger inutilement"
    ],
    correct: 1,
    expl: "Face à une victime <strong>inconsciente qui respire</strong>, il faut sécuriser la zone, la mettre en <strong>position latérale de sécurité (PLS)</strong> sans la mobiliser plus que nécessaire, alerter sans délai le 15/112, et surveiller sa respiration en continu. On ne relève jamais une victime inconsciente pour l'asseoir, on ne retire pas le casque par réflexe avant d'avoir évalué la situation, et on n'attend jamais un réveil spontané pour alerter."
  },
  {
    theme: "🩺 Santé – Allergie",
    q: "La fiche sanitaire d'un stagiaire signale une allergie sévère aux piqûres d'insectes, avec un stylo auto-injecteur fourni par les parents et un protocole d'urgence associé (PAI). Pendant la séance, il est piqué par une guêpe et présente rapidement un gonflement du visage et une gêne respiratoire.",
    choices: [
      "L'AE attend l'arrivée des parents, prévenus par téléphone, avant d'entreprendre quoi que ce soit",
      "L'AE alerte immédiatement le 15, met en œuvre le protocole d'urgence prévu par le PAI (dont l'auto-injecteur si elle y est autorisée et formée), installe la victime selon sa gêne, et reste avec elle jusqu'aux secours",
      "L'AE lui donne un antihistaminique trouvé dans la pharmacie du club, différent de son traitement personnel, en pensant que l'effet sera équivalent",
      "L'AE continue la séance à distance en le surveillant du coin de l'œil, la réaction pouvant se résorber d'elle-même"
    ],
    correct: 1,
    expl: "Un gonflement rapide avec gêne respiratoire après une piqûre chez un stagiaire connu allergique évoque une <strong>réaction anaphylactique</strong>, une urgence vitale. Il faut alerter le 15 sans délai, appliquer le protocole d'urgence individualisé (PAI) prévu pour ce stagiaire, et rester auprès de lui. On n'attend jamais les parents pour agir, on ne substitue jamais un médicament non prescrit au traitement personnel prévu, et on ne se contente pas d'une simple surveillance à distance."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Un cavalier débutant demande si le port d'un gilet de protection dorsale est obligatoire, comme le casque, pour une séance de plat sans saut.",
    choices: [
      "Oui, le gilet de protection dorsale est obligatoire pour toute activité équestre au même titre que le casque",
      "Non : le casque homologué est la protection obligatoire de base pour toute pratique équestre en club ; le gilet de protection dorsale n'est imposé que dans certaines épreuves spécifiques (cross de concours complet, marathon d'attelage, TREC) et reste fortement recommandé, mais non obligatoire, pour une séance de plat",
      "Non, ni le casque ni le gilet ne sont obligatoires tant qu'il n'y a pas de saut d'obstacle au programme",
      "Oui, mais uniquement le casque devient facultatif dès lors que le cavalier porte un gilet de protection"
    ],
    correct: 1,
    expl: "Le <strong>casque homologué</strong> est obligatoire pour toute pratique équestre en club. Le <strong>gilet de protection dorsale</strong> n'est réglementairement imposé que pour certaines épreuves précises (cross en concours complet, marathon d'attelage, TREC) ; il reste vivement recommandé en séance classique, notamment pour les débutants, mais n'est pas obligatoire pour une séance de plat. Le port du gilet ne dispense jamais du port du casque."
  },
  {
    theme: "📋 Construction de séance",
    q: "L'AE apprend, avant sa séance, qu'un enfant du groupe est en situation de handicap moteur léger, information transmise par la structure. Comment doit-elle construire sa séance ?",
    choices: [
      "Elle installe l'enfant sans aucune adaptation particulière, considérant que le contact avec le cheval suffit à compenser la difficulté",
      "Elle adapte en amont les objectifs, le choix du cheval et l'organisation des exercices à partir des informations transmises, en s'appuyant si besoin sur un encadrant compétent en équitation adaptée, plutôt que d'exclure l'enfant ou de l'intégrer sans aucun ajustement",
      "Elle exclut l'enfant de la séance par précaution, en l'absence de qualification spécialisée en situation de handicap",
      "Elle demande aux parents de rester présents pendant toute la séance pour s'occuper de lui à sa place"
    ],
    correct: 1,
    expl: "La construction d'une séance sécurisée implique de prendre en compte les <strong>caractéristiques réelles du public</strong> présent : adapter les objectifs, le cheval et les exercices à partir des informations disponibles, en s'appuyant sur une personne ressource compétente si nécessaire. Ni l'exclusion par précaution ni l'absence totale d'adaptation ne correspondent à une prise en compte sérieuse du public."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise cardiaque",
    q: "Un accompagnateur présent sur la structure s'effondre soudainement : il ne répond pas et ne respire plus normalement.",
    choices: [
      "L'AE attend l'arrivée des secours sans intervenir, la réanimation cardio-pulmonaire étant réservée aux professionnels de santé",
      "L'AE fait alerter sans délai le 15/112 par une tierce personne pendant qu'elle débute immédiatement les compressions thoraciques, et utilise un défibrillateur automatisé externe (DAE) dès qu'il est disponible, sans attendre d'autorisation particulière pour le brancher",
      "L'AE privilégie uniquement le bouche-à-bouche, jugeant cela suffisant en attendant les secours",
      "L'AE prépare le défibrillateur mais ne le branche qu'après confirmation explicite du SAMU au téléphone"
    ],
    correct: 1,
    expl: "Face à un <strong>arrêt cardio-respiratoire</strong> (absence de réponse, absence de respiration normale), il faut alerter immédiatement, débuter sans délai les <strong>compressions thoraciques</strong>, et utiliser un <strong>DAE</strong> dès qu'il est disponible : cet appareil est conçu pour un usage par tout témoin, sans formation médicale ni autorisation préalable du SAMU. Attendre les secours sans agir, ou attendre une validation avant de brancher le DAE, fait perdre un temps déterminant pour la survie de la victime."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "En sous-effectif, le responsable du club demande à une AE d'assurer seule, de façon habituelle et rémunérée, des cours à des cavaliers autonomes, sans supervision d'un titulaire de diplôme de niveau IV ou plus.",
    choices: [
      "C'est possible à titre exceptionnel et automatique dès lors que le club traverse une période de sous-effectif",
      "Ce n'est pas conforme au cadre d'exercice de l'AE : celui-ci intervient sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus habilité à l'encadrement rémunéré autonome ; le sous-effectif du club ne crée pas de dérogation à ce cadre",
      "C'est possible, dès lors que les cavaliers concernés sont majeurs et donnent leur accord",
      "Ce n'est pas conforme uniquement si l'AE a moins de trois ans d'ancienneté, l'expérience acquise suffisant sinon à l'en dispenser"
    ],
    correct: 1,
    expl: "Le titre d'AE s'exerce sous l'<strong>autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus habilité à l'enseignement rémunéré en autonomie. Ni le sous-effectif du club, ni la majorité et le consentement des cavaliers, ni l'ancienneté de l'AE ne créent de dérogation à ce cadre d'exercice."
  },
  {
    theme: "🛡️ Sécurité / Lieu de pratique",
    q: "Avant une séance en carrière, l'AE remarque qu'une portion de la clôture est endommagée, créant une ouverture par laquelle un cheval pourrait s'échapper vers une zone de circulation.",
    choices: [
      "Elle informe simplement les cavaliers du danger et leur demande d'être prudents à cet endroit, sans autre changement au programme",
      "Elle ne fait pas travailler le groupe dans cette carrière tant que la clôture n'est pas réparée ou sécurisée par un dispositif fiable (barrières mobiles, changement de lieu), la sécurité du lieu de pratique étant un préalable à toute séance",
      "Elle place un cavalier volontaire devant l'ouverture pour empêcher un cheval de s'échapper pendant que la séance se déroule normalement",
      "Elle réduit simplement l'allure des chevaux à proximité de la zone endommagée, sans autre mesure"
    ],
    correct: 1,
    expl: "La <strong>sécurité du lieu de pratique</strong> est une condition préalable à toute séance. Une clôture endommagée créant un risque réel de fuite d'un cheval vers une zone de circulation impose de ne pas utiliser cet espace tant qu'une solution fiable n'est pas mise en place. Informer sans agir, réduire l'allure ou poster un cavalier en sentinelle ne suppriment pas le danger et ne remplacent pas une mise en sécurité effective du lieu."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme",
    q: "Après une chute, un cavalier reste conscient mais se plaint de douleurs très vives dans le dos et ne parvient pas à bouger les jambes.",
    choices: [
      "L'AE aide la victime à se relever doucement pour l'installer plus confortablement contre un obstacle",
      "L'AE ne mobilise pas la victime, la maintient allongée et immobile, protège la zone (chevaux, circulation), la rassure, et alerte immédiatement le 15/112 en signalant une possible atteinte du dos",
      "L'AE mobilise avec précaution les jambes de la victime pour vérifier si la sensibilité revient, avant d'alerter les secours",
      "L'AE fait asseoir la victime pour faciliter sa respiration en attendant les secours"
    ],
    correct: 1,
    expl: "Des douleurs vives au dos associées à une impossibilité de bouger les jambes évoquent une possible <strong>atteinte de la colonne vertébrale</strong>. La règle est de ne jamais mobiliser une telle victime (ni la relever, ni tester ses membres, ni la faire asseoir), de la maintenir immobile, de sécuriser les abords, et d'alerter immédiatement les secours en signalant précisément les symptômes observés, pour une prise en charge spécialisée."
  },
  {
    theme: "🩺 Santé – Traitement personnel",
    q: "Un cavalier mineur asthmatique, dont la fiche sanitaire mentionne un traitement de crise (bronchodilatateur) qu'il porte sur lui, présente une gêne respiratoire avec sifflements pendant l'effort.",
    choices: [
      "L'AE continue l'exercice à intensité réduite, pensant que le mouvement modéré aide à réguler la respiration",
      "L'AE arrête immédiatement l'effort, installe le cavalier en position assise favorisant la respiration, l'aide à utiliser son propre traitement de crise conformément à sa fiche sanitaire, surveille l'évolution, et alerte le 15 en l'absence d'amélioration rapide ou en cas d'aggravation",
      "L'AE lui donne un autre traitement inhalé disponible dans la pharmacie du club, différent du sien, pensant que l'effet est similaire",
      "L'AE attend la fin de la séance pour en informer les parents, les sifflements ne justifiant pas selon elle une interruption immédiate"
    ],
    correct: 1,
    expl: "Une gêne respiratoire avec sifflements chez un cavalier asthmatique pendant l'effort évoque une possible <strong>crise d'asthme</strong>. Il faut arrêter l'effort, installer en position assise, aider à l'utilisation du traitement de crise personnel prévu sur la fiche sanitaire, surveiller l'évolution, et alerter le 15 si les symptômes persistent ou s'aggravent. On ne poursuit jamais l'effort, on ne substitue jamais un autre traitement au sien, et on n'attend jamais la fin de la séance pour agir."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
