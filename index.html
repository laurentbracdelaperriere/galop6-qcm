<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 17 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>17 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>

      <div class="expl" id="expl"></div>

      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {

    choices: [
      "C'est conforme : en cas d'absence imprévue du titulaire, l'AE peut ponctuellement assurer seule l'ensemble des cours de la structure, quel que soit le niveau du public",

  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme de membre",
    q: "Un stagiaire chute de cheval et se plaint aussitôt d'une douleur vive à l'avant-bras ; on observe une déformation visible à mi-hauteur et il n'arrive plus à bouger ses doigts correctement. Il demande qu'on l'aide à « remettre le bras dans le bon sens » pour que ça fasse moins mal.",

      "L'AE applique directement de la glace à même la peau sur la zone déformée pendant une vingtaine de minutes en attendant les secours"
    ],
    correct: 1,
    expl: "Face à une suspicion de <strong>fracture</strong> avec déformation visible, il ne faut jamais tenter de remettre en place ni mobiliser le membre, y compris pour « tester » la mobilité, sous peine d'aggraver la lésion (notamment vasculaire ou nerveuse) : le geste correct consiste à laisser le membre dans la position où il se trouve, à l'immobiliser sans forcer si le matériel le permet, et à alerter le 15/112 en décrivant les signes observés. La glace directement sur la peau, en particulier de façon prolongée, présente un risque de brûlure et n'est jamais le geste prioritaire face à une déformation évocatrice de fracture."
  },
  {
    theme: "🩺 Santé – Réaction allergique sévère",
    q: "Un stagiaire dont la fiche sanitaire mentionne une allergie connue aux piqûres de guêpe, avec un auto-injecteur d'adrénaline prescrit dans son sac, se fait piquer pendant le pansage. Quelques minutes plus tard, son visage commence à gonfler et il dit avoir du mal à respirer.",
    choices: [
      "L'AE le fait patienter assis à l'ombre en lui donnant de l'eau fraîche, une réaction allergique se calmant en général seule après une piqûre",
      "L'AE reconnaît les signes d'une réaction allergique sévère, alerte immédiatement le 15/112, utilise si nécessaire l'auto-injecteur d'adrénaline qui lui est prescrit conformément à ce qui est prévu, et surveille la victime sans la laisser seule",
      "L'AE cherche dans la trousse de secours du club un antihistaminique générique à lui donner en attendant que ça passe",
      "L'AE l'envoie seul à pied jusqu'à l'accueil du club pour qu'il aille chercher lui-même son traitement"
    ],
    correct: 1,
    expl: "Un œdème du visage associé à une gêne respiratoire après une piqûre chez une personne connue allergique évoque une <strong>réaction allergique sévère (anaphylaxie)</strong>, une urgence vitale qui impose une alerte immédiate au 15/112 et, si un auto-injecteur d'adrénaline lui est personnellement prescrit et prévu pour cette situation, son utilisation sans délai, en parallèle d'une surveillance continue de la victime. Attendre que « ça passe seul », donner un médicament non prescrit à la victime trouvé dans la trousse du club, ou laisser la victime se déplacer seule aggravent le risque au lieu de le réduire."
  },
  {
    theme: "🛡️ Sécurité du lieu de pratique",
    q: "Juste avant de commencer sa séance, l'AE constate que la trousse de secours du club ne contient plus de compresses ni de pansements, et que le téléphone habituellement utilisé pour alerter les secours est déchargé.",
    choices: [
      "Elle démarre la séance comme prévu, en se disant qu'elle avisera si un incident survient réellement",
      "Elle s'assure de disposer d'un moyen d'alerte fonctionnel et d'une trousse de secours utilisable avant de commencer — téléphone chargé et accessible, trousse complétée ou empruntée — plutôt que de débuter la séance sans ces moyens",
      "Elle décale seulement le début du cours de quelques minutes pour recharger le téléphone, sans se soucier du contenu de la trousse de secours",
      "Elle demande à un stagiaire de garder son propre téléphone personnel à portée de main pour appeler si besoin, et démarre la séance normalement"
    ],
    correct: 1,
    expl: "Vérifier la disponibilité d'un <strong>moyen d'alerte fonctionnel</strong> et d'une trousse de secours utilisable fait partie des vérifications de sécurité du lieu de pratique à effectuer avant de démarrer une séance : sans ces moyens, l'AE ne peut ni soigner une plaie ni alerter efficacement en cas d'incident. Démarrer « en se disant qu'on avisera », ne régler qu'une partie du problème (le téléphone sans la trousse), ou reporter la responsabilité de l'alerte sur le téléphone personnel d'un stagiaire sans avoir vérifié soi-même la situation ne remplacent pas une vérification et une mise en conformité réelles avant le début de la séance."
  },
  {
    theme: "📋 Construction de séance / Public",
    q: "Faute de personnel disponible, le gérant demande à l'AE d'intégrer, dans un groupe de cavaliers confirmés (Galop 4) qui travaillent le trot enlevé et de petits sauts d'obstacles, un stagiaire complet débutant n'ayant jamais monté à cheval.",
    choices: [
      "Elle intègre le débutant tel quel dans le groupe, en lui demandant simplement de rester au pas pendant que les autres sautent",
      "Elle refuse d'intégrer telle quelle une personne dont le niveau ne correspond pas aux situations d'apprentissage prévues pour ce groupe, et propose une solution adaptée (créneau différent, prise en charge individualisée, poney adapté) plutôt que de le mêler sans adaptation à des exercices largement hors de sa portée",
      "Elle place le débutant en observation au centre de la carrière pendant toute la séance, sans lui faire pratiquer quoi que ce soit",
      "Elle laisse le débutant décider lui-même s'il se sent capable de suivre le rythme du groupe"
    ],
    correct: 1,
    expl: "La <strong>prise en compte du niveau du public</strong> et l'adéquation entre les situations d'apprentissage proposées et les cavaliers présents sont au cœur de la construction sécurisée d'une séance : mélanger sans adaptation un débutant complet à un groupe confirmé qui saute expose l'un et l'autre à des risques (chevaux, discipline du groupe, gestion simultanée de deux besoins incompatibles). Le laisser « au pas dans son coin », l'exclure de toute pratique, ou lui laisser juger seul de sa propre capacité ne sont pas des réponses adaptées : l'AE doit refuser cette organisation et proposer une prise en charge correspondant réellement à son niveau."
  },
  {
    theme: "🩺 Santé – Malaise hypoglycémique",
    q: "Un stagiaire dont la fiche sanitaire mentionne un diabète de type 1, avec du sucre dans son sac en cas de besoin, pâlit, se met à trembler et transpirer, et dit se sentir faible pendant l'exercice.",
    choices: [
      "L'AE le fait patienter en selle en lui demandant de continuer doucement au pas, le mouvement pouvant l'aider à « faire passer » la sensation",
      "L'AE arrête immédiatement son effort, le fait asseoir, lui donne rapidement le sucre prévu à cet effet dans son sac, surveille son état, et alerte le 15/112 si aucune amélioration rapide n'apparaît ou si son état s'aggrave",
      "L'AE lui donne uniquement de l'eau à boire, jugeant que c'est avant tout une question de déshydratation",
      "L'AE attend la fin de la séance pour voir si les symptômes disparaissent d'eux-mêmes avant de faire quoi que ce soit"
    ],
    correct: 1,
    expl: "Pâleur, tremblements, sueurs et sensation de faiblesse chez une personne diabétique pendant un effort évoquent une <strong>hypoglycémie</strong> : il faut arrêter l'effort, faire asseoir la victime, lui donner rapidement le sucre prévu à cet effet (tel qu'indiqué sur sa fiche), surveiller l'évolution et alerter le 15/112 si l'amélioration n'est pas rapide ou si l'état s'aggrave (jusqu'à la perte de connaissance). Continuer l'effort, donner uniquement de l'eau, ou attendre « pour voir » retardent une prise en charge qui doit être rapide."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "En dehors de ses horaires au club, l'AE est sollicitée directement par des parents pour donner, en son nom propre et contre rémunération versée directement par la famille, des cours particuliers réguliers à leur enfant, sans lien avec la structure qui l'emploie ni supervision d'un titulaire de diplôme de niveau IV ou plus.",
    choices: [
      "C'est conforme, puisque l'AE dispose déjà d'une qualification reconnue par la Fédération Française d'Équitation",
      "Ce n'est pas conforme : l'enseignement contre rémunération relève du Code du sport, qui le réserve aux titulaires d'un diplôme professionnel ; l'AE, qualification fédérale et non diplôme d'État, ne peut légalement enseigner seule et de façon indépendante contre rémunération, hors du cadre et de l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus",

      "Ce n'est pas conforme uniquement si l'enfant a moins de 12 ans, la limite d'âge conditionnant seule cette interdiction"
    ],

    expl: "Le Code du sport (art. L.212-1 et suivants) réserve l'<strong>enseignement contre rémunération</strong> des activités physiques et sportives aux titulaires d'un diplôme, titre à finalité professionnelle ou certificat de qualification garantissant la compétence en matière de sécurité. L'AE est une qualification fédérale FFE et non un diplôme professionnel : elle ne peut donc pas enseigner seule, de façon indépendante et rémunérée, en dehors du cadre d'une structure et de l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus — ni le caractère occasionnel de l'activité, ni l'âge de l'élève ne créent de dérogation à cette règle."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Avant une séance d'obstacles, l'AE remarque qu'une étrivière est effilochée par endroits sur une partie de sa longueur, un stagiaire lui faisant remarquer « elle a toujours tenu jusqu'ici, ça devrait aller encore aujourd'hui ».",
    choices: [
      "Elle laisse l'étrivière en place puisqu'elle n'a jamais cédé jusqu'à présent, en demandant simplement au cavalier de rester vigilant",

    correct: 1,
    expl: "Un équipement présentant des signes d'usure avancée, comme une <strong>étrivière effilochée</strong>, comporte un risque réel de rupture au moment où la charge est la plus forte (réception d'obstacle, déséquilibre) : le fait qu'il « ait toujours tenu jusqu'ici » ne garantit rien pour l'avenir et ne constitue pas un critère de sécurité. L'AE doit retirer ce matériel de l'usage et le faire remplacer avant la séance, plutôt que d'en limiter l'usage à certaines phases ou de simplement dissimuler le défaut."

  {

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
