<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 30 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>30 août 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Carte professionnelle d'éducateur sportif",
    q: "Titulaire du seul certificat fédéral d'Animateur d'Équitation, la stagiaire anime, comme d'habitude et sous l'autorité pédagogique d'un enseignant diplômé d'État présent sur place, des créneaux rémunérés de découverte pour de jeunes cavaliers dans son club principal. Elle vient d'accepter les mêmes conditions dans un second club, mais n'a engagé aucune démarche de déclaration en tant qu'éducateur sportif auprès des services de l'État, estimant que son diplôme fédéral et la présence sur place d'un titulaire suffisent.",
    choices: [
      "Elle doit se déclarer comme éducateur sportif auprès des services de l'État (carte professionnelle), obligation distincte de la question de la supervision pédagogique, dès lors qu'elle encadre contre rémunération une activité physique ou sportive, y compris dans ce second club",
      "Elle a raison : la présence sur place d'un titulaire de diplôme d'État dispense l'AE de toute déclaration personnelle, qu'elle soit rémunérée ou non",
      "La déclaration n'est obligatoire que si elle dépasse un certain volume horaire rémunéré cumulé sur l'ensemble de ses clubs",
      "La déclaration n'est nécessaire que pour son club principal, un second club pouvant être exempté tant que les conditions d'encadrement restent identiques"

    correct: 0,
    expl: "La déclaration d'éducateur sportif auprès des services de l'État (<strong>carte professionnelle</strong>), prévue par le Code du sport, est une obligation distincte de celle relative à la qualification et à l'autorité pédagogique : elle s'impose à toute personne encadrant contre rémunération une activité physique ou sportive, sans seuil horaire, et pour chaque structure où elle exerce contre rémunération, y compris un second club appliquant les mêmes conditions d'encadrement que le premier."
  },
  {
    theme: "⚖️ Réglementation encadrement – Remplacement au pied levé",

    choices: [
      "Elle accepte l'ensemble des créneaux, y compris les deux créneaux avancés, pour ne pas pénaliser les cavaliers inscrits ce jour-là",

      "Elle accepte les créneaux correspondant à son champ de compétence habituel, mais signale qu'elle ne peut assurer seule, sans autorité pédagogique d'un titulaire de diplôme, les deux créneaux de perfectionnement avancé, et demande qu'une autre solution soit trouvée pour ceux-ci (report, annulation ou autre enseignant qualifié)"
    ],
    correct: 3,
    expl: "Un remplacement au pied levé ne modifie pas le périmètre de compétence de l'AE : elle peut animer les créneaux relevant de son champ habituel, mais un contenu technique avancé (ici, un travail d'obstacles à une hauteur significative) requiert l'autorité pédagogique d'un titulaire de diplôme d'État ou équivalent, qu'elle ne peut assumer seule au prétexte d'une absence imprévue. Réduire unilatéralement la difficulté ne remplace pas cette exigence de qualification, et refuser l'ensemble de la journée, y compris les créneaux qu'elle sait encadrer seule, n'est pas non plus une réponse proportionnée."
  },
  {
    theme: "⚖️ Réglementation encadrement – Activité indépendante dans les locaux du club",
    q: "En dehors de son contrat avec le club, l'AE envisage de créer une auto-entreprise pour organiser, en toute indépendance, des stages payants qu'elle animerait et facturerait elle-même à des cavaliers extérieurs, en utilisant ponctuellement les installations du club avec l'accord bienveillant du gérant, sans qu'aucun enseignant diplômé ne soit associé à ces stages.",
    choices: [
      "Elle peut le faire librement dès lors que le gérant du club donne son accord pour l'utilisation des installations",
      "Cette activité indépendante reste un enseignement contre rémunération au sens du Code du sport : elle nécessite la qualification requise (diplôme ou titre reconnu) qu'un simple accord d'usage des locaux ne remplace pas, quelle que soit la taille du groupe",
      "Elle peut le faire si elle limite chaque stage à un petit groupe de moins de cinq cavaliers",
      "Elle peut le faire si elle qualifie les stages de « stages de loisir » plutôt que de « cours » sur ses supports de communication"

    correct: 1,
    expl: "Le statut d'auto-entrepreneur ou l'accord du gérant pour l'usage des locaux ne changent rien à la nature de l'activité : organiser et facturer soi-même des stages d'enseignement équestre reste un enseignement contre rémunération au sens de l'article <strong>L.212-1 du Code du sport</strong>, soumis à l'exigence de qualification, quels que soient la taille du groupe ou le vocabulaire utilisé pour désigner la prestation."

  {
    theme: "🚨 Conduite à tenir – Étouffement (obstruction totale)",
    q: "Pendant une pause goûter au club, un stagiaire porte les mains à sa gorge, devient rouge puis bleuit, et ne peut plus ni parler, ni tousser, ni respirer : les signes d'une obstruction totale des voies aériennes par un morceau de nourriture.",
    choices: [

      "Elle donne sans attendre une série de cinq claques vigoureuses entre les omoplates ; si cela ne suffit pas, elle enchaîne avec cinq compressions abdominales (manœuvre de Heimlich), en alternant les deux techniques et en faisant alerter les secours en parallèle",

    correct: 2,
    expl: "Face à une obstruction totale des voies aériennes (victime incapable de parler, tousser ou respirer), tousser n'est plus possible et attendre est dangereux : le geste de secours est une série de <strong>cinq claques dans le dos</strong>, puis, en cas d'échec, <strong>cinq compressions abdominales (Heimlich)</strong>, en alternant les deux techniques jusqu'à désobstruction ou arrivée des secours, alertés sans délai. Faire boire une personne dont les voies aériennes sont obstruées est inutile et dangereux, et le massage cardiaque ne s'applique pas à une victime consciente qui n'est pas en arrêt cardiaque."

  {
    theme: "🚨 Conduite à tenir – Hypoglycémie sévère",

    choices: [

      "Elle lui fait immédiatement avaler un morceau de sucre ou une boisson sucrée, même inconscient, pour faire remonter rapidement sa glycémie",

    ],
    correct: 0,
    expl: "Donner du sucre par la bouche à une personne inconsciente expose à une fausse route par inhalation : dès qu'il y a perte de connaissance, on ne donne plus rien par la bouche, on place en <strong>position latérale de sécurité</strong>, on surveille la respiration et on alerte les secours sans délai. Le resucrage par la bouche n'est adapté que si la personne est consciente et capable d'avaler ; attendre une reprise spontanée n'est pas une réponse adaptée à une perte de connaissance."
  },
  {
    theme: "🚨 Conduite à tenir – Piqûre d'insecte, réaction locale",
    q: "Un stagiaire sans antécédent allergique connu se fait piquer par une guêpe à l'avant-bras pendant une sortie au pré. La zone rougit, gonfle modérément et devient douloureuse, mais il n'a ni difficulté à respirer, ni gonflement du visage ou de la gorge, ni malaise général.",
    choices: [
      "Elle utilise immédiatement le stylo auto-injecteur d'adrénaline du club « par précaution », même en l'absence de toute prescription pour ce stagiaire et de tout signe de gravité",
      "Elle presse fermement la piqûre entre deux doigts pour faire sortir le venin restant",
      "Elle emmène systématiquement le stagiaire aux urgences en ambulance, une piqûre de guêpe étant toujours une urgence vitale quelle que soit sa présentation",
      "Elle retire un éventuel dard résiduel sans pincer la poche à venin, nettoie et refroidit localement la zone (compresse froide protégée par un tissu), rassure le stagiaire, et surveille l'apparition éventuelle de signes généraux (gonflement du visage, difficulté à respirer, malaise) qui imposeraient d'alerter les secours"
    ],
    correct: 3,
    expl: "Une réaction locale isolée à une piqûre de guêpe, sans signe général (difficulté respiratoire, gonflement du visage, malaise), se traite par un retrait prudent d'un éventuel dard, un nettoyage et un refroidissement local, avec surveillance. L'adrénaline auto-injectable ne s'utilise que sur prescription individuelle et en présence de signes d'anaphylaxie, jamais « par précaution » sur une personne non concernée ; presser la piqûre peut au contraire diffuser davantage le venin ; et une réaction locale simple ne justifie pas systématiquement une évacuation en urgence absolue, seule la surveillance des signes généraux orientant vers une alerte des secours."
  },
  {
    theme: "🚨 Conduite à tenir – Entorse de cheville",

    choices: [

      "Elle envoie un SMS au 112, ce numéro n'étant accessible que par SMS en zone de faible couverture"

    correct: 2,
    expl: "Le <strong>112</strong>, numéro d'urgence unique européen, bénéficie d'un mécanisme d'itinérance d'urgence qui bascule automatiquement l'appel sur le réseau d'un opérateur concurrent présent dans la zone lorsque l'opérateur habituel ne capte pas ; encore faut-il qu'une carte SIM activée soit insérée dans le téléphone, l'appel sans carte SIM n'étant pas autorisé en France. Renoncer à essayer sur place, appeler un simple cabinet médical, ou penser le 112 réservé au SMS ne correspondent pas à ce fonctionnement."

  {

    choices: [

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, hygiène et construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
