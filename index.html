<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 6 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>6 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Lors d'un stage d'été, le responsable de la structure présente l'AE aux familles comme « polyvalent sur tous les publics, toutes activités, tous types de chevaux » et lui confie en solo l'organisation complète d'une journée portes ouvertes, sans qu'aucun titulaire de diplôme de niveau IV ne soit présent sur place. L'AE peut-il accepter en s'appuyant sur cette polyvalence ?",
    choices: [
      "Non : la polyvalence du référentiel de l'AE (âge du public, activité, effectif équin) ne supprime pas l'obligation d'exercer sous l'autorité pédagogique d'un titulaire d'un diplôme de niveau IV ou plus, qui doit rester identifiable et responsable de l'événement",
      "Oui, la polyvalence mentionnée dans le référentiel du titre dispense justement l'AE de toute autorité pédagogique supérieure",
      "Non, car la polyvalence du référentiel ne porte que sur l'encadrement en club équestre, jamais sur des événements extérieurs comme les portes ouvertes",
      "Oui, à condition que l'AE ait plus de 3 ans d'expérience professionnelle, ce qui équivaut réglementairement à un niveau IV"
    ],
    correct: 0,
    expl: "Le référentiel du titre professionnel <strong>Animateur d'Équitation</strong> (niveau 3 RNCP) le décrit comme polyvalent sur l'âge du public, l'activité encadrée et l'effectif équin — mais il exerce toujours sous l'<strong>autorité pédagogique d'un titulaire d'un diplôme, titre ou certificat de niveau IV ou plus</strong>. Cette polyvalence porte sur QUI il peut encadrer, jamais sur la possibilité de s'affranchir de cette autorité, quel que soit le format de l'événement (cours, stage, portes ouvertes...)."
  },
  {
    theme: "📋 EPMSP",
    q: "Une stagiaire n'a pas encore obtenu son attestation de validation de l'EPMSP. Le tuteur, débordé, lui demande néanmoins d'encadrer seule un groupe de 6 cavaliers pendant qu'il s'absente pour une urgence. Que doit faire la stagiaire ?",
    choices: [
      "Accepter, car l'alternance en formation autorise par défaut l'encadrement autonome de groupes, EPMSP ou non",
      "Accepter, mais uniquement si elle réduit le groupe à 3 cavaliers maximum",
      "Refuser d'encadrer seule le groupe : sans attestation EPMSP validée, elle ne peut intervenir qu'en observation pendant l'alternance, jamais en responsabilité autonome d'un groupe",
      "Accepter, à condition de prévenir les parents des cavaliers concernés"
    ],
    correct: 2,
    expl: "L'article <strong>R.212-4 du Code du sport</strong> impose que les stagiaires en formation soient placés sous l'autorité d'un tuteur et aient satisfait aux <strong>Exigences Préalables à la Mise en Situation Pédagogique (EPMSP)</strong>. Sans attestation EPMSP délivrée, l'alternance ne peut se dérouler qu'en <strong>observation</strong> : la stagiaire n'est pas habilitée à encadrer un groupe de façon autonome, quel que soit son effectif, même en cas d'urgence du tuteur."
  },
  {
    theme: "🪖 Sécurité / Équipement",
    q: "Une cavalière mineure participe à un exercice où elle mène son poney en longe à pied, sans jamais monter dessus. Une autre mineure, elle, fait un tour au pas à cru sur son poney. Laquelle des deux doit obligatoirement porter un casque aux normes en vigueur pendant l'exercice ?",
    choices: [
      "Aucune des deux, le port du casque n'étant obligatoire pour les mineurs qu'en compétition officielle",
      "Les deux, car tout mineur présent en carrière doit porter un casque, monté ou non",
      "Seulement celle qui mène le poney en longe, car le risque de morsure ou de coup de pied est plus élevé au sol qu'en selle",
      "Seulement celle qui est en selle, la réglementation dispensant le port du casque pour un mineur non monté (« à pied »), sauf en voltige où d'autres règles s'appliquent"
    ],
    correct: 3,
    expl: "Le port du casque conforme à la norme <strong>NF EN 1384</strong> est obligatoire pour tout mineur pratiquant l'équitation, à l'exception de la voltige (règles spécifiques) ou lorsque le pratiquant est <strong>à pied</strong>. La cavalière au sol qui mène son poney en longe sans monter n'est donc pas légalement tenue au port du casque, contrairement à celle qui est en selle, même à cru et au pas."
  },
  {
    theme: "📄 Licence & assurance",
    q: "Le parent d'un jeune cavalier licencié FFE te demande s'il peut renoncer à la garantie « accident corporel individuel » incluse dans la licence, tout en restant licencié. Que lui réponds-tu ?",
    choices: [
      "Non, aucune garantie de la licence FFE n'est modifiable, tout est un bloc obligatoire",
      "Oui : seule la garantie de responsabilité civile est obligatoire pour le licencié (art. L.321-1 du Code du sport et suivants) ; la garantie « accident corporel individuel », elle, peut être refusée par le licencié",
      "Non, la garantie individuelle accident est aussi obligatoire que la responsabilité civile depuis 2017",
      "Oui, mais uniquement pour les licenciés majeurs, jamais pour les mineurs"
    ],
    correct: 1,
    expl: "Le Code du sport (<strong>art. L.321-1 et suivants</strong>) ne rend obligatoire que la garantie de <strong>responsabilité civile</strong> pour tout licencié sportif. La garantie « individuelle accident corporel », proposée avec la licence FFE, peut être <strong>refusée</strong> par le licencié (ou son représentant légal pour un mineur), qui signe alors un document attestant en avoir été informé."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier se brûle la main en touchant par mégarde un fer chauffé par le maréchal-ferrant. La brûlure est rouge, sans plaie ouverte apparente. Quelle est la première conduite à tenir ?",
    choices: [
      "Refroidir la brûlure sous l'eau tempérée (15-25°C), pendant au moins 10 à 20 minutes, sans faire couler le jet directement dessus, puis retirer bagues/bijoux avant que la zone ne gonfle",
      "Appliquer immédiatement une pommade grasse pour protéger la peau, avant tout passage à l'eau",
      "Percer les éventuelles cloques pour évacuer le liquide et éviter l'infection",
      "Frotter la zone avec un glaçon directement appliqué sur la peau pour stopper la douleur rapidement"
    ],
    correct: 0,
    expl: "Le geste de référence (Croix-Rouge française) est le <strong>refroidissement immédiat à l'eau tempérée</strong> (15-25°C, jamais glacée) pendant au moins 10 à 20 minutes, en dirigeant l'eau en amont de la brûlure. Il faut retirer bagues et bijoux avant l'apparition d'un œdème, ne jamais percer une cloque, ne rien appliquer de gras avant refroidissement complet, et ne jamais mettre de glace directement sur la peau."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Une cavalière est piquée par une guêpe pendant le pansage. Quelques minutes plus tard, son visage gonfle rapidement et elle a du mal à respirer. Que fais-tu ?",
    choices: [
      "Tu attends quelques minutes pour voir si les symptômes régressent avant d'agir, la plupart des piqûres n'étant pas graves",
      "Tu lui fais boire beaucoup d'eau pour diluer le venin dans l'organisme",
      "Tu reconnais les signes d'une urgence vitale potentielle (œdème rapide, détresse respiratoire) : tu alertes immédiatement le 15 en décrivant précisément ces signes, tu consultes son éventuel PAI/trousse d'urgence si disponible et tu restes auprès d'elle jusqu'à l'arrivée des secours",
      "Tu lui administres toi-même un antihistaminique de la pharmacie du club, sans consulter son dossier"
    ],
    correct: 2,
    expl: "Un œdème du visage associé à une gêne respiratoire après une piqûre évoque une réaction allergique sévère (anaphylaxie), <strong>urgence vitale</strong> à traiter comme telle : alerte immédiate du 15 avec description précise des signes. Si la victime dispose d'un <strong>Projet d'Accueil Individualisé (PAI)</strong> prévoyant une trousse d'urgence, il doit être suivi tel que prescrit par du personnel désigné et formé — un encadrant ne doit jamais administrer de médicament de sa propre initiative, hors protocole prévu."
  },
  {
    theme: "📋 Construction de séance",
    q: "Tu arrives en carrière pour animer ta séance et remarques qu'une barre d'obstacle traîne au sol en travers de la piste, non prévue dans ton déroulé. Les premiers cavaliers arrivent. Que fais-tu ?",
    choices: [
      "Tu démarres la séance normalement : la barre ne fait pas partie de ton exercice, donc elle ne concerne pas ta responsabilité",
      "Tu demandes à un cavalier de la déplacer pendant que les autres commencent à travailler",
      "Tu contournes simplement la zone concernée avec le groupe sans rien signaler, pour ne pas perdre de temps",
      "Tu retires ou sécurises l'obstacle avant de faire évoluer qui que ce soit sur la piste, quitte à décaler légèrement le début de la séance, car l'analyse et la sécurisation du lieu de pratique priment sur le respect strict du timing prévu"
    ],
    correct: 3,
    expl: "L'analyse des éléments de sécurité relatifs au <strong>lieu de pratique</strong> fait partie intégrante de la préparation ET de la conduite de séance attendues à l'EPMSP. Un danger identifié sur l'aire d'évolution doit être traité avant le début de l'activité, même au prix d'un léger retard — jamais délégué à un cavalier, qui n'a pas la responsabilité pédagogique, ni ignoré."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un collègue affirme : « L'AE n'a pas le droit d'encadrer des cavaliers ayant dépassé le Galop 5, quel que soit le contexte. » Cette affirmation est-elle exacte au regard du référentiel du titre ?",
    choices: [
      "Oui, c'est la limite technique officielle inscrite dans le référentiel du titre AE",
      "Non : le référentiel ne fixe aucun plafond de niveau technique (Galop) au public encadrable — l'AE est polyvalent sur l'âge du public, l'activité et l'effectif équin ; la seule limite formelle documentée est l'exclusion de l'encadrement des pratiques compétitives de niveau Amateur et supérieur, sous autorité pédagogique d'un niveau IV",
      "Non, la limite réelle est le Galop 7, pas le Galop 5",
      "Oui, mais uniquement pour les activités de saut d'obstacles, les autres disciplines n'étant pas concernées"
    ],
    correct: 1,
    expl: "Le référentiel du titre professionnel Animateur d'Équitation le décrit comme <strong>polyvalent sur l'âge du public, l'activité encadrée et l'effectif équin</strong> — il n'existe pas de plafond de niveau technique (Galop) formalisé. La limite documentée porte sur le type de pratique (exclusion des pratiques compétitives de niveau Amateur et supérieur) et sur l'exercice sous l'autorité pédagogique d'un diplômé de niveau IV ou plus."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier chute et se plaint d'une douleur vive à l'avant-bras, qui présente une déformation visible. Il reste conscient. Que fais-tu, en plus d'alerter les secours ?",
    choices: [
      "Tu ne mobilises pas le membre déformé, tu ne tentes aucune manipulation ni réduction, tu laisses le cavalier dans la position où il se sent le moins mal, tu le rassures et tu surveilles son état jusqu'à l'arrivée des secours",
      "Tu tentes de redresser doucement le bras dans son axe normal pour limiter la douleur en attendant les secours",
      "Tu immobilises toi-même le bras avec une attelle de fortune fabriquée sur place, pour éviter tout mouvement",
      "Tu lui donnes un antidouleur de la trousse de secours pour patienter"
    ],
    correct: 0,
    expl: "Face à une suspicion de fracture, le geste attendu est de <strong>ne jamais mobiliser ni tenter de redresser</strong> le membre déformé : cela peut aggraver la lésion (nerfs, vaisseaux) et la douleur. On laisse la victime dans la position la moins inconfortable, on la rassure, on la surveille, et on laisse l'immobilisation et le traitement médicamenteux aux secours qualifiés."
  },
  {
    theme: "🩺 Santé / Accueil du public",
    q: "Avant un stage, un parent te remet le Projet d'Accueil Individualisé (PAI) de son enfant asthmatique, avec une trousse d'urgence contenant un bronchodilatateur. Quelle est ta responsabilité d'AE vis-à-vis de ce document ?",
    choices: [
      "Le PAI ne concerne que le cadre scolaire, il n'a aucune valeur dans un centre équestre ou un accueil collectif de mineurs",
      "Confier systématiquement la responsabilité de la trousse d'urgence aux parents, qui doivent rester sur place pendant toute la durée du stage",
      "Prendre connaissance du protocole prévu par le PAI, savoir où se trouve la trousse d'urgence, et appliquer ou faire appliquer ce protocole en cas de crise, en alertant les secours si la situation le dépasse — sans jamais improviser un traitement hors de ce cadre",
      "Refuser l'enfant au stage tant qu'aucun professionnel de santé n'est présent en permanence sur la structure"
    ],
    correct: 2,
    expl: "Le <strong>Projet d'Accueil Individualisé</strong> s'applique à tous les accueils collectifs de mineurs, centres équestres compris : il précise la conduite à tenir, la localisation de la trousse d'urgence et le protocole en cas de crise, élaboré avec la famille et les professionnels de santé. L'encadrant doit connaître ce protocole et savoir le déclencher (ou alerter les secours si dépassé), sans imposer la présence permanente des parents ni improviser un traitement médical hors cadre prévu."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
