<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 26 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>26 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le gérant du centre demande à l'AE d'emmener seule un petit groupe de cavaliers confirmés en promenade sur les chemins environnants, en dehors de l'enceinte du centre, sans qu'aucun titulaire d'un diplôme professionnel n'en soit informé ni disponible.",
    choices: [
      "Elle accepte : son habilitation AE suffit à encadrer n'importe quelle activité équestre, y compris hors du centre",
      "Elle refuse d'encadrer seule cette sortie hors du centre sans qu'un titulaire de diplôme de niveau IV ou plus en soit informé et organise réellement l'autorité pédagogique nécessaire, et signale la situation au gérant",
      "Elle accepte, à condition de faire signer à chaque cavalier une décharge de responsabilité avant de partir",
      "Elle accepte mais raccourcit elle-même l'itinéraire prévu, sans en informer personne, pour limiter les risques"
    ],
    correct: 1,
    expl: "L'AE encadre sous l'<strong>autorité pédagogique effective</strong> d'un titulaire de diplôme de niveau IV ou plus (Code du sport, art. L.212-1 et s.) ; sortir de l'enceinte du centre ne change rien à cette exigence. Une décharge signée par les cavaliers ne transfère pas la responsabilité pédagogique, et raccourcir seule l'itinéraire sans en informer personne n'est pas une réponse au problème de fond : l'AE doit alerter sa hiérarchie plutôt qu'improviser."
  },
  {
    theme: "🚨 Conduite à tenir – Crise convulsive",
    q: "Un stagiaire est pris de convulsions généralisées, tombe au sol et se raidit brutalement devant l'AE.",
    choices: [
      "Elle immobilise fermement ses membres pour l'empêcher de se blesser pendant les secousses",
      "Elle glisse un objet plat entre ses dents pour l'empêcher de se mordre la langue",
      "Elle protège sa tête et l'espace autour de lui sans le contenir ni rien placer dans sa bouche, chronomètre la crise, alerte les secours, puis le place en position latérale de sécurité s'il ne reprend pas conscience immédiatement après l'arrêt des secousses",
      "Elle attend simplement la fin de la crise sans intervenir ni alerter, une crise convulsive se terminant toujours spontanément sans gravité"
    ],
    correct: 2,
    expl: "Face à une crise convulsive, on ne <strong>contient jamais</strong> les mouvements et on ne place jamais rien dans la bouche (risque de blessure ou d'obstruction) : on protège la tête et l'environnement immédiat, on chronomètre, on alerte, puis on place en <strong>PLS</strong> après la crise si la conscience n'est pas immédiatement recouvrée. Une crise n'est jamais anodine par principe : elle doit toujours être signalée aux secours."
  },
  {
    theme: "🩺 Santé – Certificat médical absent",
    q: "Un nouveau stagiaire se présente pour son premier cours sans certificat médical d'aptitude ni attestation, affirmant ne pas être malade et vouloir commencer tout de suite \"pour ne pas perdre de temps\".",
    choices: [
      "Elle le laisse participer à la séance du jour, le certificat pouvant être fourni dans les jours suivants",
      "Elle refuse qu'il participe à l'activité tant que son aptitude n'est pas attestée dans les conditions prévues par la structure, et l'oriente vers la démarche à accomplir avant de pouvoir pratiquer",
      "Elle le fait uniquement observer sans monter, ce qui permet de contourner l'exigence d'aptitude pour ce jour-là",
      "Elle lui fait remplir et signer une déclaration sur l'honneur qu'elle rédige elle-même, en remplacement du document d'aptitude attendu"
    ],
    correct: 1,
    expl: "L'accueil d'un pratiquant suppose que son aptitude à la pratique soit attestée dans les conditions prévues <strong>avant</strong> qu'il ne commence l'activité ; ni l'impatience du stagiaire, ni une simple observation sans pratique, ni une déclaration rédigée par l'encadrant lui-même ne remplacent cette exigence. L'AE oriente vers la démarche à accomplir plutôt que de faire une exception ponctuelle."
  },
  {
    theme: "📋 Construction de séance – Ratio encadrant/public",
    q: "Pour une séance découverte, le gérant propose à l'AE d'accueillir seule un groupe deux fois plus nombreux que d'habitude, \"puisque ce sont de simples balades au pas en carrière\".",
    choices: [
      "Elle accepte sans réserve, le pas en carrière étant une activité peu risquée qui justifie d'augmenter l'effectif",
      "Elle évalue si elle peut réellement surveiller chaque cavalier et intervenir efficacement avec cet effectif, et refuse ou adapte (effectif réduit, appui supplémentaire) si ce n'est pas le cas, plutôt que d'accepter simplement parce que l'allure est lente",
      "Elle accepte, à condition de positionner les cavaliers les plus jeunes au centre du groupe",
      "Elle propose de superviser le groupe depuis l'extérieur de la carrière, pour avoir une vue d'ensemble, sans être positionnée à proximité immédiate des cavaliers"
    ],
    correct: 1,
    expl: "La sécurité d'une séance dépend de la capacité réelle de l'encadrant à surveiller et intervenir sur l'ensemble du groupe, pas seulement de l'allure pratiquée : un effectif doublé au pas peut déjà dépasser cette capacité si les cavaliers sont débutants ou hétérogènes. L'AE évalue cette faisabilité et ajuste plutôt que de se fier à la seule allure ou à une position d'observation éloignée qui retarderait son intervention."
  },
  {
    theme: "🛡️ Sécurité collective – Port du casque",
    q: "Un stagiaire adulte refuse de mettre une bombe homologuée avant de monter, expliquant qu'il \"monte depuis toujours sans problème\" et préfère ne pas en porter.",
    choices: [
      "Elle le laisse monter sans casque, le port du casque relevant du choix personnel d'un cavalier adulte expérimenté",
      "Elle refuse qu'il monte sans un casque homologué correctement attaché, quelle que soit son expérience affichée, et lui explique pourquoi avant de le laisser pratiquer",
      "Elle accepte, à condition qu'il reste uniquement au pas pendant toute la séance",
      "Elle le laisse monter sans casque pour cette séance mais lui demande de s'en procurer un pour la suivante"
    ],
    correct: 1,
    expl: "Le port d'un <strong>casque homologué</strong> correctement attaché s'applique à tous les pratiquants, quelle que soit l'expérience ressentie ou affichée : l'expérience ne protège pas d'une chute imprévisible, ni au pas ni à une autre allure. L'AE n'accorde aucune exception, même temporaire ou limitée à une allure, sur cette règle."
  },
  {
    theme: "🛡️ Sécurité du lieu – Départ d'incendie en écurie",
    q: "L'AE, présente en écurie, sent une forte odeur de fumée et aperçoit un début d'incendie dans un box vide au fond du bâtiment. Plusieurs chevaux sont encore attachés dans les box voisins.",
    choices: [
      "Elle ouvre immédiatement tous les box du bâtiment et relâche tous les chevaux en même temps dans la cour, pour les mettre à l'abri au plus vite",
      "Elle alerte sans délai les secours (18/112), fait évacuer les personnes présentes, et sort si possible chaque cheval individuellement tenu en longe vers un espace extérieur sécurisé et fermé, sans jamais relâcher un cheval paniqué sans contrôle",
      "Elle commence par tenter d'éteindre elle-même le départ de feu avant toute autre action, pour éviter que la situation ne s'aggrave avant l'arrivée des secours",
      "Elle attend l'arrivée des secours avant de faire sortir qui que ce soit du bâtiment, pour ne pas gêner leur intervention"
    ],
    correct: 1,
    expl: "Face à un départ d'incendie, l'alerte est <strong>immédiate</strong> (18/112) et la priorité va aux personnes puis aux chevaux, sortis un par un tenus en longe vers un espace extérieur sécurisé — jamais tous relâchés ensemble sans contrôle, ce qui créerait un risque de panique collective incontrôlable en cour. On n'attend pas les secours pour évacuer un bâtiment qui prend feu, mais on ne s'improvise pas non plus pompier au détriment de l'évacuation."
  },
  {
    theme: "🩺 Santé – Maladie contagieuse (teigne)",
    q: "L'AE remarque sur l'un des chevaux utilisés en cours des zones de poils cassés et de croûtes évoquant une teigne, potentiellement transmissible à l'humain par contact direct.",
    choices: [
      "Elle continue à utiliser ce cheval normalement pour les cours, la teigne équine ne concernant que les chevaux entre eux",
      "Elle retire ce cheval de l'activité en attendant un avis vétérinaire, évite tout contact direct prolongé avec les zones suspectes, informe la structure, et rappelle les règles d'hygiène (matériel de pansage individualisé, lavage des mains) aux stagiaires ayant été en contact",
      "Elle continue à utiliser le cheval, mais fait porter des gants uniquement aux stagiaires qui le préparent",
      "Elle isole seulement le matériel de pansage utilisé sur ce cheval, sans rien changer d'autre à son utilisation en cours"
    ],
    correct: 1,
    expl: "La teigne équine est une <strong>zoonose</strong> transmissible à l'humain par contact direct ou par du matériel partagé : un cheval suspect est retiré de l'activité en attendant un avis vétérinaire, et l'hygiène est rappelée aux personnes ayant été en contact. Continuer à l'utiliser normalement, même avec des gants pour certains stagiaires, ou se limiter au matériel sans retirer le cheval de l'activité, ne suffit pas à prévenir ce risque."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le club propose à l'AE de donner seule, contre rémunération, des cours particuliers réguliers de perfectionnement à un cavalier de bon niveau, sans qu'aucun titulaire d'un diplôme professionnel ne supervise ni n'encadre pédagogiquement cette activité.",
    choices: [
      "Elle accepte : la rémunération concerne le club et non sa qualification personnelle, qui reste valable dans tous les cas",
      "Elle refuse d'assurer seule, de façon autonome et sans autorité pédagogique effective d'un titulaire de diplôme de niveau IV ou plus, une activité d'enseignement rémunérée : son habilitation AE ne se substitue pas à un diplôme professionnel pour ce type d'encadrement autonome",
      "Elle accepte, à condition de facturer elle-même directement le cavalier plutôt que de passer par le club",
      "Elle accepte, en demandant simplement au club de l'assurer spécifiquement pour ce type de cours"
    ],
    correct: 1,
    expl: "L'AE encadre sous l'<strong>autorité pédagogique effective</strong> d'un titulaire de diplôme de niveau IV ou plus (Code du sport, art. L.212-1 et s.) ; son habilitation ne lui confère pas la qualification requise pour assurer seule, de façon autonome, un enseignement rémunéré sans ce cadre. Ni le mode de facturation, ni une assurance spécifique, ne régularisent une situation où l'autorité pédagogique effective d'un diplômé fait défaut."
  },
  {
    theme: "🚨 Conduite à tenir – Projection oculaire",
    q: "En pansant son cheval, un stagiaire reçoit une projection de poussière dans l'œil, qui devient rouge et larmoyant ; il se frotte vigoureusement pour \"faire sortir\" ce qu'il sent.",
    choices: [
      "Elle le laisse continuer à se frotter l'œil, ce geste aidant naturellement à évacuer le corps étranger",
      "Elle l'empêche de se frotter l'œil, rince abondamment à l'eau claire en gardant la paupière ouverte, du coin interne vers l'externe, et l'oriente vers une consultation si la gêne persiste ou si un corps étranger reste visible",
      "Elle tente elle-même de retirer le corps étranger avec un mouchoir propre, pour éviter d'attendre",
      "Elle applique une compresse sèche fermée sur l'œil et attend que ça passe avant d'agir davantage"
    ],
    correct: 1,
    expl: "Se frotter un œil irrité par un corps étranger risque d'aggraver une éraflure de la cornée : l'AE empêche ce geste, rince à l'eau claire (du coin interne vers l'externe) et oriente vers une consultation si la gêne persiste ou si un corps étranger reste visible. Elle ne tente jamais de retirer elle-même un corps étranger oculaire avec un objet, y compris un mouchoir, ce geste pouvant blesser l'œil davantage."
  },
  {
    theme: "🚨 Conduite à tenir – Protéger avant secourir",
    q: "Lors d'une sortie encadrée à proximité d'une route, un cavalier chute et son cheval se retrouve sur la chaussée, désorienté, pendant qu'un véhicule approche au loin.",
    choices: [
      "Elle se précipite en priorité vers le cavalier tombé pour évaluer son état, avant de s'occuper de la présence du cheval sur la route",
      "Elle sécurise d'abord la zone (signaler le danger, faire ralentir ou arrêter la circulation si possible, écarter le cheval de la chaussée en toute sécurité) avant d'examiner le cavalier, puis alerte les secours si nécessaire",
      "Elle laisse le cheval se calmer seul le temps de s'occuper du cavalier, un cheval finissant toujours par s'immobiliser spontanément",
      "Elle envoie un stagiaire du groupe seul vers la route pour gérer la circulation pendant qu'elle s'occupe du cavalier"
    ],
    correct: 1,
    expl: "Le premier réflexe face à un accident est de <strong>protéger avant de secourir</strong> : un danger persistant (cheval désorienté sur une route avec circulation) doit être neutralisé en priorité, sinon la situation peut s'aggraver (sur-accident) avant même de pouvoir s'occuper de la victime. On ne délègue jamais cette sécurisation à un stagiaire non formé, lui-même exposé au danger."
  }
];
let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, santé, construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
