<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 31 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>31 août 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Rémunération en nature",
    q: "Le gérant d'un club propose à l'AE, en dehors de son contrat habituel, d'animer un stage supplémentaire d'une semaine pendant les vacances scolaires. En échange, plutôt qu'un salaire, il lui offre l'hébergement sur place et la pension complète de son propre cheval pendant tout l'été, sans aucun versement d'argent.",
    choices: [
      "Puisqu'aucune somme d'argent n'est versée, cette activité n'est pas un enseignement contre rémunération au sens du Code du sport et aucune qualification particulière n'est requise",
      "L'hébergement et la pension du cheval offerts en contrepartie de l'animation du stage constituent un avantage en nature, assimilé à une rémunération au sens du Code du sport : l'obligation de qualification et de déclaration s'applique donc comme pour un stage payé en espèces",
      "Cet avantage en nature ne compte comme rémunération que s'il dépasse une valeur de plusieurs centaines d'euros, en deçà de laquelle l'activité reste assimilable à du bénévolat",
      "Cette contrepartie ne pose question que si elle est mentionnée par écrit dans un contrat ; à l'oral, elle échappe à la réglementation sur l'enseignement rémunéré"
    ],
    correct: 1,
    expl: "Au sens des textes d'application du Code du sport, constitue une rémunération toute contrepartie financière <strong>ou en nature</strong> accordée, dès lors qu'elle dépasse le simple remboursement de frais dûment justifiés. Un hébergement et une pension de cheval offerts en échange de l'animation d'un stage sont donc assimilés à une rémunération : l'obligation de qualification et de déclaration prévue par l'article L.212-1 du Code du sport s'applique, qu'il y ait ou non versement d'argent liquide, quelle que soit la valeur de l'avantage et qu'il soit ou non formalisé par écrit."
  },
  {
    theme: "⚖️ Réglementation encadrement – Encadrement en compétition",
    q: "Un cavalier du club, engagé en compétition officielle de niveau Amateur, demande à l'AE de le coacher personnellement au bord de la carrière pendant ses épreuves, comme le ferait habituellement l'enseignant diplômé d'État du club, absent ce jour de concours.",
    choices: [
      "Elle peut assurer ce coaching en compétition dès lors qu'elle connaît bien le cavalier et son cheval, la présence physique sur place suffisant à couvrir la responsabilité pédagogique",
      "L'encadrement de l'AE s'exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, et exclut l'accompagnement de pratiques compétitives de niveau Amateur ou supérieur : elle ne peut pas se substituer à l'enseignant diplômé pour ce coaching de concours",
      "Elle peut le faire uniquement si le cavalier signe une décharge autorisant l'AE à le coacher en son absence",
      "Elle peut le faire à condition de se limiter à des conseils oraux, sans intervenir physiquement sur le matériel ou le cheval"
    ],
    correct: 1,
    expl: "Le périmètre de l'Animateur d'Équitation, tel que défini par le livret pédagogique fédéral, s'exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou supérieur et exclut l'accompagnement de pratiques compétitives de niveau Amateur et au-delà, qui relève d'une qualification d'enseignant ou d'entraîneur. Ni la connaissance du couple cavalier/cheval, ni une décharge signée, ni le fait de se limiter à des conseils oraux ne permettent de contourner cette exclusion : l'absence de l'enseignant diplômé ce jour-là n'élargit pas le périmètre de compétence de l'AE."
  },
  {
    theme: "⚖️ Réglementation encadrement – Incapacité d'exercer",
    q: "L'AE apprend qu'elle fait l'objet d'une mesure d'interdiction temporaire d'exercer une activité impliquant un contact avec des mineurs, prononcée à titre de mesure judiciaire dans une affaire sans lien avec l'équitation. Son diplôme fédéral et sa carte professionnelle, obtenus antérieurement, ne sont pas expirés.",
    choices: [
      "Tant que son diplôme et sa carte professionnelle restent valides administrativement, elle peut continuer à encadrer normalement jusqu'à ce qu'une nouvelle carte lui soit explicitement retirée",
      "Une interdiction judiciaire d'exercer auprès de mineurs, même sans lien avec l'équitation, fait obstacle à l'exercice de fonctions d'éducateur sportif dans ce cadre : la validité du diplôme ou de la carte professionnelle ne suffit pas à couvrir la poursuite de son activité tant que cette mesure est en vigueur",
      "L'interdiction ne s'applique qu'aux mineurs qu'elle encadrait déjà avant la mesure ; elle peut continuer à encadrer de nouveaux groupes de mineurs non concernés par l'affaire",
      "Elle peut continuer à encadrer des mineurs à condition qu'un collègue titulaire d'un diplôme de niveau IV soit systématiquement présent en co-encadrement"
    ],
    correct: 1,
    expl: "La reconnaissance des qualifications et la délivrance de la carte professionnelle d'éducateur sportif (articles R.212-89 et R.212-90 du Code du sport) excluent les personnes frappées d'une mesure d'interdiction ou d'incapacité d'exercer prévue par la loi, y compris lorsque cette mesure résulte d'une procédure sans lien direct avec l'activité sportive. Une telle interdiction fait obstacle à l'encadrement de mineurs quel que soit le groupe concerné, la validité administrative du diplôme ou de la carte, ou la présence d'un co-encadrant diplômé, qui ne neutralisent pas une incapacité d'exercice en vigueur."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme dentaire (dent expulsée)",
    q: "Un stagiaire chute et reçoit un choc violent au visage : une incisive complète se retrouve entièrement expulsée de son alvéole, propre et intacte, ramassée immédiatement sur le sol du manège.",
    choices: [
      "Elle nettoie soigneusement la dent en la frottant sous l'eau du robinet avec un peu de savon avant de la conserver dans un mouchoir en papier sec, puis appelle les parents",
      "Elle saisit la dent par la couronne sans toucher la racine, la rince très brièvement sans frotter, la conserve dans du lait (ou à défaut de la salive), et fait consulter un dentiste ou un service d'urgence dans les plus brefs délais",
      "Elle attend simplement le prochain rendez-vous chez le dentiste, une dent expulsée définitivement ne pouvant de toute façon plus être réimplantée après quelques minutes",
      "Elle conserve la dent au sec dans un papier absorbant et la place au réfrigérateur en attendant que les parents viennent la récupérer en fin de journée"
    ],
    correct: 1,
    expl: "Une dent expulsée intacte peut souvent être réimplantée si l'on agit vite : il faut la saisir par la couronne (jamais par la racine, dont les fragments de ligament permettent la reprise), la rincer sans frotter ni savon (qui détruisent les cellules du ligament), la conserver dans un milieu compatible comme le lait ou la salive, et consulter en urgence — les chances de succès diminuent fortement avec le temps passé hors de la bouche. La laisser sécher au papier, la nettoyer au savon ou attendre un rendez-vous ordinaire réduisent ou annulent les chances de réimplantation."
  },
  {
    theme: "🚨 Conduite à tenir – Section de doigt",
    q: "En refermant précipitamment une porte de box, un stagiaire se sectionne partiellement l'extrémité d'un doigt. Le segment sectionné est retrouvé entier au sol, à côté d'une plaie qui saigne abondamment.",
    choices: [
      "Elle place directement le segment sectionné au contact des glaçons du congélateur du club pour le conserver au mieux avant l'arrivée des secours",
      "Elle comprime la plaie pour limiter le saignement, enveloppe le segment sectionné dans une compresse ou un linge propre légèrement humide, le place dans un sac plastique propre puis dans un second contenant avec des pains de glace sans contact direct, et fait alerter les secours en urgence",
      "Elle nettoie et désinfecte abondamment le segment sectionné à l'alcool avant de le rapporter avec le stagiaire, pour limiter le risque infectieux",
      "Elle jette le segment sectionné, trop petit pour être utile à une éventuelle réimplantation, et se concentre uniquement sur la plaie"
    ],
    correct: 1,
    expl: "Un segment amputé se conserve enveloppé dans une compresse ou un linge propre légèrement humide, placé dans un sac étanche puis dans un contenant réfrigéré, sans jamais être au contact direct de la glace (qui provoque une nécrose par gel équivalente à une brûlure) ni désinfecté à l'alcool (qui détruit les tissus utiles à une réimplantation) : ce conditionnement, associé à la compression de la plaie et à une alerte immédiate des secours, préserve les chances de réimplantation chirurgicale, qui ne doit jamais être écartée par principe."
  },
  {
    theme: "🚨 Conduite à tenir – Douleur thoracique chez un adulte",
    q: "Un parent accompagnateur, adulte, se plaint soudainement d'une douleur oppressante au milieu de la poitrine pendant qu'il regarde la séance, avec des sueurs et un teint pâle, sans autre cause évidente identifiée.",
    choices: [
      "Elle le fait s'allonger complètement à plat sur le dos et lui fait boire un verre d'eau sucrée pour faire passer le malaise",
      "Elle l'installe en position assise ou demi-assise, la plus confortable pour lui, ne lui donne rien à boire ni à manger, le maintient au calme sans effort, et fait alerter les secours (15 ou 112) sans délai",
      "Elle attend une dizaine de minutes pour voir si la douleur s'estompe spontanément avant d'envisager d'appeler qui que ce soit",
      "Elle lui fait poursuivre une marche lente autour du manège, le mouvement étant réputé aider à faire passer une douleur thoracique d'origine musculaire"
    ],
    correct: 1,
    expl: "Une douleur thoracique oppressante associée à des sueurs et une pâleur chez un adulte évoque un possible malaise cardiaque : la position assise ou demi-assise, la plus confortable pour la victime, limite l'effort du cœur, contrairement à l'allongement à plat ; il ne faut rien donner par la bouche, éviter tout effort (dont la marche), et alerter les secours sans délai plutôt que d'attendre une amélioration spontanée qui peut ne jamais venir dans ce contexte."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme oculaire (choc)",
    q: "Un coup de longe part accidentellement et atteint un stagiaire en plein œil. La paupière gonfle rapidement, le stagiaire voit trouble de cet œil et se plaint d'une douleur vive, sans plaie ni saignement visible sur le globe oculaire.",
    choices: [
      "Elle rince abondamment l'œil au sérum physiologique pendant plusieurs minutes, comme pour un corps étranger ou une projection de produit",
      "Elle appuie fermement sur l'œil avec une compresse pour faire dégonfler la paupière et calmer la douleur",
      "Elle évite tout frottement ou pression sur l'œil, applique éventuellement du froid protégé sur la paupière sans presser le globe, et oriente sans délai le stagiaire vers une consultation ophtalmologique ou un service d'urgence",
      "Elle considère que sans plaie ni saignement visibles, une simple surveillance à la maison en fin de journée suffit, sans consultation particulière"
    ],
    correct: 2,
    expl: "Face à un choc oculaire, même sans plaie extérieure visible, il ne faut ni frotter ni rincer l'œil (le rinçage n'est indiqué qu'en cas de projection chimique ou de corps étranger superficiel, pas de contusion), ni presser le globe, au risque d'aggraver une lésion interne invisible : seul un avis ophtalmologique rapide permet d'écarter une atteinte grave (hémorragie interne, décollement), ce que la seule absence de saignement extérieur ne garantit pas."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion de fracture fermée",
    q: "En tombant de cheval, un stagiaire se réceptionne sur la main. Son poignet gonfle rapidement et se déforme légèrement, la douleur est vive à la moindre tentative de mouvement, mais la peau reste intacte.",
    choices: [
      "Elle tente de repositionner doucement le poignet dans un axe plus normal avant l'arrivée des secours, pour limiter la déformation",
      "Elle immobilise le poignet dans la position où il se trouve sans chercher à le redresser, applique du froid protégé sans comprimer, surveille la couleur, la chaleur et la sensibilité des doigts, et oriente vers une consultation ou les secours si nécessaire",
      "Elle fait bouger doucement les doigts et le poignet à intervalles réguliers pour éviter que l'articulation ne se raidisse en attendant les secours",
      "Elle attend de voir si le gonflement diminue avant de décider s'il s'agit réellement d'une fracture ou d'une simple contusion"
    ],
    correct: 1,
    expl: "Devant une suspicion de fracture fermée, il ne faut jamais tenter de réduire ou redresser soi-même la déformation, ni mobiliser l'articulation « pour l'assouplir » : le geste correct est d'immobiliser dans la position trouvée, d'appliquer du froid protégé et de surveiller en permanence la coloration, la chaleur et la sensibilité des doigts, signes d'alerte d'une complication vasculaire ou nerveuse, avant d'orienter vers un avis médical. Attendre l'évolution du gonflement pour statuer retarde une prise en charge qui doit être rapide en cas de doute."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion de toxi-infection alimentaire collective",
    q: "Une heure après un goûter d'anniversaire partagé au club, plusieurs stagiaires présentent simultanément des maux de ventre, des nausées et des vomissements, alors qu'ils n'ont mangé que ce goûter en commun ce jour-là.",
    choices: [
      "Elle jette immédiatement les restes du goûter à la poubelle pour éviter que d'autres stagiaires n'en mangent, avant de s'occuper des malades",
      "Elle considère qu'un simple mal de ventre collectif après un goûter d'anniversaire ne nécessite aucun signalement particulier, les symptômes disparaissant en général seuls",
      "Elle évalue et surveille les stagiaires concernés, alerte les secours en cas de signe de gravité, et informe sans délai le responsable du club afin que les restes du goûter soient conservés (et non jetés) et qu'un signalement de suspicion de toxi-infection alimentaire collective soit envisagé auprès des autorités sanitaires",
      "Elle ne prévient que les familles concernées, un tel épisode ne relevant d'aucune démarche administrative ou sanitaire particulière"
    ],
    correct: 2,
    expl: "L'apparition simultanée de symptômes digestifs chez plusieurs personnes ayant partagé un même repas évoque une toxi-infection alimentaire collective (TIAC), à signaler sans délai aux autorités sanitaires (ARS) par le responsable de la structure, sans attendre une confirmation ; les aliments ou restes suspects doivent être conservés, et non jetés, pour permettre l'enquête. L'AE doit donc surveiller les stagiaires, alerter les secours si des signes de gravité apparaissent, et informer immédiatement le responsable du club plutôt que de gérer la situation seule ou de la minimiser."
  },
  {
    theme: "🚨 Conduite à tenir – Inhalation d'eau lors d'un passage de gué",
    q: "Lors d'une sortie à cheval, un cavalier chute dans une rivière peu profonde au passage d'un gué et avale un peu d'eau en toussant. Il ressort seul de l'eau, semble aller bien, respire normalement et plaisante sur l'incident.",
    choices: [
      "Puisqu'il respire normalement et plaisante, l'AE considère l'incident clos et reprend la sortie sans aucune précaution particulière",
      "Même en l'absence de détresse immédiate, une inhalation d'eau peut irriter les voies respiratoires et entraîner une aggravation retardée dans les heures suivantes : l'AE reste attentive à l'apparition de toute gêne respiratoire ou de toux persistante et oriente vers un avis médical au moindre signe, plutôt que de considérer l'épisode définitivement sans suite",
      "Elle lui fait immédiatement effectuer plusieurs efforts physiques intenses pour vérifier que sa respiration ne se dégrade pas à l'effort",
      "Elle l'allonge sur le ventre et appuie fermement dans son dos pour faire ressortir l'eau avalée avant de poursuivre la sortie"
    ],
    correct: 1,
    expl: "Une petite quantité d'eau inhalée lors d'une chute dans l'eau peut irriter les voies respiratoires et provoquer une gêne qui n'apparaît que plusieurs heures plus tard, même chez une personne qui semble aller bien immédiatement après l'incident : la vigilance doit donc se poursuivre sur la conscience et la respiration dans les heures suivantes, avec un avis médical au moindre signe, plutôt que de clore l'épisode sans suivi. Provoquer un effort intense ou tenter de faire ressortir l'eau par des manœuvres manuelles ne sont pas des gestes adaptés."
  },
  {
    theme: "🚨 Conduite à tenir – Réaction cutanée après contact avec des orties",

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, hygiène et construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
