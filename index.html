<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 16 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>16 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le gérant, débordé, propose à l'AE de prendre en charge seule, de bout en bout, la conception ET l'animation d'un cycle complet de cours débutants pendant plusieurs semaines, sans qu'aucun titulaire d'un diplôme de niveau IV ou plus n'intervienne à aucun moment dans la programmation ni le suivi, arguant que « ce n'est que de l'initiation, donc ça rentre bien dans le champ de l'AE ».",
    choices: [
      "C'est conforme : dès lors qu'il s'agit d'initiation, l'AE peut concevoir et suivre seule un cycle complet sans aucune intervention d'un titulaire de niveau IV ou plus",
      "Ce n'est pas conforme : même pour de l'initiation, l'AE exerce toujours sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, qui doit rester impliqué dans la programmation et le suivi du cycle, et pas seulement disponible en cas de problème",
      "C'est conforme uniquement si l'AE a plus de deux ans d'expérience dans ce club",
      "Ce n'est pas conforme, mais uniquement si les stagiaires du cycle sont mineurs"
    ],
    correct: 1,
    expl: "Le niveau de public (ici de l'initiation) ne suffit pas à rendre l'organisation conforme : le diplôme d'AE s'exerce structurellement sous l'<strong>autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus, qui doit rester réellement impliqué dans la programmation et le suivi, et non se contenter d'exister quelque part dans l'organigramme du club. Ni l'ancienneté de l'AE ni l'âge des stagiaires ne créent de dérogation à cette exigence structurelle."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme crânien",
    q: "Un cavalier chute, heurte le sol la tête la première malgré son casque, et reste inconscient quelques secondes avant de se relever seul en disant qu'il va bien et qu'il veut « remonter tout de suite pour ne pas perdre confiance ».",
    choices: [
      "L'AE le laisse remonter puisqu'il semble parfaitement conscient et motivé, en restant simplement plus attentive que d'habitude pendant le reste de la séance",
      "L'AE retire son casque pour vérifier qu'il n'a pas de blessure visible au crâne, puis le laisse remonter si rien n'est visible",
      "Toute perte de connaissance après un choc à la tête, même brève, impose d'arrêter l'activité pour ce cavalier, de le surveiller en continu (conscience, respiration, apparition de maux de tête, vomissements, confusion) et d'alerter le 15/112, sans le laisser remonter ni reprendre une activité malgré son insistance",
      "L'AE l'autorise à remonter seulement au pas et pour un tour de manège, comme compromis raisonnable"
    ],
    correct: 2,
    expl: "Toute <strong>perte de connaissance</strong> consécutive à un choc à la tête, même de quelques secondes et même si la personne semble ensuite normale, constitue un signe de gravité qui impose l'arrêt immédiat et définitif de l'activité pour la victime, une surveillance continue de sa conscience et de sa respiration, et une alerte au 15/112. L'apparente lucidité retrouvée ne permet ni de remonter à cheval, même au pas, ni de retarder l'alerte : des complications peuvent apparaître de façon différée. Retirer le casque n'apporte aucune garantie et n'est pas un geste qui autorise la reprise de l'activité."
  },
  {
    theme: "🩺 Santé – Projet d'accueil individualisé",
    q: "Une stagiaire dont la fiche sanitaire signale un asthme traité se dit essoufflée et se met à tousser fortement après un exercice au trot ; elle réalise qu'elle a oublié sa ventoline à la maison.",
    choices: [
      "L'AE la fait s'allonger à plat et lui demande de respirer profondément et lentement pour se calmer",
      "L'AE arrête immédiatement son effort, l'installe en position assise ou semi-assise pour faciliter sa respiration, la rassure en l'aidant à ralentir sa respiration, et alerte le 15/112 puisqu'aucun traitement bronchodilatateur n'est disponible sur place",
      "L'AE la fait patienter à l'écart du groupe sans intervenir, une crise d'asthme se calmant généralement seule en quelques minutes",
      "L'AE envoie un autre stagiaire chercher la trousse de premiers secours du club pour y trouver un médicament contre l'asthme à lui donner"
    ],
    correct: 1,
    expl: "Face à une gêne respiratoire évoquant une <strong>crise d'asthme</strong> sans traitement bronchodilatateur disponible, il faut arrêter tout effort, installer la victime en position assise ou semi-assise (jamais allongée à plat, qui aggrave la gêne respiratoire), la rassurer pour l'aider à ralentir sa respiration, et alerter le 15/112 sans attendre que « ça passe seul ». L'AE ne doit jamais administrer un médicament qui n'est pas celui prescrit à la victime, même trouvé dans la trousse de secours du club."
  },
  {
    theme: "🛡️ Sécurité du lieu de pratique",
    q: "Après une averse, l'AE constate en arrivant en carrière que le sol est par endroits détrempé et glissant, avec une flaque importante juste avant un obstacle prévu à la fiche de séance du jour.",
    choices: [
      "Elle maintient l'obstacle mais demande aux cavaliers de ralentir un peu avant de le franchir",
      "Elle retire ou évite la zone concernée par l'obstacle et adapte le tracé et les allures aux zones où le sol reste praticable en sécurité, plutôt que de maintenir telle quelle une situation d'apprentissage prévue sur un terrain devenu dangereux",
      "Elle déplace uniquement les cavaliers les plus expérimentés sur cet obstacle, jugeant qu'eux seuls savent gérer un sol glissant",
      "Elle continue normalement la séance prévue, la pluie étant déjà passée au moment de la séance"
    ],
    correct: 1,
    expl: "La <strong>sécurité du lieu de pratique</strong> fait partie des éléments que l'AE doit vérifier avant et pendant la séance : un sol détrempé et glissant à l'approche d'un obstacle constitue un risque de chute pour le cheval comme pour le cavalier, quelle que soit l'expérience de ce dernier. La fiche de séance est un support de préparation, pas un plan figé : l'AE doit adapter le tracé, éviter la zone dangereuse ou modifier les allures en fonction de l'état réel du terrain, plutôt que de maintenir une situation d'apprentissage devenue risquée."
  },
  {
    theme: "📋 Construction de séance / Public",
    q: "Un nouveau stagiaire arrive pour sa première séance dans le groupe ; l'AE découvre seulement au moment de le mettre en selle, par une remarque de sa famille, qu'il se déplace habituellement avec des béquilles suite à une opération récente, sans qu'aucune information ne lui ait été transmise au préalable par la structure.",
    choices: [
      "Elle refuse catégoriquement toute participation de ce stagiaire à la séance du jour, un handicap temporaire rendant selon elle toute pratique impossible",
      "Elle le met en selle normalement avec le reste du groupe, sans changer son organisation, pour ne pas le stigmatiser devant les autres",
      "Elle interrompt la mise en selle, prend le temps de recueillir auprès du stagiaire ou de sa famille les informations nécessaires sur ses possibilités et limites, et sollicite si besoin le responsable pédagogique de la structure avant d'adapter (ou non) sa prise en charge",
      "Elle laisse le stagiaire décider lui-même s'il se sent capable de monter, sans chercher plus d'informations"
    ],
    correct: 2,
    expl: "La <strong>prise en compte des caractéristiques du public</strong> suppose de disposer d'informations fiables avant d'engager la pratique, en particulier face à une situation de santé non anticipée découverte au dernier moment. Ni l'exclusion automatique, ni la mise en selle « comme si de rien n'était », ni le fait de laisser un mineur ou un stagiaire juger seul de ses propres capacités ne sont des réponses adaptées : l'AE doit interrompre le temps de recueillir l'information nécessaire, au besoin en sollicitant le responsable pédagogique de la structure, avant toute décision."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le club organise une sortie à cheval en extérieur, hors des installations, avec plusieurs mineurs du club. Certaines familles n'ont signé que l'autorisation parentale générale d'inscription à l'année, sans autorisation spécifique mentionnant une sortie hors du site.",
    choices: [
      "L'autorisation générale d'inscription suffit pour toute activité proposée par le club, y compris les sorties hors des installations",
      "Seul l'accord oral du mineur présent ce jour-là est nécessaire, l'autorisation écrite des parents n'étant utile que pour les activités en intérieur",
      "L'AE peut emmener les mineurs concernés en sortie, à condition de prévenir les parents par téléphone juste avant le départ",
      "Les mineurs dont la famille n'a pas signé d'autorisation couvrant spécifiquement une sortie hors des installations ne doivent pas y participer tant que cette autorisation n'est pas obtenue, une autorisation générale d'inscription ne valant pas accord pour ce type d'activité particulière"
    ],
    correct: 3,
    expl: "Une sortie hors des installations du club constitue une activité présentant des risques et des conditions différentes d'une séance habituelle en manège ou en carrière : elle nécessite une <strong>autorisation parentale spécifique</strong>, qu'une autorisation générale d'inscription à l'année ne couvre pas automatiquement. Ni un accord oral du mineur, ni un simple appel téléphonique de dernière minute ne remplacent cette autorisation écrite préalable : sans elle, le mineur concerné ne doit pas participer à la sortie."
  },
  {
    theme: "🚨 Conduite à tenir – Plaie qui saigne",
    q: "En manipulant un cheval au pied, un stagiaire reçoit un coup de sabot sur le mollet ; la peau est ouverte et le saignement est continu et abondant.",
    choices: [
      "L'AE exerce sans attendre une compression manuelle directe sur la plaie avec un tissu propre ou une compresse, sans retirer un éventuel corps étranger planté dans la plaie, puis alerte le 15/112 si le saignement ne s'arrête pas ou si la plaie paraît profonde",
      "L'AE nettoie d'abord la plaie à l'eau avant de faire quoi que ce soit d'autre, pour éviter le risque d'infection",
      "L'AE surélève simplement la jambe sans exercer de compression, en attendant que le saignement diminue naturellement",
      "L'AE pose immédiatement un garrot serré au-dessus de la plaie, par précaution, avant même d'avoir essayé une compression directe"
    ],
    correct: 0,
    expl: "Face à une <strong>hémorragie</strong> continue et abondante, le geste prioritaire est la compression manuelle directe sur la plaie avec un tissu propre, sans retirer un éventuel corps étranger qui pourrait limiter le saignement, puis l'alerte du 15/112 si le saignement ne cède pas ou si la plaie semble profonde. Nettoyer la plaie avant de contrôler le saignement, se contenter d'une surélévation sans compression, ou poser d'emblée un garrot (geste réservé aux hémorragies massives non contrôlables autrement) sont des erreurs qui retardent ou remplacent à tort le geste de premiers secours prioritaire."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Juste avant la mise en selle, l'AE remarque qu'un cavalier porte un casque dont la jugulaire pend, non attachée sous le menton, le stagiaire expliquant que « ça le gêne » et qu'il préfère la laisser détachée.",
    choices: [
      "Elle laisse le cavalier monter ainsi, le port du casque sur la tête étant selon elle la seule chose qui compte réellement",
      "Elle exige que la jugulaire soit correctement attachée sous le menton avant toute mise en selle, un casque non fixé pouvant se détacher lors d'une chute et ne plus protéger la tête au moment où c'est nécessaire",
      "Elle autorise la monte sans jugulaire attachée, mais uniquement au pas",
      "Elle propose de remplacer le casque par une bombe plus ancienne, jugulaire ou pas"
    ],
    correct: 1,
    expl: "Un casque dont la <strong>jugulaire n'est pas attachée</strong> peut se détacher de la tête au moment précis d'une chute, perdant alors toute son utilité protectrice. Le simple fait de porter un casque sur la tête ne suffit pas : la jugulaire correctement réglée et fermée sous le menton est une condition de son efficacité, à toutes les allures, y compris au pas où les chutes restent possibles."
  },
  {
    theme: "📋 Construction de séance",
    q: "Lors d'une journée de forte chaleur (canicule), la séance prévue à la fiche du jour comporte un travail soutenu au trot et au galop sur la totalité de l'heure, aux heures les plus chaudes de l'après-midi.",
    choices: [
      "Elle maintient l'intégralité du programme prévu, la chaleur ne concernant selon elle que le confort et non la sécurité",
      "Elle adapte la séance : réduit l'intensité et la durée des efforts soutenus, privilégie si possible les zones ombragées, prévoit des pauses et un accès à l'eau pour les cavaliers, et reste attentive aux signes de coup de chaleur chez les cavaliers comme chez les chevaux",
      "Elle annule totalement la séance sans proposer d'alternative, une forte chaleur rendant selon elle toute activité équestre impossible",
      "Elle raccourcit uniquement la phase d'échauffement, en gardant l'intensité prévue pour le reste de la séance"
    ],
    correct: 1,
    expl: "Une chaleur importante augmente le risque de <strong>coup de chaleur et de déshydratation</strong>, aussi bien pour les cavaliers que pour les chevaux, en particulier lors d'efforts soutenus prolongés. L'AE doit adapter la fiche de séance prévue — intensité, durée, ombrage, pauses, accès à l'eau — plutôt que de la maintenir telle quelle ou de l'annuler purement et simplement : la sécurité impose une adaptation réelle du contenu, pas seulement un ajustement cosmétique comme raccourcir l'échauffement."
  },
  {
    theme: "🚨 Conduite à tenir – Alerte en urgence",
    q: "Une stagiaire se blesse sérieusement pendant que le titulaire du diplôme de niveau IV ou plus, présent sur le site, est occupé ailleurs avec un autre groupe et injoignable dans l'instant. L'AE hésite : doit-elle attendre son arrivée avant d'agir, considérant qu'elle n'a pas l'autorité pour décider seule d'alerter les secours ?",
    choices: [
      "Oui, l'AE doit impérativement attendre l'arrivée ou l'accord du titulaire de niveau IV ou plus avant d'alerter les secours, puisqu'elle agit sous son autorité pédagogique",
      "Non : face à une situation d'urgence, l'AE doit immédiatement protéger, alerter le 15/112 et secourir sans attendre l'arrivée ou l'accord du titulaire de niveau IV ou plus, qu'elle informera en parallèle ou dès que possible ; l'autorité pédagogique encadre l'exercice normal de la fonction, pas la réaction face à un danger immédiat",
      "L'AE doit d'abord essayer d'appeler elle-même la famille de la victime, avant d'envisager d'alerter les secours",
      "L'AE ne doit alerter les secours que si elle parvient à joindre le titulaire de niveau IV ou plus dans les minutes qui suivent"
    ],
    correct: 1,
    expl: "L'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus encadre l'exercice normal des fonctions de l'AE (programmation, autonomie sur le contenu des séances), mais elle ne suspend jamais le devoir d'agir immédiatement face à un danger : <strong>protéger, alerter, secourir</strong> sont des réflexes qui s'appliquent sans délai, indépendamment de la présence ou de la disponibilité immédiate du responsable. Attendre son accord avant d'alerter le 15/112, ou faire passer un appel à la famille avant les secours, ferait perdre un temps précieux dans une situation d'urgence."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
