<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 15 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>15 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le club inscrit un cavalier de la structure à une épreuve de saut d'obstacles de niveau Amateur. Le gérant demande à l'AE de préparer seule ce cavalier en piste le jour du concours, aucun encadrant diplômé de niveau IV ou plus n'étant disponible sur le site ce jour-là.",
    choices: [
      "C'est conforme, dès lors que l'AE connaît bien le cavalier et l'a déjà entraîné plusieurs fois en club",
      "C'est conforme uniquement si le cavalier est majeur, cette limite ne s'appliquant qu'aux mineurs",
      "Ce n'est pas conforme : le champ d'action de l'AE exclut l'encadrement des pratiques compétitives de niveau Amateur et au-delà, quelle que soit la familiarité de l'AE avec le cavalier ou son âge — cet encadrement relève d'un diplôme de niveau supérieur",
      "Ce n'est pas conforme, mais uniquement si le cavalier n'obtient pas un bon résultat en piste"
    ],
    correct: 2,
    expl: "Le diplôme d'AE, certification fédérale de niveau III, permet d'initier à l'équitation sous l'<strong>autorité pédagogique</strong> d'un titulaire de diplôme de niveau IV ou plus, et exclut explicitement l'encadrement des pratiques compétitives de niveau Amateur et au-delà. Ni la familiarité avec le cavalier, ni sa majorité, ni le résultat obtenu en piste ne créent de dérogation : c'est le niveau de la pratique compétitive elle-même qui sort du champ d'action de l'AE."
  },
  {
    theme: "🚨 Conduite à tenir – Fracture suspectée",
    q: "Après une chute, un cavalier se plaint d'une douleur vive au poignet, qui présente une déformation visible et un gonflement rapide. Il essaie malgré tout de bouger la main.",
    choices: [
      "L'AE ne tente aucune manipulation ni redressement du membre, l'immobilise dans la position où elle se trouve (par exemple en la calant avec un vêtement plié, sans forcer), rassure la victime, et alerte le 15/112 en décrivant clairement les signes observés",
      "L'AE essaie de redresser doucement le poignet pour vérifier si la douleur diminue, avant de décider s'il faut appeler les secours",
      "L'AE applique immédiatement une attelle rigide serrée, confectionnée avec du matériel du club, pour bien bloquer l'articulation",
      "L'AE demande au cavalier de continuer à bouger doucement la main pour « ne pas que ça se bloque », en attendant de voir si la douleur passe"
    ],
    correct: 0,
    expl: "Face à une déformation et une douleur vive évoquant une <strong>fracture</strong>, il ne faut jamais tenter de redresser, manipuler ou faire bouger le membre atteint, au risque d'aggraver la lésion. Le geste correct est d'immobiliser tel quel sans forcer, de rassurer la victime, et d'alerter le 15/112 en décrivant précisément les signes. Redresser, attacher une attelle serrée soi-même, ou faire mobiliser le membre par la victime sont des erreurs fréquentes qui peuvent aggraver une fracture ou une lésion associée."
  },
  {
    theme: "🩺 Santé – Certificat médical et mineur",
    q: "Un stagiaire mineur, inscrit pour la première séance du cycle, se présente sans certificat médical de non contre-indication à jour et sans autorisation parentale signée pour l'année en cours. Le groupe est déjà prêt à commencer.",
    choices: [
      "L'AE le fait quand même participer normalement à la séance, une régularisation administrative pouvant toujours se faire après coup",
      "L'AE le fait participer, mais seulement aux exercices à pied, sans monte, jugeant cela suffisamment prudent",
      "L'AE lui demande simplement une déclaration orale de bonne santé pour pouvoir commencer la séance",
      "L'AE ne le met pas en selle et ne le fait pas participer aux activités tant que le certificat médical et l'autorisation parentale à jour ne sont pas fournis ou vérifiés, ces documents étant une condition préalable à la pratique, en particulier pour un mineur"
    ],
    correct: 3,
    expl: "Un club est tenu de disposer d'un <strong>certificat médical</strong> de non contre-indication et, pour un mineur, d'une <strong>autorisation parentale</strong> nominative à jour avant toute pratique. Une déclaration orale ne remplace pas ces documents, et limiter la séance aux exercices à pied ou différer la vérification « après coup » ne régularise pas la situation : tant que ces conditions préalables ne sont pas réunies, le mineur ne doit pas être mis en selle ni engagé dans l'activité."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Un cavalier débutant se présente pour une séance à poney avec des baskets de sport à semelle plate, sans talon, n'ayant pas prévu de bottes ou de chaussures d'équitation.",
    choices: [
      "L'AE laisse le cavalier monter avec ces baskets, le port du casque suffisant selon elle à assurer sa sécurité",
      "L'AE refuse la monte avec ce type de chaussure : sans talon, le pied risque de glisser entièrement à travers l'étrier et de s'y coincer en cas de chute, ce qui expose à un risque de traînage particulièrement dangereux ; elle propose une alternative adaptée ou reporte la monte",
      "L'AE autorise la monte, mais seulement au pas, estimant que le risque ne concerne que les allures rapides",
      "L'AE fait retirer les étriers de la selle pour permettre au cavalier de monter sans chaussure adaptée"
    ],
    correct: 1,
    expl: "Une chaussure sans talon ne retient pas le pied dans l'étrier : en cas de chute, le pied peut glisser entièrement à travers et s'y coincer, avec un risque de <strong>traînage</strong> par le cheval, extrêmement dangereux. Ce risque existe à toutes les allures, y compris au pas. Le port du casque ne compense pas ce risque spécifique, et retirer les étriers ne règle rien puisque le contrôle et l'équilibre du cavalier en dépendent : la monte doit être refusée tant qu'une chaussure adaptée à talon n'est pas portée."
  },
  {
    theme: "📋 Construction de séance",
    q: "En pleine séance en extérieur, l'AE entend un coup de tonnerre au loin et voit le ciel se couvrir rapidement de nuages sombres, alors que la séance suit son déroulement normal, à mi-parcours de la fiche prévue.",
    choices: [
      "Elle termine l'exercice en cours avant de statuer, pour ne pas interrompre brutalement l'apprentissage",
      "Elle continue la séance normalement tant qu'il ne pleut pas encore réellement",
      "Elle interrompt la séance sans attendre et met le groupe à l'abri, la sécurité face au risque orageux (foudre) primant sur le déroulement prévu de la fiche de séance",
      "Elle raccourcit simplement la séance de quelques minutes, en restant en extérieur jusqu'à la fin prévue"
    ],
    correct: 2,
    expl: "Le tonnerre signale un risque de <strong>foudre</strong> à proximité, indépendamment du fait qu'il pleuve déjà ou non : ce danger impose une mise à l'abri immédiate, sans attendre la fin de l'exercice en cours ni l'apparition de la pluie. La sécurité prime toujours sur le déroulement prévu de la fiche de séance, qui n'est qu'un outil de préparation et non un cadre à respecter coûte que coûte face à un risque avéré."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise",
    q: "Lors d'une séance très chaude, un stagiaire se plaint de vertiges puis perd connaissance quelques secondes. Il respire normalement et reprend connaissance rapidement, mais reste confus.",
    choices: [
      "L'AE l'installe en position latérale de sécurité s'il perd à nouveau connaissance, sinon allongé au repos à l'ombre, surveille sa respiration et sa conscience en continu, ne lui donne rien à boire tant qu'il n'est pas pleinement conscient, et alerte le 15/112",
      "L'AE lui fait boire rapidement de l'eau fraîche pour le réhydrater dès qu'il reprend connaissance, avant même de vérifier son état de conscience",
      "L'AE le fait asseoir immédiatement et lui demande de se relever dès qu'il se sent mieux, pour ne pas prolonger l'inquiétude du groupe",
      "L'AE attend simplement qu'il reprenne totalement ses esprits sans surveiller sa respiration, la perte de connaissance ayant été très brève"
    ],
    correct: 0,
    expl: "Après une perte de connaissance, même brève, il faut surveiller en continu la <strong>respiration et l'état de conscience</strong>, installer la victime au repos (position latérale de sécurité en cas de nouvelle perte de connaissance), ne rien donner à boire tant que la conscience n'est pas pleinement récupérée (risque de fausse route), et alerter le 15/112. Faire boire trop tôt, faire lever précipitamment, ou ne pas surveiller la respiration sous prétexte que l'épisode a été bref sont des erreurs qui retardent la détection d'une aggravation."
  },
  {
    theme: "⚖️ Statut de l'AE",
    q: "Un collègue stagiaire affirme à l'AE que son diplôme ne lui permettrait pas d'être rémunérée pour encadrer des séances, seuls les diplômes d'État comme le BPJEPS ouvrant droit, selon lui, à une rémunération — l'AE ne pouvant agir qu'à titre bénévole.",
    choices: [
      "C'est exact : l'AE ne peut exercer qu'à titre strictement bénévole, quel que soit le contexte",
      "C'est exact, sauf si l'AE cumule plusieurs années d'ancienneté dans le même club",
      "C'est inexact : l'AE peut être rémunérée, mais uniquement pour des tâches d'entretien des installations, jamais pour l'encadrement pédagogique lui-même",
      "C'est inexact : le diplôme d'AE est une certification fédérale qui permet bien d'exercer des fonctions d'encadrement équestre contre rémunération, mais toujours dans le cadre de l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus"
    ],
    correct: 3,
    expl: "Le diplôme d'AE est une certification professionnelle fédérale (inscrite au RNCP) qui permet bien d'exercer des <strong>fonctions rémunérées</strong> d'encadrement équestre, et non une simple reconnaissance bénévole. Cette rémunération reste toutefois encadrée : elle s'exerce sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, et dans les limites du champ d'action de l'AE. L'ancienneté ne change rien à ce cadre, et rien ne limite la rémunération aux seules tâches d'entretien."
  },
  {
    theme: "🚨 Conduite à tenir – Réaction allergique",
    q: "Pendant le pansage, plusieurs stagiaires sont piqués par un essaim de guêpes dérangé près des boxes. L'un d'eux présente rapidement un gonflement important du visage et commence à avoir du mal à respirer.",
    choices: [
      "L'AE applique du vinaigre sur les piqûres et attend de voir si les symptômes s'aggravent avant d'agir davantage",
      "L'AE reconnaît les signes possibles d'une réaction allergique sévère (gonflement rapide du visage, difficulté respiratoire), alerte immédiatement le 15/112 en décrivant précisément ces signes, installe la victime en position semi-assise si elle respire difficilement, et la surveille sans la laisser seule jusqu'aux secours",
      "L'AE éloigne uniquement le reste du groupe des guêpes, en attendant que les piqûres dégonflent naturellement avant de s'inquiéter pour ce stagiaire en particulier",
      "L'AE fait allonger la victime bien à plat sur le dos, quelle que soit sa gêne respiratoire, pour la calmer"
    ],
    correct: 1,
    expl: "Un gonflement rapide du visage associé à une gêne respiratoire après des piqûres évoque une <strong>réaction allergique sévère (anaphylaxie)</strong>, une urgence vitale nécessitant une alerte immédiate du 15/112 avec description précise des signes. La victime en difficulté respiratoire est installée en position semi-assise, jamais allongée à plat qui aggraverait sa gêne, et surveillée sans être laissée seule. Attendre l'aggravation avant d'agir, ou se concentrer d'abord sur le reste du groupe, retarde une prise en charge qui doit être immédiate."
  },
  {
    theme: "🛡️ Sécurité / Matériel",
    q: "Avant de sortir un cheval pour une séance, l'AE remarque en sellant que la sangle présente une couture effilochée et un morceau de cuir presque coupé sur plusieurs centimètres, sans être encore rompue.",
    choices: [
      "Elle utilise la sangle telle quelle pour cette séance, la rupture n'étant pas encore complète, et prévoit de signaler l'usure après coup",
      "Elle resserre davantage la sangle que d'habitude pour compenser la zone fragilisée",
      "Elle retire immédiatement cette sangle de l'usage et la remplace par une sangle en bon état avant de seller, une sangle affaiblie pouvant céder brutalement pendant l'effort avec un risque de chute grave",
      "Elle utilise la sangle uniquement pour une séance calme au pas, jugeant le risque de rupture négligeable à cette allure"
    ],
    correct: 2,
    expl: "Une sangle visiblement affaiblie, même si elle n'est pas encore rompue, peut céder brutalement sous l'effort — y compris à des allures modérées — avec un risque de chute de la selle particulièrement grave. Le matériel défectueux doit être <strong>retiré de l'usage immédiatement</strong> et remplacé avant de seller. Resserrer davantage, utiliser « prudemment » ou se limiter au pas ne compensent pas une fragilité structurelle du cuir : seul le retrait de l'équipement garantit la sécurité."
  },
  {
    theme: "📋 Construction de séance / Public",
    q: "L'AE reçoit exceptionnellement un groupe où se mélangent des cavaliers de niveaux très différents (certains tout juste initiés, d'autres bien plus avancés), suite au regroupement de deux cours annulés.",
    choices: [
      "Elle adapte la séance en proposant des ateliers ou objectifs différenciés selon les niveaux, plutôt qu'un exercice unique inadapté à une partie du groupe, tout en maintenant une vigilance renforcée sur la sécurité de l'ensemble",
      "Elle propose le même exercice à tous, calé sur le niveau moyen du groupe, pour garder une séance simple à gérer",
      "Elle calibre toute la séance sur les cavaliers les plus avancés, les débutants devant simplement suivre du mieux qu'ils peuvent",
      "Elle annule la séance dans son ensemble, un groupe hétérogène étant selon elle impossible à encadrer en sécurité"
    ],
    correct: 0,
    expl: "Un groupe hétérogène impose d'adapter la construction de la séance aux <strong>caractéristiques réelles du public</strong> : proposer des ateliers ou objectifs différenciés permet à chacun de progresser en sécurité, plutôt qu'un exercice unique inadapté à une partie du groupe. Cela nécessite en parallèle une vigilance accrue de l'AE pour surveiller l'ensemble. Caler la séance sur un seul niveau (moyen ou avancé) expose l'autre partie du groupe, et annuler purement la séance n'est pas une réponse pédagogique adaptée à une situation qui reste gérable avec de la différenciation."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
