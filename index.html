<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 10 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>10 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une jeune diplômée, titulaire du titre Animateur d'Équitation (AE) depuis quelques mois seulement, se voit proposer par son club de devenir tuteur de stage pour une stagiaire en formation AE, en l'absence du BPJEPS habituellement en poste ce jour-là. Peut-elle accepter ce rôle de tuteur ?",
    choices: [
      "Oui, un AE peut tutorer un autre stagiaire AE dès lors qu'il a lui-même réussi son titre, quelle que soit son ancienneté",
      "Non : la fonction de tuteur de stage suppose d'être titulaire d'un diplôme d'un niveau au moins égal à celui requis pour encadrer en autonomie (BPJEPS, BEES 1er degré ou équivalent, niveau IV), ce que le titre AE (niveau 3) ne confère pas à lui seul",
      "Oui, à condition que le club l'autorise expressément par écrit dans son règlement intérieur",
      "Non, mais uniquement parce qu'elle n'a pas encore trois ans d'ancienneté dans le club"
    ],
    correct: 1,
    expl: "Le tutorat d'un stagiaire en formation suppose de détenir soi-même une qualification permettant d'encadrer en pleine autonomie pédagogique, donc a minima un diplôme de <strong>niveau IV</strong> (BPJEPS, BEES 1er degré ou équivalent). Le titre AE, de <strong>niveau 3</strong>, ne confère pas cette autonomie : son titulaire exerce lui-même sous l'autorité pédagogique d'un titulaire de niveau IV ou plus. Un AE, même diplômé, ne peut donc pas remplir la fonction de tuteur d'un autre stagiaire, quelle que soit son ancienneté ou l'accord du club."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier chute lourdement d'obstacle et reste au sol. Il est conscient, mais se plaint d'une vive douleur dans la nuque et dit ressentir des picotements dans les jambes. Il tente de se relever seul. Quelle est la conduite à tenir ?",
    choices: [
      "Tu l'aides à se relever rapidement et à s'écarter de la zone d'obstacle, la douleur s'atténuant généralement une fois debout",
      "Tu lui demandes fermement de ne pas bouger, tu stabilises sa tête dans l'axe du corps sans la mobiliser, tu le maintiens allongé et tu alertes immédiatement les secours (15/112) en signalant la suspicion de traumatisme du rachis",
      "Tu le laisses libre de ses mouvements puisqu'il est conscient et capable de parler normalement",
      "Tu l'assois contre un obstacle pour le stabiliser, en attendant de voir si la douleur persiste avant d'alerter qui que ce soit"
    ],
    correct: 1,
    expl: "Douleur cervicale associée à des picotements dans les membres après une chute évoquent une possible atteinte du <strong>rachis</strong>. Il faut demander à la victime de ne pas bouger, stabiliser manuellement sa tête dans l'axe sans la mobiliser, et alerter sans délai le <strong>15 ou le 112</strong> : mobiliser une colonne potentiellement lésée risque d'aggraver une atteinte de la moelle épinière jusqu'à la paralysie. Être conscient et parler normalement ne permet en aucun cas d'écarter ce risque."
  },
  {
    theme: "🩺 Santé / Malaise",
    q: "Une cavalière connue comme diabétique devient soudain pâle, tremblante et confuse pendant sa séance, mais reste consciente et capable d'avaler. Sa fiche sanitaire mentionne un diabète traité par insuline. Que fais-tu en priorité ?",
    choices: [
      "Tu la fais asseoir, tu l'aides à prendre immédiatement un sucre rapide (morceaux de sucre, jus de fruit, boisson sucrée), tu la surveilles étroitement et tu alertes les secours si son état ne s'améliore pas rapidement ou s'aggrave",
      "Tu la fais courir légèrement pour « faire circuler » le sucre plus vite dans son organisme",
      "Tu attends la fin de la séance pour voir si les symptômes disparaissent d'eux-mêmes avant d'agir",
      "Tu lui fais uniquement boire de l'eau claire, en attendant que les symptômes passent naturellement"
    ],
    correct: 0,
    expl: "Chez une personne diabétique consciente présentant des signes de <strong>malaise hypoglycémique</strong> (pâleur, tremblements, confusion), le geste de premiers secours est de lui faire prendre du <strong>sucre rapide</strong> et de surveiller son état, un avis médical restant nécessaire dans tous les cas. Si elle perdait connaissance, il ne faudrait surtout rien lui faire avaler (risque d'étouffement) et alerter immédiatement les secours. Attendre sans agir ou provoquer un effort physique aggrave la situation."
  },
  {
    theme: "🛣️ Sécurité / Sortie extérieure",
    q: "Une sortie en extérieur se prolonge et le groupe doit emprunter, à la tombée du jour, une portion de route ouverte à la circulation avant de rentrer au club. Que doit impérativement prévoir l'AE pour respecter les règles de circulation applicables aux cavaliers ?",
    choices: [
      "Rien de particulier n'est exigé : les cavaliers étant des usagers vulnérables, les automobilistes ont l'obligation de s'adapter dans tous les cas",
      "Le groupe doit être équipé d'un feu blanc ou jaune à l'avant et d'un feu rouge à l'arrière pour circuler de nuit, comme tout usager de la route ; le port d'éléments rétro-réfléchissants (gilet, bandes) est en complément vivement recommandé, bien que non légalement obligatoire pour le cavalier",
      "Il est interdit à un groupe de cavaliers de circuler sur une route ouverte à la circulation après le coucher du soleil, quelle que soit la signalisation",
      "Seul le port d'un gilet jaune rétro-réfléchissant est exigé par la réglementation, les feux avant/arrière n'étant obligatoires que pour les véhicules hippomobiles"
    ],
    correct: 1,
    expl: "Pour circuler de nuit sur une voie ouverte à la circulation, chevaux et cavaliers doivent être signalés par un <strong>feu blanc ou jaune à l'avant</strong> et un <strong>feu rouge à l'arrière</strong>, comme tout usager de la route. Le port de vêtements ou bandes rétro-réfléchissants est fortement recommandé pour la visibilité, mais n'est pas, à la différence des feux, une obligation légale en tant que telle pour le cavalier."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un poney d'école boite légèrement après la séance. Une AE expérimentée pense reconnaître les symptômes d'un abcès de pied qu'elle a déjà vu plusieurs fois, et propose de percer elle-même l'abcès et d'administrer un anti-inflammatoire qu'elle a sous la main, sans en référer à personne. Est-ce conforme ?",
    choices: [
      "Oui, l'entretien et le bien-être des chevaux relevant du champ d'action de l'AE, elle peut réaliser tout acte de soin qu'elle estime maîtriser",
      "Non : établir un diagnostic, réaliser un acte de chirurgie (même mineur) ou administrer un traitement médicamenteux relève de la médecine et de la chirurgie vétérinaires ; en dehors des soins d'usage courant, l'AE doit faire appel à un vétérinaire, sous peine d'exercice illégal de la médecine vétérinaire",
      "Oui, à condition d'informer le responsable du club après coup",
      "Non, uniquement si le poney appartient à un propriétaire extérieur au club et non à la structure elle-même"
    ],
    correct: 1,
    expl: "Le pansage, l'observation et les soins d'usage courant relèvent bien du champ d'action de l'AE. Mais poser un diagnostic, pratiquer un acte de chirurgie (percer un abcès) ou administrer un traitement médicamenteux sont des actes réservés aux <strong>vétérinaires</strong> : les pratiquer sans en avoir le titre constitue un <strong>exercice illégal de la médecine et de la chirurgie des animaux</strong>, passible de sanctions pénales, quelle que soit l'expérience personnelle de l'AE ou le statut du cheval concerné."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier connu pour une allergie sévère aux piqûres de guêpe se fait piquer pendant les soins. Quelques minutes plus tard, son visage gonfle, il a du mal à respirer et se sent défaillir. Sa fiche sanitaire signale un Projet d'Accueil Individualisé (PAI) avec un stylo auto-injecteur d'adrénaline dans son sac. Que fais-tu ?",
    choices: [
      "Tu attends de voir si les symptômes s'atténuent avant d'envisager quoi que ce soit, l'adrénaline étant réservée aux professionnels de santé",
      "Tu alertes immédiatement le 15 ou le 112, et conformément au PAI, tu administres (ou l'aides à administrer) le stylo auto-injecteur d'adrénaline prescrit, sans attendre l'arrivée des secours, tant les signes de choc allergique sévère peuvent engager le pronostic vital très rapidement",
      "Tu l'installes en position assise et tu lui fais avaler un comprimé antihistaminique, seul geste autorisé en l'absence de personnel médical",
      "Tu appelles uniquement les parents pour obtenir leur accord oral avant tout geste, y compris avant d'alerter les secours"
    ],
    correct: 1,
    expl: "Face à des signes de <strong>choc anaphylactique</strong> (gonflement, détresse respiratoire, malaise) chez une personne dont le PAI prévoit un stylo auto-injecteur d'adrénaline, l'urgence vitale impose d'alerter immédiatement le <strong>15/112</strong> ET d'administrer sans délai l'adrénaline prescrite, sans attendre les secours ni un accord parental téléphonique : c'est précisément l'objet du PAI que de permettre ce geste par un adulte non soignant formé. Un comprimé antihistaminique est totalement insuffisant face à un choc anaphylactique."
  },
  {
    theme: "📋 Construction de séance",
    q: "Un formateur demande à une stagiaire AE pourquoi sa fiche de séance, bien qu'elle contienne un déroulé d'exercices détaillé, est jugée incomplète pour être validée en vue d'une mise en situation pédagogique. Que lui manque-t-il le plus probablement ?",
    choices: [
      "Rien, un déroulé d'exercices précis suffit à lui seul à constituer une fiche de séance valable",
      "Les objectifs pédagogiques poursuivis, les caractéristiques du public visé (âge, niveau, effectif) et les points de vigilance liés à la sécurité (matériel, lieu, adaptations prévues) : une fiche de séance ne se limite pas à un enchaînement d'exercices",
      "Uniquement la météo du jour, seul élément réellement exigé en complément du déroulé",
      "La signature du propriétaire des chevaux utilisés pendant la séance"
    ],
    correct: 1,
    expl: "Une fiche de séance complète articule les <strong>objectifs pédagogiques</strong> visés, les <strong>caractéristiques du public</strong> (âge, niveau, effectif, particularités éventuelles), le déroulé des situations d'apprentissage ET les <strong>points de sécurité</strong> (matériel, lieu de pratique, adaptations prévues en cas d'imprévu). Un simple enchaînement d'exercices, aussi précis soit-il, ne suffit pas à démontrer la capacité à construire une séance sécurisée et adaptée à un public donné."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Une mineure licenciée pratique une séance de voltige équestre (exercices de gymnastique sur le dos du cheval, au pas puis au trot, tenu en longe). Le port du casque aux normes, obligatoire pour tous les cavaliers mineurs, s'applique-t-il de la même façon à cette discipline ?",
    choices: [
      "Oui, sans aucune exception : tout mineur pratiquant une activité équestre, quelle qu'elle soit, doit obligatoirement porter un casque aux normes en vigueur",
      "Non : la voltige équestre constitue une exception reconnue à l'obligation de port du casque pour les mineurs, notamment parce que le casque gênerait les figures réalisées en position debout ; un tapis de réception amorti compense l'absence de casque en cas de chute",
      "Non, mais uniquement à partir d'un certain niveau technique en voltige, les débutants restant soumis à l'obligation",
      "Oui, mais seulement si la voltige est pratiquée au trot ou au galop ; au pas, le casque n'est jamais requis quelle que soit la discipline"
    ],
    correct: 1,
    expl: "Le port du casque aux normes est obligatoire pour tous les cavaliers mineurs, à l'exception notable de la <strong>voltige équestre</strong>, où le casque gênerait la réalisation des figures debout sur le dos du cheval ; le meneur reste attentif au comportement du cheval en longe et un tapis de réception amorti les chutes. C'est une exception précise à connaître, propre à cette discipline, et non liée à l'allure ou au niveau technique."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "En plein été, lors d'une séance en carrière en pleine chaleur, un jeune cavalier devient soudain confus, sa peau est chaude et sèche malgré l'effort, il ne transpire presque plus et se plaint de vertiges. Que suspectes-tu et que fais-tu en priorité ?",
    choices: [
      "Une simple fatigue passagère : tu le fais souffler quelques minutes à l'ombre puis tu le remets en selle dès qu'il se sent mieux",
      "Un possible coup de chaleur : tu arrêtes immédiatement l'activité, tu le mets à l'ombre dans un lieu frais, tu retires le surplus de vêtements, tu le refroidis (eau, ventilation) et tu alertes le 15/112 devant ces signes de gravité (confusion, absence de sueur)",
      "Une déshydratation bénigne : tu le fais boire abondamment et rapidement de grandes quantités d'eau glacée, sans arrêter l'activité",
      "Tu attends la fin de la séance prévue, en réduisant simplement l'intensité des exercices, pour ne pas interrompre le groupe"
    ],
    correct: 1,
    expl: "Confusion, peau chaude et sèche, absence de transpiration et vertiges par forte chaleur sont des signes évocateurs d'un <strong>coup de chaleur</strong>, urgence pouvant engager le pronostic vital. La conduite à tenir est d'arrêter l'activité, de mettre la victime à l'ombre, de la refroidir progressivement (déshabillage partiel, eau, ventilation) et d'<strong>alerter le 15/112</strong> devant des signes de gravité comme la confusion. Poursuivre l'activité ou attendre la fin de la séance retarde une prise en charge urgente."
  },
  {
    theme: "🛡️ Sécurité / Matériel",
    q: "Juste avant le départ d'une séance, tu remarques qu'une sangle de selle présente un fil apparent très usé sur une bonne partie de sa largeur, sans être encore complètement rompue. Le cavalier, pressé, te dit qu'« elle a toujours tenu jusque-là ». Que fais-tu ?",
    choices: [
      "Tu laisses partir la séance telle quelle, une sangle usée mais non rompue restant fonctionnelle",
      "Tu retires immédiatement la sangle du service et tu la remplaces avant tout départ en activité, même si cela retarde le début de la séance : le contrôle du matériel avant chaque séance fait partie des obligations de sécurité de l'encadrant",
      "Tu doubles simplement la sangle avec une deuxième sangle par-dessus, sans retirer celle qui est usée",
      "Tu laisses le cavalier décider lui-même, puisque c'est son ressenti de confiance dans son matériel qui prime"
    ],
    correct: 1,
    expl: "La vérification de l'état du matériel (sangles, cuirs, casques, etc.) avant chaque séance fait partie intégrante des <strong>obligations de sécurité</strong> de l'encadrant : une sangle visiblement usée doit être retirée du service sans délai, quitte à retarder le départ, plutôt que d'être maintenue en service ou simplement doublée. Faire reposer cette décision sur le seul ressenti du cavalier revient à abandonner une responsabilité qui incombe à l'encadrant."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
