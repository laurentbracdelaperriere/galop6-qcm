<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 23 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>23 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un groupe de cavaliers licenciés de la structure prépare un concours amateur. Le moniteur diplômé habituellement en charge de ce créneau est absent ce jour-là, faute de personnel. Le gérant demande à l'AE d'assurer seule, « juste pour cette fois », la séance de préparation à cette épreuve amateur.",
    choices: [
      "Elle accepte, à titre exceptionnel, puisqu'il ne s'agit que d'une seule séance de remplacement",
      "Elle accepte, à condition de limiter la hauteur des obstacles travaillés",
      "Elle refuse d'assurer seule cette préparation : la pratique compétitive de niveau amateur et au-delà sort du périmètre de l'AE, qui doit toujours agir sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, sans exception ponctuelle",
      "Elle accepte, à condition d'informer les familles des cavaliers concernés avant la séance"
    ],
    correct: 2,
    expl: "Le périmètre de l'AE exclut la préparation aux <strong>pratiques compétitives de niveau amateur et au-delà</strong>, quelle que soit la durée de l'engagement. Il doit toujours agir sous l'<strong>autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, DE, DES...). L'absence ponctuelle du moniteur diplômé ne crée aucune dérogation : une séance de remplacement « juste pour cette fois » reste hors périmètre, et adapter la difficulté des obstacles ou informer les familles ne change rien à ce dépassement de compétence."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme crânien",
    q: "Pendant une reprise, un stagiaire chute de cheval et reste immobile au sol quelques secondes avant de se relever seul. Il dit ne pas se souvenir de la chute et affirme aller bien, voulant remonter tout de suite pour « ne pas perdre le fil de la séance ».",
    choices: [
      "Elle ne le fait pas remonter : une perte de connaissance, même brève, ou une amnésie de la chute impose l'arrêt de toute activité équestre pour la journée, la surveillance du stagiaire et une alerte au 15/112 pour avis médical",
      "Elle le laisse remonter immédiatement puisqu'il tient debout, marche normalement et se dit en forme",
      "Elle l'autorise à reprendre après une pause de dix minutes assis à l'ombre, le temps que les idées se remettent en place",
      "Elle lui donne à boire de l'eau sucrée et le laisse reprendre dès qu'il n'a plus de vertiges"
    ],
    correct: 0,
    expl: "Une chute suivie d'une <strong>perte de connaissance ou d'une amnésie des faits</strong>, même brève, évoque un traumatisme crânien potentiellement grave, y compris quand la personne se relève seule et se dit en forme (l'aggravation peut être différée). La conduite adaptée est d'arrêter toute activité équestre pour la journée, de surveiller le stagiaire sans le laisser seul, et d'alerter le 15/112 pour avis médical. Le sentiment subjectif d'aller bien ne permet jamais de lever cette précaution."
  },
  {
    theme: "🛡️ Sécurité / Matériel",
    q: "Juste avant un exercice de longe, l'AE remarque que la longe est effilochée sur plusieurs centimètres, à mi-longueur. Le créneau est chargé et un collègue propose de « doubler avec du ruban adhésif solide » pour ne pas prendre de retard.",
    choices: [
      "Elle accepte la réparation provisoire au ruban adhésif pour cette séance, en se disant qu'elle changera la longe le lendemain",
      "Elle utilise quand même la longe, le cheval prévu pour l'exercice étant réputé très calme",
      "Elle raccourcit la longe pour exclure la zone effilochée et l'utilise ainsi sur le reste de la séance",
      "Elle refuse d'utiliser cette longe en l'état : un matériel de sécurité endommagé est retiré immédiatement de l'usage et remplacé par un matériel en bon état, quitte à décaler légèrement le début de l'exercice"
    ],
    correct: 3,
    expl: "Une longe effilochée peut céder sous tension, en particulier lors d'un écart brusque du cheval. Un <strong>matériel de sécurité endommagé se retire immédiatement de l'usage</strong> : ni réparation de fortune (ruban adhésif), ni contournement (raccourcir la longe), ni tolérance parce que l'animal est réputé calme (un cheval calme peut avoir un écart imprévisible). Décaler légèrement le début de l'exercice pour remplacer le matériel est la seule option acceptable."
  },
  {
    theme: "🩺 Santé – Hygiène et plaies",
    q: "Pendant le pansage, un stagiaire se coupe légèrement la main sur une écharde souillée de terre et de paille. La plaie est superficielle mais sale, et il ne sait pas dire quand remonte sa dernière vaccination antitétanique.",
    choices: [
      "Comme la plaie est superficielle, elle ne fait rien de particulier et le laisse reprendre le pansage",
      "Elle nettoie et désinfecte la plaie, la protège par un pansement, et recommande une vérification du statut vaccinal antitétanique auprès d'un professionnel de santé, une plaie souillée par de la terre exposant au risque de tétanos même si elle est superficielle",
      "Elle laisse la plaie sécher à l'air libre sans la nettoyer, estimant que le contact avec l'air suffit à limiter l'infection",
      "Elle considère que seule une blessure profonde causée par un objet métallique rouillé expose réellement au tétanos, une écharde souillée de terre ne présentant selon elle aucun risque particulier"
    ],
    correct: 1,
    expl: "Le tétanos est lié à une bactérie présente dans la <strong>terre et les matières organiques</strong> (dont le fumier), et non à la seule profondeur de la plaie ou à la présence d'un objet métallique rouillé : une plaie superficielle mais souillée de terre reste à risque. La conduite adaptée est de nettoyer et désinfecter la plaie, de la protéger, et d'orienter vers une vérification du statut vaccinal antitétanique — ce n'est pas à l'AE d'évaluer seule que « ce n'est rien »."
  },
  {
    theme: "📋 Construction de séance / Sécurité climatique",
    q: "En pleine séance dans une carrière découverte, le ciel s'assombrit brutalement et un coup de tonnerre retentit au loin. La fiche de séance prévoit encore un parcours d'obstacles à terminer.",
    choices: [
      "Elle termine l'exercice en cours, considérant que l'orage semble encore éloigné, puis rentre juste après",
      "Elle réduit simplement l'allure de travail en attendant de voir si l'orage se rapproche vraiment",
      "Elle interrompt immédiatement l'activité en cours et met cavaliers et chevaux à l'abri, sans attendre la fin du parcours prévu sur la fiche de séance",
      "Elle continue normalement tant qu'il ne pleut pas encore sur la carrière"
    ],
    correct: 2,
    expl: "Un coup de tonnerre, même perçu comme lointain, signale un <strong>risque de foudre</strong> déjà présent : le danger n'attend pas la pluie ni la certitude visuelle de l'orage. La sécurité impose d'interrompre immédiatement l'activité en carrière découverte et de mettre à l'abri cavaliers et chevaux, sans chercher à terminer l'exercice prévu sur la fiche de séance ni se contenter de réduire l'allure."
  },
  {
    theme: "🚨 Conduite à tenir – Hémorragie",
    q: "À la sellerie, un stagiaire se coupe profondément l'avant-bras avec un outil tranchant ; le sang coule abondamment de la plaie.",
    choices: [
      "Elle comprime directement et fermement la plaie avec un tissu propre ou une compresse, allonge la victime si nécessaire, et alerte le 15/18/112 sans tarder, en surveillant les signes de choc",
      "Elle pose immédiatement un garrot serré au-dessus de la plaie, réflexe qu'elle juge le plus efficace pour arrêter tout saignement important",
      "Elle désinfecte d'abord soigneusement la plaie avant de la comprimer, pour éviter le risque infectieux",
      "Elle laisse saigner quelques instants pour « nettoyer » la plaie avant d'intervenir"
    ],
    correct: 0,
    expl: "Face à une <strong>hémorragie franche</strong>, le geste de premiers secours immédiat est la compression directe et manuelle de la plaie avec un tissu propre, associée à une alerte sans délai au 15/18/112 et à une surveillance des signes de choc. Le garrot n'est qu'un geste de dernier recours quand la compression est impossible ou inefficace, jamais le premier réflexe ; désinfecter avant de comprimer ou laisser saigner fait perdre un temps précieux face à une perte de sang abondante."
  },
  {
    theme: "🛡️ Sécurité / Encadrement des mineurs",
    q: "En fin de journée, tous les stagiaires ont été récupérés sauf un mineur dont les parents ont du retard. L'AE doit fermer la structure à l'heure prévue et n'a plus aucune autre tâche à effectuer sur place.",
    choices: [
      "Elle laisse le mineur partir seul, considérant qu'il habite tout près de la structure",
      "Elle confie le mineur à un autre cavalier majeur du groupe encore présent et s'en va comme prévu",
      "Elle ferme la structure à l'heure et attend avec lui à l'extérieur, sur le trottoir, jusqu'à l'heure qu'elle s'était initialement fixée",
      "Elle reste avec le mineur jusqu'à l'arrivée d'un responsable légal ou d'une personne autorisée à le récupérer, quitte à retarder la fermeture, et contacte si besoin le responsable de la structure"
    ],
    correct: 3,
    expl: "Un <strong>mineur ne doit jamais être laissé seul ou sans surveillance</strong> par l'encadrant responsable de la séance, y compris en fin de journée et même s'il habite à proximité. L'AE reste avec lui jusqu'à l'arrivée d'un responsable légal ou d'une personne dûment autorisée, en contactant si besoin le responsable de la structure ; elle ne peut ni le laisser partir seul, ni en transférer la responsabilité à un autre cavalier du groupe, ni fermer la structure en le laissant sans encadrement clair."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Une stagiaire déjà titulaire de l'AE, désormais en formation BPJEPS, anime seule une séance rémunérée pendant son stage en structure, sans qu'aucun tuteur diplômé ne soit prévu et sans convention de stage formalisée avec son organisme de formation.",
    choices: [
      "C'est conforme : être déjà titulaire de l'AE suffit à encadrer seule contre rémunération, quel que soit le contexte de formation",
      "C'est conforme dès lors qu'elle est simplement inscrite en formation BPJEPS, peu importe l'existence d'une convention ou d'un tuteur",
      "Ce n'est pas conforme : un stagiaire en formation vers un diplôme professionnel peut exercer contre rémunération pendant sa formation, mais uniquement dans le cadre d'une convention de stage prévoyant un tutorat pédagogique et technique assuré par un titulaire du diplôme visé — pas seule, sans encadrement ni convention",
      "Ce n'est jamais possible d'être rémunéré tant que le diplôme final n'est pas obtenu, même dans le cadre d'un stage conventionné avec tutorat"
    ],
    correct: 2,
    expl: "Le Code du sport prévoit qu'une personne <strong>en formation en vue d'un diplôme professionnel</strong> peut exercer contre rémunération pendant sa préparation, mais cette possibilité est encadrée : elle suppose une <strong>convention de stage</strong> et un <strong>tutorat pédagogique et technique assuré par un titulaire du diplôme visé</strong>. Être déjà titulaire de l'AE ne suffit pas à s'affranchir de ce cadre pour une activité relevant du niveau BPJEPS, et l'absence de convention et de tuteur rend la situation non conforme, indépendamment de la seule inscription en formation."
  },
  {
    theme: "🚨 Conduite à tenir – Fracture suspectée",
    q: "Lors d'un exercice de mise à terre, un stagiaire chute au sol et se plaint d'une douleur vive au bras, qui présente une déformation visible. Il reste conscient et parle normalement.",
    choices: [
      "Elle immobilise le membre dans la position où il se trouve, sans chercher à le mobiliser ni à le redresser, rassure le stagiaire et alerte le 15/112",
      "Elle essaie doucement de redresser le bras pour évaluer l'ampleur exacte de la déformation avant d'agir",
      "Elle confectionne une attelle de fortune avec le matériel disponible avant même d'alerter les secours",
      "Elle fait marcher le stagiaire jusqu'au bureau, plus confortable, avant d'appeler qui que ce soit"
    ],
    correct: 0,
    expl: "Face à une <strong>déformation visible évocatrice de fracture</strong>, le membre ne doit jamais être mobilisé, redressé ou testé : cela peut aggraver la lésion (nerfs, vaisseaux) et la douleur. Le bon geste est de laisser le membre dans la position trouvée, de rassurer la victime sans la faire se déplacer inutilement, et d'alerter le 15/112 sans délai. Une attelle de fortune improvisée avant l'alerte fait perdre du temps utile et n'est pas un geste de premiers secours prioritaire pour un secouriste non formé à ce geste précis."
  },
  {
    theme: "🛡️ Sécurité collective / Cavalerie",
    q: "Avant une séance, l'AE remarque qu'un cheval prévu au programme boite nettement au pas pendant le pansage. Le responsable de cavalerie, diplômé, est injoignable dans l'immédiat.",
    choices: [
      "Elle attend impérativement l'autorisation du responsable de cavalerie avant de retirer le cheval, quitte à retarder toute la séance",
      "Elle utilise quand même le cheval en réduisant les allures demandées pendant la séance",
      "Elle remplace discrètement le cheval par un autre sans en informer personne, y compris après la séance",
      "Elle retire d'elle-même ce cheval de la séance sans attendre de validation, en informe le responsable dès qu'il est joignable, et prévoit une solution de remplacement : écarter un animal manifestement inapte est une mesure de sécurité immédiate qui relève de sa responsabilité directe"
    ],
    correct: 3,
    expl: "Écarter un cheval manifestement inapte à l'effort est une <strong>mesure de sécurité immédiate</strong> que l'AE peut et doit prendre seule, sans attendre de validation, contrairement à une décision structurelle comme la vente d'un animal qui relève, elle, du responsable diplômé. Utiliser quand même le cheval, même à allure réduite, ou attendre une autorisation avant d'écarter un danger identifié, fait courir un risque évitable ; informer le responsable après coup reste indispensable pour assurer le suivi et la traçabilité."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du matériel, hygiène, construction de séance : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
