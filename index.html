<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 2 septembre 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>2 septembre 2026 · 20 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 20</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:5%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement – Autorité pédagogique",
    q: "Pour une sortie en extérieur avec un groupe de mineurs, le club indique qu'un moniteur BPJEPS est bien « présent » ce jour-là, mais celui-ci reste enfermé dans son bureau administratif, injoignable et sans aucun lien avec le déroulement de la sortie pendant toute sa durée.",
    choices: [
      "Elle part en sortie sans s'interroger davantage, la simple présence d'un titulaire de diplôme de niveau IV dans l'enceinte du club suffisant à couvrir toute activité équestre",
      "Elle vérifie que ce titulaire reste réellement en mesure d'exercer une autorité pédagogique effective sur la sortie (joignable, capable d'intervenir rapidement en cas de besoin) ; à défaut, elle signale la situation avant de partir plutôt que de partir quand même",
      "Elle part, à condition de prendre elle-même une trousse de secours plus complète que d'habitude",
      "Elle part, mais raccourcit simplement l'itinéraire prévu pour rester plus proche du club"
    ],
    correct: 1,
    expl: "L'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus (Code du sport, art. L.212-1 et s.) doit être <strong>effective</strong> : une présence purement nominale, sans lien ni capacité d'intervention réelle avec l'activité en cours, ne suffit pas à la caractériser. Ni une trousse de secours renforcée ni un itinéraire raccourci ne remplacent cette exigence."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion de traumatisme du rachis",
    q: "Après une chute où le cavalier est resté immobile un instant en se plaignant de douleurs dans le dos et le cou dès qu'il tente de bouger, il est conscient et respire normalement.",
    choices: [
      "Elle l'aide à se relever doucement pour l'éloigner de la piste, puis évalue la douleur une fois assis en sécurité",
      "Elle lui demande de rester strictement immobile dans la position où il se trouve, évite toute mobilisation de la tête, du cou ou du tronc, ne retire pas son casque sauf nécessité vitale, et alerte immédiatement les secours",
      "Elle retire d'emblée le casque et le gilet de protection pour mieux évaluer l'état du dos",
      "Elle le fait asseoir contre un obstacle proche pour qu'il soit plus confortable en attendant les secours"
    ],
    correct: 1,
    expl: "Face à une douleur rachidienne après chute, la règle est de <strong>ne pas mobiliser</strong> la victime (ni la relever, ni l'asseoir, ni la déplacer) sauf danger immédiat, pour ne pas aggraver une éventuelle lésion de la colonne ; le casque n'est retiré qu'en cas de nécessité vitale. On alerte les secours sans attendre et on ne mobilise pas la personne pour son confort."
  },
  {
    theme: "🐴 Conduite à tenir – Coup de chaleur chez le cheval",
    q: "Après un travail soutenu par forte chaleur, un cheval présente une respiration très rapide et superficielle qui ne redescend pas après l'arrêt de l'effort, transpire abondamment et a les muqueuses très rouges.",
    choices: [
      "Elle le fait repartir doucement au pas pour « faire circuler » et accélérer sa récupération",
      "Elle arrête tout effort, l'emmène à l'ombre, le refroidit progressivement par aspersions d'eau fraîche répétées sur l'encolure et les membres, et alerte le vétérinaire si l'état ne s'améliore pas rapidement",
      "Elle le laisse simplement au repos dans son box fermé, sans ventilation ni eau, en attendant que ça passe",
      "Elle le couvre d'une couverture pour l'aider à « transpirer davantage et évacuer sa chaleur »"
    ],
    correct: 1,
    expl: "Un coup de chaleur chez le cheval (respiration rapide persistante, transpiration abondante, muqueuses très rouges) impose d'arrêter l'effort, de le mettre à l'ombre et de le refroidir progressivement par aspersions répétées, en alertant le vétérinaire si l'amélioration n'est pas rapide. Reprendre l'effort, l'enfermer sans intervention, ou le couvrir d'une couverture (qui retient la chaleur) aggravent la situation."
  },
  {
    theme: "🚨 Conduite à tenir – Cheval emballé en extérieur",
    q: "Lors d'une randonnée, le cheval d'une cavalière s'emballe soudainement et part au triple galop droit devant, hors de vue, pendant que le reste du groupe continue d'avancer sur le chemin.",
    choices: [
      "Elle part immédiatement seule au galop à la poursuite de la cavalière emballée, laissant le reste du groupe continuer sans encadrement",
      "Elle arrête et sécurise d'abord le reste du groupe (halte en sécurité, encadrants ou cavaliers confirmés restant avec eux) avant d'organiser la suite (alerte, recherche), plutôt que de laisser le groupe sans surveillance pour partir seule",
      "Elle continue la randonnée normalement avec le reste du groupe, en supposant que le cheval emballé finira par s'arrêter seul",
      "Elle demande au cavalier le plus jeune du groupe de partir au galop pour rattraper la cavalière"
    ],
    correct: 1,
    expl: "Face à un cheval emballé hors de vue, le réflexe de sécurité est d'abord de <strong>sécuriser le reste du groupe</strong> avant d'agir, pour ne pas transformer un incident isolé en danger collectif par absence d'encadrement. Partir seule en laissant le groupe sans surveillance, ou envoyer un jeune cavalier au galop, aggrave le risque."
  },
  {
    theme: "⚖️ Réglementation encadrement – Image des mineurs",
    q: "Le gérant du club demande à l'AE de publier, sur la page réseaux sociaux publique du centre équestre, des photos prises pendant la séance où plusieurs mineurs sont clairement identifiables, « pour la communication ».",
    choices: [
      "Elle publie les photos sans délai, l'inscription au club valant accord implicite pour ce type d'usage",
      "Elle publie les photos, à condition de flouter uniquement les visages des cavaliers qui semblent les plus jeunes",
      "Elle vérifie qu'une autorisation écrite préalable des représentants légaux couvre bien cet usage précis des images ; à défaut, elle ne publie pas les photos identifiables de mineurs",
      "Elle publie les photos, en ajoutant une légende invitant les familles à demander leur retrait si elles ne sont pas d'accord"
    ],
    correct: 2,
    expl: "L'utilisation de l'image de mineurs identifiables suppose une autorisation écrite préalable et spécifique de leurs représentants légaux : l'inscription au club ne vaut pas consentement implicite, un floutage partiel improvisé n'est pas une garantie suffisante, et publier puis attendre une éventuelle demande de retrait inverse la logique du consentement préalable."
  },
  {
    theme: "🚨 Conduite à tenir – Plaie profonde sur fil barbelé (risque tétanique)",
    q: "En dégageant du fil barbelé abîmé en bordure de pâture, un stagiaire se fait une plaie punctiforme et profonde à la main, souillée de terre ; le saignement est modéré.",
    choices: [
      "Elle désinfecte simplement la plaie en surface et la recouvre d'un pansement, sans autre démarche particulière",
      "Elle nettoie abondamment la plaie à l'eau et au savon, la désinfecte, la couvre, et oriente systématiquement vers une consultation médicale pour vérifier que la vaccination antitétanique est à jour, une plaie souillée par la terre exposant au risque de tétanos",
      "Elle laisse la plaie à l'air libre sans pansement pour qu'elle « respire » et cicatrise plus vite",
      "Elle applique un antiseptique épais directement dans la plaie profonde pour bien la « sceller »"
    ],
    correct: 1,
    expl: "Une plaie punctiforme et souillée de terre, en particulier au contact d'un objet métallique rouillé comme du fil barbelé, expose spécifiquement au risque de <strong>tétanos</strong> : au-delà du nettoyage et de la désinfection, une consultation médicale s'impose pour vérifier le statut vaccinal antitétanique. Un simple pansement, une plaie souillée laissée à l'air libre, ou vouloir « sceller » une plaie profonde ne répondent pas à ce risque spécifique."
  },
  {
    theme: "🛡️ Sécurité du lieu – Matériel d'attache défectueux",
    q: "En allant chercher une longe pour attacher un cheval aux barres d'attache, l'AE remarque qu'elle est effilochée sur plusieurs brins et que son mousqueton reste parfois bloqué en position ouverte.",
    choices: [
      "Elle l'utilise quand même pour cette fois, en surveillant le cheval de plus près pendant qu'il est attaché",
      "Elle écarte immédiatement cette longe de l'usage, la remplace par du matériel en bon état avant d'attacher le cheval, et signale le matériel défectueux pour qu'il soit réparé ou jeté",
      "Elle double la longe effilochée avec une seconde longe en bon état pour sécuriser l'attache",
      "Elle l'utilise uniquement pour attacher les chevaux réputés les plus calmes du club"
    ],
    correct: 1,
    expl: "Un matériel d'attache visiblement dégradé (longe effilochée, mousqueton qui ne verrouille plus) peut céder ou se libérer de façon imprévisible : il doit être retiré de l'usage sans délai, quel que soit le cheval concerné ou le temps d'utilisation prévu, et non « doublé » ou utilisé « juste pour cette fois »."
  },
  {
    theme: "📋 Construction de séance – Cheval inadapté au niveau",
    q: "Plusieurs chevaux habituels étant indisponibles, l'AE se voit proposer, pour un cavalier grand débutant, un cheval habituellement réservé aux cavaliers confirmés car réputé sensible et réactif aux aides.",
    choices: [
      "Elle accepte ce cheval pour la séance, en resserrant simplement sa surveillance et en restant plus proche du cavalier que d'habitude",
      "Elle accepte, mais réduit la séance à la seule marche au pas en longe tenue par elle-même du début à la fin",
      "Elle n'utilise pas ce cheval pour ce cavalier compte tenu de l'inadéquation de niveau, et cherche une solution adaptée (autre monture disponible, report, contenu de séance différent) plutôt que de composer avec un cheval inadapté",
      "Elle accepte le cheval, en abrégeant simplement la durée de la séance pour limiter les risques"
    ],
    correct: 2,
    expl: "L'adéquation entre le niveau du cavalier et le tempérament du cheval est une condition de sécurité de base : un cheval réputé sensible pour un grand débutant reste un risque même sous surveillance renforcée, en longe ou sur une durée réduite. L'AE recherche une solution réellement adaptée plutôt que de compenser une inadéquation par de simples ajustements de surface."
  },
  {
    theme: "🚨 Conduite à tenir – Crise d'angoisse après une frayeur",
    q: "Après un écart brutal de son cheval qui lui a fait très peur sans le désarçonner, une stagiaire se met à respirer très vite, dit avoir une sensation d'oppression dans la poitrine et des fourmillements dans les mains, sans avoir été blessée physiquement.",
    choices: [
      "Elle la fait remonter aussitôt sur le cheval, considérant que reprendre immédiatement est le meilleur moyen de surmonter la peur",
      "Elle l'installe au calme et en sécurité, l'aide à ralentir sa respiration en restant avec elle et en la rassurant, surveille l'évolution, et alerte les secours si les symptômes ne s'améliorent pas rapidement ou en cas de doute sur une cause physique associée (comme une douleur thoracique persistante)",
      "Elle la laisse seule à l'écart quelques minutes pour qu'elle se calme sans être observée",
      "Elle lui fait respirer dans un sac plastique fermé hermétiquement pour stabiliser sa respiration"
    ],
    correct: 1,
    expl: "Une hyperventilation avec sensation d'oppression après une frayeur évoque le plus souvent une réaction d'angoisse aiguë : on installe la personne au calme, on l'aide à ralentir sa respiration en restant avec elle, et on surveille l'évolution, en alertant les secours en l'absence d'amélioration ou en cas de doute sur une cause physique. La renvoyer aussitôt à cheval, la laisser seule sans surveillance, ou la technique du sac plastique (déconseillée, risque de manque d'oxygène) ne sont pas des réponses adaptées."
  },
  {
    theme: "🛡️ Sécurité collective – Protection dorsale en CSO",
    q: "Un jeune cavalier inscrit dans une catégorie CSO soumise au règlement fédéral imposant le port d'un gilet de protection dorsale homologué se présente au départ sans ce gilet, expliquant qu'il « n'aime pas le porter » et qu'il n'en a jamais eu besoin jusqu'ici.",
    choices: [
      "Elle le laisse s'engager quand même, aucun accident ne lui étant jamais arrivé jusqu'à présent",
      "Elle ne le laisse pas s'engager tant que le gilet de protection dorsale homologué requis par le règlement pour sa catégorie n'est pas porté, et cherche une solution (matériel prêté, gilet du club) plutôt que de passer outre",
      "Elle le laisse s'engager, à condition qu'il monte au trot uniquement et non au galop sur le parcours",
      "Elle le laisse s'engager, en lui demandant simplement d'être plus prudent que d'habitude sur les obstacles"
    ],
    correct: 1,
    expl: "Le port d'un équipement de protection imposé par le règlement fédéral pour une catégorie donnée n'est pas négociable au motif d'une préférence personnelle ou d'une absence d'incident passé : l'AE ne laisse pas s'engager le cavalier sans cet équipement et cherche une solution matérielle plutôt que d'accepter une pratique dégradée."
  },
  {
    theme: "⚖️ Réglementation encadrement – Hors du champ de compétence",
    q: "Le propriétaire d'un cheval qui boite légèrement après la séance demande à l'AE, qui a de bonnes connaissances en anatomie équine, si un anti-inflammatoire qu'il a en réserve peut être administré au cheval « en attendant de voir ».",
    choices: [
      "Elle indique une posologie adaptée d'après ses connaissances, sous réserve que le propriétaire surveille l'évolution",
      "Elle ne se prononce pas sur un diagnostic ni sur l'administration d'un traitement au cheval, cela relevant exclusivement du vétérinaire, et oriente le propriétaire vers une consultation",
      "Elle propose d'observer le cheval au pas pendant quelques jours avant d'envisager tout traitement",

    ],
    correct: 1,
    expl: "Le diagnostic et la prescription d'un traitement à un animal relèvent exclusivement du vétérinaire ; ce n'est pas dans le champ de compétence de l'AE, quelles que soient ses connaissances personnelles. Proposer une posologie, une simple observation à la place d'un avis vétérinaire, ou superviser l'administration du produit reviennent toutes à sortir de ce champ."
  },
  {
    theme: "🚨 Conduite à tenir – Morsure de cheval",
    q: "Pendant le pansage, un cheval mord soudainement un stagiaire à l'avant-bras ; la peau est marquée mais la plaie paraît superficielle, sans saignement abondant.",
    choices: [
      "Elle désinfecte simplement la plaie et laisse le stagiaire reprendre le pansage normalement, la plaie étant superficielle",
      "Elle éloigne d'abord le cheval et sécurise le reste du groupe, nettoie et désinfecte la plaie, puis oriente systématiquement vers une consultation médicale en raison du risque infectieux d'une morsure, même superficielle en apparence",
      "Elle applique uniquement un pansement sec sans nettoyer la plaie, pour ne pas raviver la douleur",
      "Elle demande au stagiaire de surveiller lui-même l'évolution de la plaie pendant quelques jours avant de consulter si besoin"
    ],
    correct: 1,
    expl: "Une morsure animale comporte un risque infectieux important même quand la plaie paraît superficielle (flore buccale, profondeur parfois sous-estimée) : elle justifie systématiquement une consultation médicale, après avoir sécurisé la situation et nettoyé la plaie. Se contenter de désinfecter et continuer, ou différer la consultation à l'appréciation du stagiaire, est insuffisant."
  },
  {
    theme: "🩺 Hygiène – Gourdes partagées par forte chaleur",
    q: "Par forte chaleur, plusieurs stagiaires assoiffés se passent la même bouteille d'eau de main en main en buvant directement au goulot, faute d'avoir chacun leur propre gourde ce jour-là.",
    choices: [
      "Elle laisse faire tel quel, l'hydratation en période de forte chaleur primant sur toute autre considération",
      "Elle interdit purement et simplement de boire tant que chacun n'a pas sa propre gourde, quitte à retarder l'hydratation du groupe",
      "Elle veille à ce que chacun dispose autant que possible de son propre contenant (gourde nominative, gobelet à usage individuel) pour limiter le contact bouche à bouteille partagée, sans pour autant priver le groupe d'une hydratation nécessaire en attendant",
      "Elle demande aux stagiaires de s'essuyer la bouche avant chaque gorgée pour limiter la transmission"

let cur = 0, score = 0, answered = false;

function fmtScore(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score + ' / ' + Q.length;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  const finalScore = (score / Q.length) * 10;
  document.getElementById('scoreNum').textContent = fmtScore(finalScore);
  let emoji, title, msg;
  if (finalScore === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du lieu et du matériel, santé, construction de séance : tout est maîtrisé. C'est exactement la rigueur que le jury EPMSP attend de toi.";
  } else if (finalScore >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (finalScore >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (finalScore >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du lieu et du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('qScreen').classList.remove('hidden');
  render();
}

render();
</script>
