<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 18 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>18 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le moniteur BPJEPS titulaire est absent le jour d'une petite compétition club interne (parcours de sauts d'obstacles niveau Amateur). Le gérant demande à l'AE d'encadrer seule ce groupe pour la compétition, en plus de ses cours habituels d'initiation.",
    choices: [
      "C'est possible : l'AE peut encadrer n'importe quelle activité du club dès lors qu'elle est présente sur les installations, y compris une compétition",
      "Ce n'est pas possible : le titre d'AE permet d'encadrer l'initiation et la découverte des activités équestres, à l'exclusion des pratiques compétitives de niveau Amateur et au-delà, quelle que soit la disponibilité de l'AE ce jour-là",
      "C'est possible uniquement si l'AE a elle-même déjà participé à des compétitions de niveau Amateur en tant que cavalière",
      "Ce n'est pas possible seulement si des cavaliers mineurs sont engagés dans cette compétition"
    ],
    correct: 1,
    expl: "Le titre d'AE délivré par la FFE permet d'encadrer l'<strong>initiation et la découverte</strong> des activités équestres, sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus, mais <strong>à l'exclusion des pratiques compétitives de niveau Amateur et au-delà</strong>. Cette limite tient à la nature de l'activité encadrée, pas à l'expérience personnelle de l'AE, à l'âge des cavaliers, ni à l'absence ponctuelle du titulaire ce jour-là."
  },
  {
    theme: "🚨 Conduite à tenir – Suspicion de fracture",
    q: "En descendant de cheval après une chute, un stagiaire se plaint d'une vive douleur à l'avant-bras, qui présente une déformation visible et un gonflement rapide. Il demande à l'AE de « remettre l'os en place » pour voir si ça va mieux.",
    choices: [
      "L'AE tente délicatement de remettre le bras dans l'axe, pour limiter la douleur en attendant les secours",
      "L'AE ne mobilise ni ne manipule le bras déformé, l'immobilise dans la position où elle le trouve sans chercher à le redresser, et alerte le 15/112 en décrivant la déformation observée",
      "L'AE demande au stagiaire de bouger doucement les doigts pour vérifier que « ce n'est pas cassé » avant de décider s'il faut appeler les secours",
      "L'AE bande fermement le bras avec un tissu pour le maintenir bien serré en attendant les secours"
    ],
    correct: 1,
    expl: "Face à une <strong>déformation évoquant une fracture</strong>, il ne faut jamais tenter de remettre le membre dans l'axe ni le manipuler, ni demander à la victime de le mobiliser pour « tester » : ces gestes peuvent aggraver la lésion (nerfs, vaisseaux, fragments osseux). L'AE laisse le membre dans la position trouvée, évite toute manipulation ou striction serrée, et alerte le 15/112 en décrivant précisément ce qu'elle observe."
  },
  {
    theme: "🩺 Santé – Allergie sévère / choc anaphylactique",
    q: "Pendant une balade, un stagiaire connu pour une allergie sévère aux piqûres d'insectes se fait piquer par une guêpe. En quelques minutes, son visage gonfle, il a du mal à respirer et se sent mal ; sa famille a signalé qu'il porte toujours un stylo auto-injecteur d'adrénaline qui lui est prescrit.",
    choices: [
      "L'AE alerte le 15/112 sans délai, aide le stagiaire à utiliser son propre stylo auto-injecteur d'adrénaline prescrit s'il ne peut pas le faire seul, puis le maintient assis ou allongé, non isolé, en attendant les secours",
      "L'AE attend quelques minutes pour voir si les symptômes s'atténuent avant d'envisager d'alerter les secours",
      "L'AE utilise le stylo auto-injecteur d'un autre stagiaire allergique présent sur la sortie, si celui du stagiaire concerné n'est pas immédiatement accessible",
      "L'AE fait uniquement asseoir le stagiaire à l'ombre et lui fait boire de l'eau fraîche en attendant que ça passe"
    ],
    correct: 0,
    expl: "Face à des signes de <strong>choc anaphylactique</strong> (gonflement rapide, difficultés respiratoires) chez une personne connue allergique, il faut alerter le 15/112 sans délai et, si la victime dispose de son propre traitement prescrit (stylo auto-injecteur d'adrénaline) et ne peut se l'administrer seule, l'aider à l'utiliser, puis la maintenir assise ou allongée et non isolée jusqu'à l'arrivée des secours. Attendre que « ça passe seul » ou utiliser le stylo prescrit à une autre personne fait perdre un temps vital et n'est jamais approprié : un traitement n'est utilisable que pour la personne à qui il est prescrit."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "En sellant un poney juste avant la séance, l'AE remarque qu'une sangle est effilochée sur plusieurs centimètres, avec quelques fils apparents, mais semble « tenir encore » à l'œil.",
    choices: [
      "Elle utilise quand même la sangle pour cette séance, en surveillant simplement qu'elle ne casse pas, faute d'une autre disponible immédiatement",
      "Elle retire immédiatement cette sangle du service et en installe une autre en bon état avant toute mise en selle, sans utiliser un équipement dont l'intégrité est douteuse même « pour une fois »",
      "Elle réduit uniquement les allures prévues à la séance pour compenser le risque, en gardant la sangle en l'état",
      "Elle demande au cavalier le plus léger du groupe d'utiliser ce poney, pour limiter la tension sur la sangle abîmée"
    ],
    correct: 1,
    expl: "Un équipement de sécurité dont l'intégrité est visiblement compromise (sangle effilochée, fils apparents) doit être <strong>retiré du service immédiatement</strong> et remplacé avant toute mise en selle. Ni la réduction des allures, ni le choix d'un cavalier plus léger, ni une simple surveillance ne compensent le risque de rupture de la sangle en cours de séance, avec chute du cavalier et de la selle à la clé."
  },
  {
    theme: "📋 Construction de séance / Public hétérogène",
    q: "L'AE se retrouve avec un groupe très hétérogène : deux cavaliers déjà à l'aise au trot enrênés, et trois grands débutants qui découvrent tout juste les allures. La fiche de séance initialement prévue visait un objectif unique de mise en selle au trot pour tout le groupe.",
    choices: [
      "Elle cale toute la séance sur le niveau des deux cavaliers les plus avancés, les débutants devant simplement « suivre du mieux qu'ils peuvent »",
      "Elle cale toute la séance sur le niveau des trois débutants, en demandant aux cavaliers plus avancés de rester au pas toute la séance sans aucune adaptation",
      "Elle adapte sa séance en différenciant les objectifs et les ateliers selon le niveau réel de chaque sous-groupe, plutôt que de maintenir un objectif unique inadapté à une partie des cavaliers",
      "Elle annule la séance et reporte tout le groupe à une date où les niveaux seront plus homogènes"
    ],
    correct: 2,
    expl: "La <strong>prise en compte des caractéristiques du public</strong> impose d'adapter les situations d'apprentissage au niveau réel de chaque cavalier plutôt que de maintenir un objectif unique pensé pour un groupe homogène. Face à une hétérogénéité de niveau, l'AE différencie les ateliers ou les objectifs par sous-groupe : caler la séance sur les plus avancés met les débutants en danger, la caler sur les débutants seuls prive les autres d'apprentissage, et l'annulation pure n'est pas une réponse pédagogique proportionnée."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un stagiaire régulier se présente pour sa séance ; sa famille informe l'AE que son certificat médical de non contre-indication à la pratique équestre est périmé depuis quelques semaines et qu'un nouveau rendez-vous chez le médecin est prévu la semaine suivante.",
    choices: [
      "L'AE le fait participer normalement, l'ancien certificat restant valable tant qu'aucun problème de santé n'est signalé entretemps",
      "L'AE le fait participer, mais uniquement à des exercices calmes au pas, en attendant le renouvellement du certificat",
      "L'AE ne le fait pas participer à la séance tant qu'un document de non contre-indication en cours de validité n'est pas fourni à la structure, quelle que soit la bonne volonté affichée par la famille",
      "L'AE laisse la décision à la famille, qui peut autoriser oralement la pratique en attendant le nouveau certificat"
    ],
    correct: 2,
    expl: "La participation à la pratique équestre est conditionnée à la fourniture d'un document de <strong>non contre-indication médicale en cours de validité</strong>. Un certificat périmé, même avec un rendez-vous médical déjà prévu et même pour des exercices « calmes », ne permet pas la participation : ni l'accord oral de la famille, ni la bonne foi affichée ne remplacent ce document, qui doit être à jour avant toute reprise de l'activité."
  },
  {
    theme: "🚨 Conduite à tenir – Morsure",
    q: "En donnant à manger à un cheval, un stagiaire se fait mordre à la main par surprise ; la peau est marquée avec deux petites plaies punctiformes qui saignent légèrement, sans hémorragie importante.",
    choices: [
      "L'AE considère que ce n'est « qu'une petite morsure » sans gravité et ne fait rien de particulier, le saignement étant minime",
      "L'AE nettoie la plaie à l'eau et au savon, la désinfecte, la protège, surveille l'apparition de signes d'infection (rougeur, chaleur, gonflement, fièvre) dans les jours suivants et oriente vers un avis médical, une morsure comportant un risque infectieux propre même en l'absence d'hémorragie importante",
      "L'AE se contente de faire un pansement sec, sans nettoyer la plaie, pour ne pas faire encore plus mal au stagiaire",
      "L'AE couvre la plaie hermétiquement avec du sparadrap serré, sans la nettoyer, pour arrêter tout saignement résiduel"
    ],
    correct: 1,
    expl: "Une <strong>morsure</strong>, même avec un saignement minime, comporte un risque infectieux spécifique lié à la flore buccale de l'animal : la plaie doit être nettoyée à l'eau et au savon, désinfectée, protégée, puis surveillée dans les jours qui suivent (rougeur, chaleur, gonflement, fièvre), avec un avis médical recommandé. Minimiser une morsure sous prétexte d'un saignement faible, ou couvrir une plaie sans l'avoir nettoyée, laisse le risque infectieux sans réponse adaptée."
  },
  {
    theme: "🛡️ Sécurité / Conditions météo",
    q: "Un orage se rapproche pendant une séance en carrière extérieure : le ciel s'assombrit brutalement et les premiers coups de tonnerre se font entendre au loin.",
    choices: [
      "Elle continue la séance jusqu'à ce que la pluie commence réellement à tomber, le tonnerre au loin ne signifiant selon elle pas de danger immédiat",
      "Elle interrompt immédiatement la séance, fait rejoindre aux cavaliers un bâtiment fermé et sécurisé, en évitant tout abri sous un arbre isolé, et met les chevaux à l'abri en évitant de les laisser attachés près d'une clôture métallique ou d'un point d'eau",
      "Elle fait mettre pied à terre aux cavaliers, qui s'abritent sous le plus grand arbre de la carrière en attendant que l'orage passe",
      "Elle raccourcit simplement la séance de quelques minutes, en restant en carrière jusqu'à la fin de l'exercice en cours"
    ],
    correct: 1,
    expl: "Entendre le tonnerre signifie que la <strong>foudre est déjà à portée de risque</strong> : il faut interrompre l'activité sans attendre la pluie, rejoindre un bâtiment fermé plutôt qu'un simple auvent, et ne jamais s'abriter sous un arbre isolé, dont le risque de foudroiement est très supérieur à celui d'un abri en plein air. Les chevaux doivent aussi être mis à l'abri, sans rester attachés près d'un point sensible (clôture métallique, point d'eau, arbre isolé)."
  },
  {
    theme: "📋 Construction de séance",
    q: "En préparant sa fiche de séance pour un groupe de débutants découvrant le pansage et la mise en selle, l'AE hésite sur ce qu'il faut réellement y faire figurer.",
    choices: [
      "Uniquement la liste des chevaux attribués à chaque cavalier, le reste s'improvisant sur place selon l'ambiance du groupe",
      "Les objectifs pédagogiques adaptés au niveau du groupe, le déroulement et les situations d'apprentissage prévues, les points de sécurité à surveiller, et une évaluation permettant de mesurer si les objectifs ont été atteints",
      "Seulement la durée de la séance et l'horaire, le contenu pédagogique n'ayant pas besoin d'être formalisé pour un public débutant",
      "Uniquement les consignes de sécurité générales du club, communes à toutes les séances, sans les adapter à ce groupe précis"
    ],
    correct: 1,
    expl: "Une fiche de séance sert à formaliser une préparation réelle : elle doit préciser des <strong>objectifs pédagogiques adaptés au public</strong>, le déroulement et les situations d'apprentissage prévues, les points de sécurité propres à ce groupe et à cette activité, ainsi qu'une évaluation permettant de vérifier si les objectifs ont été atteints. Se limiter à la liste des chevaux, à l'horaire, ou à des consignes génériques non adaptées ne constitue pas une préparation de séance sécurisée et structurée."
  },
  {
    theme: "🚨 Conduite à tenir – Après l'intervention",
    q: "Après avoir protégé, alerté le 15/112 et pris en charge un stagiaire tombé de cheval, les secours arrivent, prennent en charge la victime et repartent avec elle vers l'hôpital. La séance reprend normalement pour le reste du groupe.",
    choices: [
      "L'incident étant clos avec le départ des secours, l'AE n'a plus rien à faire de particulier à ce sujet",
      "L'AE informe sans délai le responsable de la structure de ce qui s'est passé et consigne l'événement (circonstances, heure, mesures prises) dans un compte rendu ou un registre d'incident, en plus d'avoir alerté les secours sur le moment",
      "L'AE attend que la famille du stagiaire la contacte elle-même pour lui raconter ce qui s'est passé, sans en parler spontanément à la structure",
      "L'AE se contente d'en parler oralement à un collègue de façon informelle, sans autre trace de l'événement"
    ],
    correct: 1,
    expl: "La prise en charge immédiate (protéger, alerter, secourir) ne clôt pas la responsabilité de l'AE : il faut ensuite <strong>informer sans délai le responsable de la structure</strong> et consigner l'événement (circonstances, heure, mesures prises) dans un compte rendu ou un registre d'incident. Cette traçabilité protège la victime, l'AE et la structure, et ne doit pas être laissée à l'initiative de la famille ni reposer sur un simple échange informel entre collègues."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, gestes de premiers secours, numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
