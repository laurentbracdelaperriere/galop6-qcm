<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 21 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>21 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le titulaire du diplôme professionnel de la structure part en congés pendant trois semaines. Pendant cette période, l'AE continue seule à faire fonctionner l'intégralité du planning de cours (découverte comme initiation), sans qu'aucun autre titulaire de diplôme de niveau IV ou plus ne soit rattaché à la structure ni ne passe la superviser.",
    choices: [
      "C'est conforme : l'AE n'a besoin d'un professionnel diplômé à ses côtés qu'au moment précis de la signature de son diplôme fédéral, pas ensuite au quotidien",
      "C'est conforme tant que l'AE se limite à des séances de découverte, la présence physique constante d'un diplômé n'étant jamais exigée",
      "Ce n'est pas conforme : l'AE agit sous l'autorité pédagogique effective d'un titulaire de diplôme professionnel rattaché à la structure ; l'absence totale et prolongée de tout professionnel responsable, même pour des séances de découverte, fait disparaître cette autorité effective",
      "Ce n'est pas conforme, mais uniquement parce que la durée de trois semaines dépasse un seuil réglementaire précis fixé en jours"
    ],
    correct: 2,
    expl: "L'AE encadre sous l'<strong>autorité pédagogique effective</strong> d'un titulaire de diplôme professionnel de niveau IV ou plus rattaché à la structure. Cette autorité n'exige pas une présence physique permanente à chaque séance, mais elle suppose qu'un professionnel responsable reste identifiable et joignable au sein de la structure. Une absence totale et prolongée de tout diplômé, sans relais, fait disparaître cette autorité effective, quelle que soit la nature des séances encadrées."
  },
  {
    theme: "🚨 Conduite à tenir – Étouffement (corps étranger)",
    q: "Pendant la pause d'une sortie extérieure, un jeune stagiaire porte les mains à sa gorge, ne parvient plus ni à parler ni à tousser, et son visage commence à virer au violet.",
    choices: [
      "Elle lui donne immédiatement à boire un grand verre d'eau pour tenter de faire passer l'obstacle",
      "Elle réalise sans attendre des claques dans le dos entre les omoplates puis, si cela ne suffit pas, des compressions abdominales (manœuvre de Heimlich), tout en faisant alerter le 15/112",
      "Elle attend quelques minutes pour voir si le stagiaire parvient à se dégager seul, avant d'envisager d'intervenir",
      "Elle allonge immédiatement le stagiaire sur le dos et lui surélève les jambes, comme pour un malaise"
    ],
    correct: 1,
    expl: "Face à une <strong>obstruction complète des voies aériennes</strong> (victime qui ne peut ni parler ni tousser), le geste de premiers secours est une série de claques vigoureuses entre les omoplates, puis, en cas d'échec, des compressions abdominales (Heimlich), en alertant les secours sans délai. Donner à boire risque d'aggraver l'obstruction, et attendre fait perdre un temps vital face à une situation qui peut évoluer très vite vers l'arrêt respiratoire."
  },
  {
    theme: "🛡️ Sécurité / Matériel et harnachement",
    q: "En sellant un poney pour un cours débutants, l'AE remarque qu'un étrier présente une branche métallique légèrement tordue, rendant l'ouverture de sécurité moins franche qu'à l'habitude, sans être totalement bloquée.",
    choices: [
      "Elle laisse cet étrier en place pour la séance, l'ouverture restant partiellement possible et le public étant débutant donc peu susceptible de solliciter fortement le matériel",
      "Elle retire cet étrier de l'usage et le remplace avant la séance, car une ouverture de sécurité qui fonctionne moins franchement compromet précisément sa fonction en cas de chute avec pied resté engagé",
      "Elle force plusieurs fois la branche à la main pour tenter de la redresser puis la remet en service sans autre vérification",
      "Elle conserve l'étrier mais consigne uniquement le cavalier au pas, pensant que cela suffit à compenser le défaut"
    ],
    correct: 1,
    expl: "L'<strong>ouverture de sécurité de l'étrier</strong> a pour fonction de libérer le pied du cavalier en cas de chute, évitant qu'il ne soit traîné. Un mécanisme qui fonctionne moins franchement, même sans blocage total, ne remplit plus fiablement cette fonction et doit être retiré de l'usage avant toute nouvelle utilisation, indépendamment du niveau du public ou de l'allure prévue."
  },
  {
    theme: "🩺 Santé – Accueil et hygiène du public",
    q: "Une stagiaire mineure arrive pour une séance accompagnée d'un adulte qui n'est ni un parent ni une personne titulaire d'une autorisation écrite déposée à la structure ; aucun parent n'est joignable au moment de l'accueil.",
    choices: [
      "L'AE fait monter la mineure normalement : la présence d'un adulte accompagnateur, quel qu'il soit, suffit à couvrir l'accueil d'un mineur",
      "Elle n'engage pas la mineure dans la séance tant que l'accueil n'est pas régularisé conformément aux règles de la structure (autorisation parentale ou personne habilitée), et cherche à joindre un responsable légal avant toute activité",
      "Elle accepte de faire monter la mineure à condition que l'accompagnant signe lui-même une décharge sur place",
      "Elle demande simplement à la mineure si ses parents sont d'accord, et se contente de sa réponse orale pour démarrer la séance"
    ],
    correct: 1,
    expl: "L'<strong>accueil d'un public mineur</strong> répond à des règles précises fixées par la structure (autorisation parentale, personnes habilitées à le confier ou le récupérer) que l'AE ne peut ni juger elle-même sur simple apparence, ni contourner par une décharge improvisée signée par un tiers non habilité. Tant que la situation n'est pas régularisée avec un responsable légal, la mineure n'est pas engagée dans l'activité."
  },
  {
    theme: "📋 Construction de séance / Sécurité du lieu",
    q: "En début de séance en extérieur, l'AE observe que le ciel s'assombrit rapidement et que le tonnerre commence à gronder au loin ; le groupe est déjà en selle et prêt à partir sur un itinéraire en terrain découvert.",
    choices: [
      "Elle maintient la sortie telle que prévue sur la fiche de séance, considérant qu'un changement de programme décidé au dernier moment nuit à la cohérence pédagogique",
      "Elle adapte immédiatement la séance : annule ou modifie l'itinéraire prévu en terrain découvert, privilégie un lieu abrité, et reporte ou transforme l'activité tant que le risque orageux persiste",
      "Elle part quand même mais réduit simplement l'allure au pas, pensant que cela suffit à neutraliser le risque orageux",
      "Elle laisse chaque cavalier du groupe décider individuellement s'il souhaite partir ou rester, sans trancher elle-même pour le groupe"
    ],
    correct: 1,
    expl: "La <strong>construction d'une séance sécurisée</strong> suppose d'adapter en permanence le déroulement prévu aux conditions réelles, y compris météorologiques : un risque orageux en terrain découvert est un danger sérieux (foudre) qui impose de modifier ou reporter l'activité, quelle que soit l'allure envisagée. La fiche de séance est un cadre de préparation, pas une obligation de la suivre coûte que coûte face à un risque avéré, et la décision de sécurité du groupe relève de l'encadrant, pas de chaque cavalier individuellement."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "En dehors de ses heures salariées au sein d'un centre équestre, une AE est sollicitée directement par une famille pour donner, contre rémunération versée en son nom propre, des cours particuliers réguliers à leur enfant, sans lien avec la structure qui l'emploie.",
    choices: [
      "C'est possible, l'AE étant titulaire d'un diplôme fédéral qui l'autorise à enseigner de façon autonome et rémunérée dès lors qu'elle en a l'expérience",
      "C'est possible uniquement si les cours particuliers se limitent à des séances de découverte au pas",
      "Ce n'est pas conforme : l'enseignement contre rémunération de façon autonome est réservé aux titulaires d'un diplôme, titre ou certificat de qualification professionnelle garantissant la compétence en sécurité (Code du sport), ce que le diplôme fédéral d'AE ne constitue pas",
      "Ce n'est pas conforme, mais uniquement parce que la famille n'est pas adhérente de la structure employeuse de l'AE"
    ],
    correct: 2,
    expl: "L'article <strong>L.212-1 du Code du sport</strong> réserve l'enseignement, l'encadrement ou l'animation rémunérés d'une activité physique ou sportive aux titulaires d'un diplôme, titre à finalité professionnelle ou certificat de qualification garantissant la compétence en matière de sécurité. Le diplôme fédéral d'Animateur d'Équitation n'entre pas dans cette catégorie : il permet d'assister un professionnel diplômé au sein d'une structure, pas d'exercer en autonome rémunéré, quel que soit le niveau des séances proposées."
  },
  {
    theme: "🚨 Conduite à tenir – Malaise avec perte de connaissance",
    q: "Pendant les travaux d'écurie, un stagiaire s'effondre brutalement ; il ne répond à aucune sollicitation mais l'AE constate qu'il respire normalement en observant le soulèvement de sa poitrine.",
    choices: [
      "Elle le maintient assis, penché en avant, en lui tapotant le dos pour le faire reprendre connaissance plus vite",
      "Elle le place en position latérale de sécurité, maintient sa respiration surveillée, alerte le 15/112, et reste auprès de lui jusqu'à l'arrivée des secours",
      "Comme il respire, elle considère que la situation n'est pas grave, le laisse allongé sur le dos sans surveillance particulière et poursuit la séance avec le reste du groupe",
      "Elle lui fait immédiatement sentir un flacon d'alcool ou d'ammoniaque sous le nez pour le réveiller de force"
    ],
    correct: 1,
    expl: "Une <strong>victime inconsciente qui respire</strong> doit être placée en position latérale de sécurité (PLS), afin de dégager ses voies aériennes et d'éviter une inhalation en cas de vomissement, tout en étant surveillée en continu jusqu'à l'arrivée des secours alertés au 15/112. La laisser sur le dos sans surveillance ou tenter de la réveiller de force par des stimulations brutales n'est pas la conduite adaptée."
  },
  {
    theme: "🛡️ Sécurité collective / Organisation de l'espace",
    q: "Deux groupes montés, encadrés chacun par une personne différente, évoluent en même temps dans le même manège : l'un travaille des exercices au trot en cercle, l'autre enchaîne des barres au sol dispersées sur toute la piste, sans concertation préalable entre les deux encadrants sur le partage de l'espace.",
    choices: [
      "C'est sans problème dès lors que chaque encadrant reste concentré sur son propre groupe",
      "Les deux encadrants doivent se concerter avant et pendant la séance pour définir un partage clair de l'espace (zones, sens de circulation, priorité) afin d'éviter les collisions entre cavaliers ou avec le matériel au sol",
      "Ce n'est un problème que si les deux groupes travaillent à la même allure ; des allures différentes suppriment tout risque de croisement dangereux",
      "Il suffit que les cavaliers du groupe le plus avancé techniquement adaptent seuls leur trajectoire, sans concertation nécessaire entre encadrants"
    ],
    correct: 1,
    expl: "Le <strong>partage d'un espace de pratique</strong> par plusieurs groupes impose une concertation explicite entre les encadrants sur la répartition des zones, le sens de circulation et les priorités, afin de prévenir les collisions entre cavaliers ou avec du matériel disposé au sol. Des allures différentes ne suppriment pas ce risque, et faire reposer la sécurité sur la seule adaptation spontanée des cavaliers, sans organisation explicite, est insuffisant."
  },
  {
    theme: "🩺 Santé – Hygiène et risque de contamination",
    q: "En préparant les chevaux, l'AE remarque sur l'encolure d'un poney une zone de poils cassés en forme de cercle, sans croûte ni saignement apparent, qui pourrait évoquer une dermatose contagieuse comme la teigne.",
    choices: [
      "Comme il n'y a ni croûte ni saignement, elle considère que ce n'est qu'un frottement sans conséquence et fait toucher librement ce poney par tous les stagiaires du groupe pendant le pansage",
      "Elle signale la zone suspecte au responsable de la structure, isole ce poney des contacts rapprochés systématiques en attendant un avis, et rappelle au groupe de bien se laver les mains après tout contact avec un animal",
      "Elle traite elle-même la zone avec un produit antiseptique de sa propre initiative, sans en informer personne, et considère le sujet clos",
      "Elle retire uniquement ce poney des activités montées mais autorise sans restriction le pansage rapproché par les stagiaires les plus jeunes"
    ],
    correct: 1,
    expl: "Une lésion cutanée évocatrice d'une <strong>dermatose potentiellement contagieuse</strong> (comme la teigne, transmissible à l'humain) impose prudence : signalement au responsable de la structure, limitation des contacts rapprochés systématiques avec ce cheval en attendant un avis, et rappel des règles d'hygiène de base (lavage des mains après contact animal). L'AE n'a pas à diagnostiquer ou traiter elle-même, ni à exposer sans précaution l'ensemble du groupe, ni à retenir l'information pour elle seule."
  },
  {
    theme: "🚨 Conduite à tenir – Traumatisme crânien",
    q: "Un stagiaire à pied, non casqué au moment des faits, reçoit un coup de sabot à la tête lors d'une ruade imprévue d'un cheval ; il perd connaissance quelques secondes puis se relève de lui-même en affirmant « ça va, je n'ai rien », et souhaite reprendre immédiatement le travail avec les chevaux.",
    choices: [
      "Comme il s'est relevé seul et dit se sentir bien, l'AE le laisse reprendre normalement l'activité en cours",
      "Elle ne le laisse pas reprendre l'activité, le fait s'asseoir ou s'allonger au calme, le surveille étroitement, et alerte le 15/112 en signalant la perte de connaissance initiale, même brève, liée à un choc à la tête",
      "Elle lui demande simplement de s'asseoir cinq minutes à l'écart avant de le réintégrer à l'activité si aucun symptôme supplémentaire n'apparaît entre-temps",
      "Elle applique du froid sur la zone du choc et le renvoie se reposer seul chez lui en lui conseillant de surveiller lui-même d'éventuels symptômes"
    ],
    correct: 1,
    expl: "Toute <strong>perte de connaissance consécutive à un choc à la tête</strong>, même brève et suivie d'un réveil apparemment normal, est un signe de gravité qui impose l'alerte du 15/112 : des complications peuvent apparaître de façon différée. L'AE ne doit ni relâcher la surveillance sur la seule parole de la victime, ni la renvoyer seule évaluer elle-même ses symptômes, ni se contenter d'une pause courte avant reprise de l'activité."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Réglementation, gestes d'urgence, sécurité du matériel, hygiène, construction de séance : tout est maîtrisé. Cette rigueur-là, c'est exactement ce que le jury EPMSP veut voir en toi.";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Reprends les questions manquées à tête reposée — ce sont souvent des nuances fines de réglementation ou de gestes d'urgence, faciles à ancrer définitivement.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends en détail les questions ratées : le jury attend une réponse immédiate et sûre, sans hésitation, sur les gestes d'urgence comme sur le périmètre de l'AE.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis réels, mais encore des lacunes sur la réglementation ou la conduite à tenir en urgence. Reprends le livret pédagogique AE point par point avant la prochaine séance.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère précisément tes lacunes : périmètre de l'AE, gestes de premiers secours, sécurité du matériel, construction de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>

</html>
