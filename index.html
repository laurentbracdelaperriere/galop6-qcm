<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 7 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>7 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un cavalier confirmé souhaite être préparé par l'AE pour une compétition de CSO de niveau « Club Elite » (le plus haut échelon du circuit Club, en dessous du circuit Amateur). Le responsable de la structure te demande si tu peux prendre en charge cette préparation. Que réponds-tu ?",
    choices: [
      "Oui : la préparation à des épreuves de niveau Club, y compris Club Elite, entre dans le champ d'activité de l'AE, qui continue néanmoins d'exercer sous l'autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus",
      "Non : dès qu'un cavalier vise une compétition officielle FFE, quel qu'en soit le niveau, cela relève exclusivement d'un diplômé de niveau IV",
      "Oui, sans aucune restriction ni condition : l'AE devient totalement autonome dès qu'il s'agit d'un niveau Club",
      "Non, le référentiel de l'AE exclut toute préparation à la compétition, y compris en Club ; seule la préparation aux Galops est permise"
    ],
    correct: 0,
    expl: "La hiérarchie des circuits FFE va du <strong>Club</strong> (jusqu'à Club Elite) à l'<strong>Amateur</strong> (1 à 4) puis au <strong>Pro</strong>. Le référentiel du titre professionnel Animateur d'Équitation exclut uniquement l'encadrement des pratiques compétitives de <strong>niveau Amateur et au-delà</strong> — la préparation à des épreuves de niveau Club reste donc dans son champ, toujours sous l'<strong>autorité pédagogique d'un titulaire de diplôme de niveau IV ou plus</strong> (BPJEPS, DEJEPS...), condition qui ne disparaît jamais."
  },
  {
    theme: "📋 EPMSP",
    q: "Une stagiaire prépare le titre AE et envisage ensuite de passer un BPJEPS. Elle demande : « Si je valide mes EPMSP pour l'AE, seront-elles automatiquement valables pour mon futur BPJEPS ? »",
    choices: [
      "Oui, l'EPMSP est une validation générale, transférable à vie entre tous les diplômes et titres du sport",
      "Non : les Exigences Préalables à la Mise en Situation Pédagogique sont définies par le règlement propre à chaque diplôme ou titre ; leur validation pour l'AE ne dispense pas de satisfaire à nouveau aux EPMSP prévues par le règlement du BPJEPS",
      "Oui, mais uniquement si le BPJEPS est préparé dans le même organisme de formation que l'AE",
      "Non, car aucune EPMSP n'est jamais exigée pour un BPJEPS, ce dispositif étant réservé aux titres de niveau 3 comme l'AE"
    ],
    correct: 1,
    expl: "Le Code du sport (<strong>art. R.212-4</strong>) prévoit que les stagiaires soient placés sous l'autorité d'un tuteur et satisfassent aux EPMSP « dans les conditions fixées par le règlement de ces diplômes » : chaque diplôme ou titre définit ses propres EPMSP. Une validation obtenue pour l'AE ne vaut donc que pour ce titre — un futur BPJEPS impose de satisfaire aux EPMSP prévues par son propre règlement, même si certaines compétences se recoupent."
  },
  {
    theme: "🎓 Rémunération & carte professionnelle",
    q: "Un club te propose de remplacer un moniteur pendant deux semaines contre rémunération. Ta carte professionnelle d'éducateur sportif n'a pas encore été délivrée : tu as transmis ta déclaration mais n'as reçu aucune confirmation. Peux-tu commencer à enseigner contre rémunération dès demain ?",
    choices: [
      "Oui, la simple transmission du dossier de déclaration suffit à autoriser l'exercice contre rémunération, quelle que soit la suite donnée",
      "Oui, car un remplacement de courte durée (moins d'un mois) est dispensé de toute obligation de déclaration",
      "Non : enseigner contre rémunération une activité physique ou sportive impose d'être régulièrement déclaré auprès des services de l'État et de disposer de sa carte professionnelle d'éducateur sportif ; exercer sans cela constitue une infraction",
      "Non, uniquement parce qu'il te manque 3 ans d'ancienneté professionnelle exigés pour tout remplacement rémunéré"
    ],
    correct: 2,
    expl: "L'<strong>article L.212-1 du Code du sport</strong> réserve l'enseignement rémunéré d'une APS aux titulaires d'un diplôme régulièrement <strong>déclarés</strong> (art. L.212-11), déclaration qui donne lieu à la délivrance d'une <strong>carte professionnelle d'éducateur sportif</strong>. Exercer contre rémunération sans être déclaré est une infraction sanctionnée par l'<strong>article L.212-12</strong> (jusqu'à 1 an d'emprisonnement et 15 000 € d'amende) — l'urgence du remplacement ou la durée courte ne créent aucune dérogation."
  },
  {
    theme: "🪖 Sécurité / Équipement",
    q: "Un adulte débutant se présente pour son premier cours en sandales ouvertes, sans talon. Le port du casque n'étant pas obligatoire pour les cavaliers majeurs, penses-tu pouvoir le laisser monter tel quel ?",
    choices: [
      "Oui, car aucune règle n'impose de chaussures spécifiques aux cavaliers majeurs, seul le casque étant réglementé",
      "Non : au-delà du seul casque, la sécurité du pratiquant relève de la vigilance de l'encadrant, qui doit refuser ou adapter la pratique — chaussures fermées à talon protégeant le pied et évitant qu'il ne glisse dans l'étrier — avant toute mise en selle, quel que soit l'âge du cavalier",
      "Oui, à condition qu'il signe au préalable une décharge de responsabilité",
      "Non, mais uniquement parce que les sandales sont expressément interdites par un article du Code du sport"
    ],
    correct: 1,
    expl: "L'absence d'obligation légale de casque pour un majeur ne supprime pas l'<strong>obligation générale de sécurité des pratiquants</strong> qui incombe à l'encadrant : une tenue inadaptée (chaussure ouverte, sans talon, pouvant se coincer dans l'étrier) est un risque identifiable qu'il doit prévenir. Une décharge signée par le pratiquant n'exonère pas l'encadrant de son obligation de vigilance et de moyens."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Un cavalier reçoit un coup de sabot dans les côtes en manipulant son cheval au box. Il reste conscient mais se plaint d'une douleur intense et respire difficilement. Que fais-tu, en plus d'alerter immédiatement le 15 ?",
    choices: [
      "Tu l'installes en position assise ou demi-assise, celle qu'il trouve la moins inconfortable pour respirer, tu ne lui donnes ni à boire ni à manger, et tu le surveilles en permanence jusqu'à l'arrivée des secours",
      "Tu l'allonges systématiquement à plat dos, position universelle recommandée pour toute victime consciente d'un traumatisme",
      "Tu lui fais boire de l'eau sucrée pour compenser le choc et limiter le risque de malaise",
      "Tu vérifies toi-même par palpation si une côte est cassée avant d'alerter les secours, pour donner un bilan plus précis"
    ],
    correct: 0,
    expl: "Face à un traumatisme thoracique avec gêne respiratoire chez une victime consciente, le geste attendu est de proposer la <strong>position assise ou demi-assise</strong>, qui libère les mouvements du diaphragme, sans jamais mobiliser ou palper la zone atteinte. On ne donne <strong>ni à boire ni à manger</strong> (risque d'anesthésie/chirurgie en urgence) et on surveille en continu en attendant les secours, alertés sans délai."
  },
  {
    theme: "📞 Protocole d'alerte",
    q: "Tu appelles le 15 après la chute d'un cavalier. Le régulateur décroche. Quelles informations dois-tu impérativement lui transmettre pour une alerte efficace ?",
    choices: [
      "Uniquement le nombre de blessés : le reste sera demandé par les secours une fois sur place",
      "Ton identité et un numéro pour te rappeler, le lieu précis et son accès, la nature de l'accident, le nombre et l'état apparent des victimes, les gestes déjà réalisés — puis tu attends que le régulateur t'autorise à raccrocher",
      "Le nom complet de la victime et son numéro de licence FFE, informations indispensables pour que les secours puissent intervenir",
      "Uniquement l'adresse du centre équestre, les autres détails n'étant utiles qu'à l'arrivée des secours sur place"
    ],
    correct: 1,
    expl: "Le message d'alerte structuré (protocole enseigné en PSC1) comprend : ton identité et ton numéro de rappel, le <strong>lieu précis</strong> et les indications d'accès, la <strong>nature</strong> de l'événement, le <strong>nombre et l'état</strong> apparent des victimes, ainsi que les <strong>gestes déjà effectués</strong>. On ne raccroche jamais de sa propre initiative : c'est le régulateur qui met fin à l'appel, pouvant avoir besoin de précisions complémentaires."
  },
  {
    theme: "🩺 Santé / Hygiène",
    q: "Un club met à disposition des casques pour les cavaliers de passage qui n'en possèdent pas. Un stagiaire te demande si prêter systématiquement le même casque sans précaution particulière pose un problème. Que lui réponds-tu ?",
    choices: [
      "Non, un casque étant un équipement de protection mécanique, il ne présente aucun risque sanitaire ; seul son état structurel compte",
      "Oui : un équipement partagé en contact avec la tête peut favoriser la transmission de parasites ou d'infections cutanées (poux, teigne) entre utilisateurs successifs ; il faut utiliser un bonnet jetable ou désinfecter la coiffe entre chaque cavalier, voire privilégier un casque personnel",
      "Non, ce risque ne concerne que le matériel en contact avec les chevaux (couvertures, sangles), jamais les équipements portés par les cavaliers",
      "Oui, mais uniquement pour les enfants : les adultes ne sont pas concernés par ce type de transmission"
    ],
    correct: 1,
    expl: "Le matériel prêté en contact direct avec la peau ou le cuir chevelu peut véhiculer des <strong>parasites (poux) ou champignons (teigne)</strong> d'un utilisateur à l'autre. Les recommandations d'hygiène en centre équestre invitent à limiter les échanges de matériel et à utiliser un <strong>bonnet jetable</strong> ou une désinfection systématique de la coiffe entre deux cavaliers différents, casque personnel restant la solution la plus sûre — ce risque concerne tout public, enfant comme adulte."
  },
  {
    theme: "📋 Construction de séance",
    q: "Une vague de chaleur est annoncée (35°C) le jour de ta séance prévue à 14h avec un groupe d'enfants. En tant qu'AE responsable de la construction de ta séance, que dois-tu faire ?",
    choices: [
      "Maintenir le contenu et l'horaire prévus à l'identique : modifier une séance déjà planifiée remettrait en cause ta crédibilité pédagogique",
      "Adapter la séance aux conditions : décaler l'horaire en dehors des heures les plus chaudes si possible, alléger l'intensité de l'effort demandé aux cavaliers et aux chevaux, garantir l'accès à l'eau, et surveiller activement les signes de coup de chaleur — quitte à annuler si les conditions restent dangereuses",
      "Renforcer l'intensité de l'exercice pour terminer la séance plus vite et limiter le temps d'exposition à la chaleur",
      "Laisser chaque cavalier libre de s'arrêter quand il le souhaite, sans adapter toi-même le contenu de la séance"
    ],
    correct: 1,
    expl: "La construction d'une séance sécurisée exige de prendre en compte les <strong>caractéristiques du public et les conditions du lieu de pratique</strong>, dont la météo. Face à une forte chaleur, l'AE doit adapter horaire, intensité et hydratation, surveiller les signes de coup de chaleur chez les cavaliers comme chez les chevaux, et accepter de reporter ou d'annuler si nécessaire : la sécurité prime toujours sur le respect strict du programme prévu."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Pendant que tu donnes ta séance, un cheval se détache dans la cour et se met à galoper vers le parking où se trouvent des parents et de jeunes enfants. Quelle est ta priorité immédiate ?",
    choices: [
      "Te précipiter pour rattraper le cheval au plus vite, avant qu'il ne s'échappe complètement de la propriété",
      "Écarter et mettre en sécurité les personnes présentes sur la trajectoire du cheval (protéger), et donner l'alerte auprès de la structure, avant toute tentative de maîtriser l'animal",
      "Continuer ta séance en cours sans interrompre le travail des cavaliers dont tu as la responsabilité, le cheval en fuite ne relevant pas de ta mission",
      "Laisser les parents présents gérer eux-mêmes la situation : n'étant pas cavaliers, ils ne risquent rien face à un cheval au galop"
    ],
    correct: 1,
    expl: "Le premier réflexe de la conduite à tenir face à un danger (logique <strong>Protéger, Alerter, Secourir</strong>) est de <strong>protéger les tiers</strong> avant toute autre action, pour éviter un sur-accident : ici, écarter les personnes de la trajectoire de l'animal et donner l'alerte. Se précipiter directement sur le cheval, ou ignorer un danger visible pour des tiers au motif qu'ils ne sont pas sous ta responsabilité pédagogique directe, expose à un accident grave évitable."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Un cavalier confirmé, bénévole non rémunéré, propose d'aider ponctuellement à encadrer un groupe d'enfants pendant les vacances. Le responsable de la structure objecte qu'il ne peut pas intervenir sans un contrôle préalable. A-t-il raison ?",
    choices: [
      "Non, le contrôle d'honorabilité ne concerne que les éducateurs rémunérés titulaires d'un diplôme, jamais les bénévoles",
      "Oui : toute personne exerçant une fonction d'encadrement, d'enseignement ou d'animation sportive auprès de mineurs, rémunérée ou bénévole, fait l'objet d'un contrôle d'honorabilité automatique (consultation notamment du fichier judiciaire des auteurs d'infractions sexuelles ou violentes) organisé par l'État, avant toute intervention",
      "Non, ce contrôle ne s'applique qu'aux structures accueillant plus de 20 mineurs simultanément",
      "Oui, mais uniquement si le bénévole encadre plus d'une fois par semaine ; une intervention ponctuelle en est dispensée"
    ],
    correct: 1,
    expl: "L'<strong>article L.212-9 du Code du sport</strong> prévoit un contrôle systématique de l'honorabilité de toute personne exerçant, à titre principal ou secondaire, habituel ou occasionnel, <strong>rémunéré ou bénévole</strong>, une fonction d'enseignement, d'animation ou d'encadrement sportif — renforcé pour le public mineur, avec consultation du <strong>FIJAISV</strong>. Ni le statut bénévole, ni le caractère ponctuel de l'intervention, ni la taille de la structure ne dispensent de ce contrôle."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
