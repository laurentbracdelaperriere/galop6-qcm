<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QCM EPMSP – Animateur d'Équitation – 11 août 2026</title>
  <style>
    :root {
      --primary: #3d2b1f;
      --secondary: #7a5c2e;
      --accent: #c8a06a;
      --light: #f7f2ea;
      --card: #fffcf5;
      --correct: #276843;
      --correct-bg: #e8f5ee;
      --wrong: #b0291f;
      --wrong-bg: #fdf0ee;
      --border: #e0d2bc;
      --muted: #8a7560;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--light);
      color: var(--primary);
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(160deg, var(--primary) 0%, #5c3d24 100%);
      padding: 28px 20px 24px;
      text-align: center;
      color: white;
    }
    .header-label {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 13px; opacity: 0.7; }
    .main { padding: 16px; max-width: 480px; margin: 0 auto; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 16px 0 6px;
    }
    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .theme-tag {
      display: inline-block;
      background: var(--light);
      border: 1px solid var(--border);
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .question {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .choices { display: flex; flex-direction: column; gap: 9px; }
    .choice {
      background: white;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .choice:active { opacity: 0.85; }
    .choice.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }
    .choice.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
    }
    .expl {
      display: none;
      margin-top: 16px;
      padding: 13px 15px;
      background: #fffbf0;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--primary);
    }
    .expl.show { display: block; }
    .expl strong { color: var(--secondary); }
    .btn-next {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-next.show { display: block; }
    .btn-next:active { opacity: 0.88; }
    .score-screen { display: none; }
    .score-screen.show { display: block; }
    .q-screen.hidden { display: none; }
    .score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 20px 24px;
      box-shadow: 0 2px 16px rgba(61,43,31,0.08);
      text-align: center;
    }
    .score-emoji { font-size: 52px; line-height: 1; margin-bottom: 12px; }
    .score-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--secondary));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 24px rgba(61,43,31,0.28);
    }
    .score-num { font-size: 52px; font-weight: 900; color: white; line-height: 1; }
    .score-denom { font-size: 15px; color: var(--accent); margin-top: 2px; font-weight: 600; }
    .score-title { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
    .score-msg { font-size: 15px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .btn-restart {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-restart:active { opacity: 0.88; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-label">🐴 EPMSP · AE · Mode difficile</div>
  <h1>QCM du jour</h1>
  <p>11 août 2026 · 10 questions</p>
</div>

<div class="main">
  <div class="q-screen" id="qScreen">
    <div class="progress-row">
      <span id="qLabel">Question 1 / 10</span>
      <span id="sLabel">Score : 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
    <div class="card">
      <div class="theme-tag" id="themeTag">Thème</div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choicesBox"></div>
      <div class="expl" id="expl"></div>
      <button class="btn-next" id="btnNext" onclick="goNext()">Question suivante →</button>
    </div>
  </div>

  <div class="score-screen" id="scoreScreen">
    <div class="score-card">
      <div class="score-emoji" id="scoreEmoji"></div>
      <div class="score-ring">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom">/ 10</div>
      </div>
      <div class="score-title" id="scoreTitle"></div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Recommencer le QCM</button>
    </div>
  </div>
</div>

<script>
const Q = [
  {
    theme: "⚖️ Réglementation encadrement",
    q: "La responsable du club confie à une AE l'encadrement, seule, d'un groupe de « bébés cavaliers » âgés de 4 ans, pour une séance de découverte à poney. Cette organisation est-elle conforme au champ d'action de l'AE ?",
    choices: [
      "Oui, le titre AE permet d'encadrer tous les publics sans restriction d'âge dès lors que l'activité se déroule sur structure (manège, carrière)",
      "Non : l'encadrement des enfants de moins de 6 ans (« bébés cavaliers », éveil équestre) requiert une qualification spécifique complémentaire que le titre AE seul ne confère pas ; en son absence, l'encadrement doit être assuré ou supervisé par une personne disposant de cette compétence spécifique",
      "Oui, à condition que chaque enfant soit accompagné d'un parent présent dans la carrière pendant toute la séance",
      "Non, car le titre AE interdit purement et simplement tout contact avec des enfants de moins de 6 ans, quelle que soit la formule d'encadrement retenue"
    ],
    correct: 1,
    expl: "L'encadrement de l'<strong>éveil équestre</strong> (« bébés cavaliers », moins de 6 ans) est une pratique spécifique qui suppose une compétence dédiée, distincte du titre AE. Ce dernier ne confère pas automatiquement cette qualification : sans elle, l'AE ne peut pas assurer seule ce type de séance, qui doit être conduite ou supervisée par une personne disposant de la compétence requise. La présence de parents dans la carrière ne remplace pas cette qualification."
  },
  {
    theme: "🚨 Conduite à tenir – Accident",
    q: "Pendant une séance de longe, un jeune cavalier tombe d'un poney qui a fait un écart. Il perd connaissance quelques secondes, puis se réveille, parle, mais semble confus et ne se souvient pas être tombé. Il insiste pour « remonter tout de suite, comme on dit qu'il ne faut pas perdre le geste ».",
    choices: [
      "Tu le laisses remonter immédiatement, la reprise rapide en selle après une chute étant recommandée pour ne pas installer l'appréhension",
      "Ayant perdu connaissance, même brièvement, et présentant une confusion et une amnésie de l'épisode, tu refuses qu'il remonte, tu le maintiens au repos sous surveillance, et tu alertes le 15/112 pour avis médical devant ces signes évocateurs d'un traumatisme crânien, même en l'absence de plaie visible",
      "Tu le fais boire et manger pour qu'il reprenne des forces avant de décider s'il remonte",
      "Tu attends simplement qu'il dise se sentir bien pour le laisser remonter, son propre ressenti étant le meilleur indicateur"
    ],
    correct: 1,
    expl: "Une perte de connaissance, même brève, associée à une confusion et une amnésie de l'épisode sont des signes de gravité évocateurs d'un <strong>traumatisme crânien</strong>, qui peut s'aggraver secondairement même si la victime semble aller mieux. Il faut interdire toute reprise d'activité, surveiller, ne rien faire boire ni manger (au cas où une prise en charge médicale urgente serait nécessaire), et alerter le <strong>15/112</strong>. « Ne pas perdre le geste » est ici un faux réflexe dangereux."
  },
  {
    theme: "🩺 Santé / Fiche sanitaire",
    q: "Un enfant arrive pour sa toute première séance d'équitation. En cherchant sa fiche sanitaire de liaison, l'AE réalise qu'elle n'a jamais été remplie ni signée par les parents (aucune information sur allergies, traitements en cours, contre-indications).",
    choices: [
      "L'AE fait quand même monter l'enfant, la fiche sanitaire n'étant qu'une formalité administrative sans lien direct avec la sécurité de la séance",
      "L'AE s'assure que la fiche sanitaire est complétée par les parents avant que l'enfant ne pratique ; à défaut, sauf instruction contraire de la direction, elle ne fait pas participer l'enfant à la séance, ce document conditionnant une prise en charge adaptée en cas d'incident (allergie, traitement, contre-indication)",
      "L'AE remplit elle-même la fiche à partir de ce qu'elle croit savoir sur l'enfant, pour ne pas retarder le début de la séance",
      "L'AE fait pratiquer l'enfant normalement, la fiche sanitaire ne devenant obligatoire qu'à partir de la deuxième séance"
    ],
    correct: 1,
    expl: "La fiche sanitaire de liaison renseigne des informations indispensables (allergies, traitements, contre-indications) pour réagir correctement en cas d'incident. Elle doit être renseignée par les parents <strong>avant</strong> toute pratique : en son absence, l'AE ne doit pas faire pratiquer l'enfant, sauf instruction contraire de la direction. La compléter soi-même sur la base de suppositions revient à se priver de l'information réelle qu'elle est censée garantir."
  },
  {
    theme: "🛡️ Sécurité du lieu de pratique",
    q: "Juste avant de démarrer une séance en carrière avec de jeunes cavaliers, l'AE remarque que le portail donnant sur l'aire de stockage du matériel (barres, plots métalliques) est resté ouvert, et que certains éléments dépassent légèrement sur la piste.",
    choices: [
      "Elle démarre la séance en demandant simplement aux cavaliers de faire attention à cette zone en passant",
      "Avant tout démarrage de la séance, elle sécurise la carrière : elle ferme le portail et dégage la piste de tout élément dangereux, la vérification du lieu de pratique faisant partie intégrante de sa responsabilité avant d'accueillir le public",
      "Elle laisse la situation en l'état si aucun cavalier ne prévoit de passer près de cette zone selon l'exercice prévu",
      "Elle décale simplement l'exercice de manège pour éviter la zone concernée, sans intervenir sur le portail ni le matériel"
    ],
    correct: 1,
    expl: "Le contrôle du lieu de pratique (clôtures, portails, absence d'obstacles ou d'objets dangereux sur la piste) avant l'accueil du public fait partie des <strong>obligations de sécurité</strong> de l'encadrant. Se contenter d'une consigne de vigilance orale ou de contourner la zone, sans sécuriser réellement les lieux, ne suffit pas et laisse subsister un danger pour les cavaliers comme pour les chevaux."
  },
  {
    theme: "📞 Protocole d'alerte",
    q: "Une chute avec suspicion de fracture ouverte de l'avant-bras nécessite d'alerter les secours. L'AE compose le 15. Une fois la communication établie avec le régulateur, quelles informations doit-elle impérativement transmettre ?",
    choices: [
      "Il suffit de dire « il y a un accident au club d'équitation », l'adresse étant automatiquement localisée par le service grâce au numéro appelant",
      "La localisation précise du lieu (adresse, accès), le nombre de victimes, la nature de l'accident et les signes observés (état de conscience, plaie, déformation, saignement…), puis rester en ligne et suivre les consignes du régulateur jusqu'à ce qu'il mette lui-même fin à l'appel",
      "Uniquement son propre nom et sa fonction dans le club, le régulateur se chargeant de poser ensuite toutes les questions nécessaires",
      "Le nom complet et la date de naissance de la victime en priorité, les autres informations pouvant être transmises aux secours à leur arrivée sur place"
    ],
    correct: 1,
    expl: "Un appel d'urgence efficace suit le protocole <strong>Protéger, Alerter, Secourir</strong> : donner une localisation précise et des points de repère d'accès, le nombre de victimes, la nature de l'accident et les signes observés, puis rester en ligne jusqu'à ce que le régulateur indique lui-même la fin de l'appel. La géolocalisation automatique n'est ni systématique ni suffisamment précise pour s'en remettre à elle seule, et l'identité complète de la victime n'est jamais prioritaire sur les informations médicales et de localisation."
  },
  {
    theme: "⚖️ Réglementation encadrement",
    q: "Le responsable du centre équestre demande à une AE de conduire seule, sans autre encadrant, un groupe de cavaliers débutants pour une sortie en extérieur empruntant une route ouverte à la circulation.",
    choices: [
      "Oui, sans réserve : le titre AE permet d'encadrer seul n'importe quel type de sortie, y compris sur voie publique, dès lors que le groupe est équipé des équipements de signalisation requis",
      "L'AE exerce principalement sur structure équestre (manège, carrière, rond de longe), sous l'autorité pédagogique d'un titulaire d'un diplôme de niveau IV ou plus ; l'encadrement autonome, seule, d'une sortie sur voie ouverte à la circulation avec un public débutant sort en principe de son champ d'action habituel, et il revient au club de s'assurer que cette organisation est appropriée",
      "Non, car il est interdit à quiconque d'encadrer une sortie de cavaliers débutants sur route ouverte à la circulation, quel que soit le diplôme détenu",
      "Oui, à la seule condition que l'AE ait déjà suivi une sortie similaire en tant qu'observatrice au moins une fois auparavant"
    ],
    correct: 1,
    expl: "L'AE exerce principalement sur <strong>structure équestre</strong>, sous l'autorité pédagogique d'un titulaire de diplôme de <strong>niveau IV</strong> ou plus (BPJEPS, BEES 1er degré ou équivalent). Encadrer seule, sans supervision, une sortie de débutants sur voie ouverte à la circulation sort en principe de ce champ d'action habituel : ce n'est pas une simple question d'équipement de signalisation, et il appartient au club de vérifier qu'une telle organisation reste appropriée au regard du niveau réel de responsabilité de l'AE."
  },
  {
    theme: "🚨 Conduite à tenir – Morsure",
    q: "Pendant le pansage, un poney mord un enfant à l'avant-bras. La peau est juste marquée et rougie, sans plaie ouverte visible.",
    choices: [
      "Rien de particulier n'est nécessaire puisqu'il n'y a pas de plaie ouverte visible",
      "L'AE nettoie et surveille la zone, informe les parents de l'incident et, même en l'absence de plaie ouverte, oriente vers un avis médical si des signes inhabituels apparaissent (gonflement, douleur persistante, rougeur qui s'étend) ; elle consigne également l'incident dans une déclaration d'accident",
      "Elle applique uniquement un antiseptique sans en informer qui que ce soit, l'incident étant mineur",
      "Elle renvoie l'enfant chez lui sans en informer le responsable du club ni ses parents, pour ne pas alarmer inutilement"
    ],
    correct: 1,
    expl: "Une morsure d'animal peut occasionner des lésions ou un risque infectieux non visibles immédiatement, même en l'absence de plaie ouverte. Il faut nettoyer, surveiller, informer les parents, orienter vers un avis médical en cas de signe inhabituel, et <strong>consigner l'incident</strong> (déclaration d'accident). Minimiser l'événement ou ne pas en informer les personnes concernées expose à une aggravation non détectée et engage la responsabilité de l'encadrant."
  },
  {
    theme: "📋 Construction de séance",
    q: "Une AE doit animer une séance avec un groupe hétérogène : deux cavaliers n'ayant jamais monté, deux autres pratiquant depuis un an. Elle a préparé un unique déroulé identique pour tout le groupe. Le formateur lui indique que cette préparation est insuffisante. Pourquoi ?",
    choices: [
      "Parce qu'un même déroulé, quel que soit le niveau réel de chacun, est toujours suffisant tant que l'effectif reste inférieur à 8 cavaliers",
      "Parce qu'une séance sécurisée et adaptée doit tenir compte des caractéristiques du public, y compris de son hétérogénéité : il faut différencier les objectifs, les exercices et le niveau de prise en charge sécuritaire (par exemple mener en longe les débutants) plutôt que de proposer un seul déroulé uniforme",
      "Parce qu'il est réglementairement interdit de mélanger des cavaliers de niveaux différents dans un même groupe",
      "Parce qu'il suffit d'ajouter un exercice supplémentaire à la fin de la séance pour corriger le problème"
    ],
    correct: 1,
    expl: "Construire une séance sécurisée suppose de tenir compte des <strong>caractéristiques réelles du public</strong>, y compris de son hétérogénéité de niveau : différencier objectifs, exercices et modalités de sécurité (par exemple une prise en longe pour les débutants pendant que les plus expérimentés travaillent en autonomie relative) plutôt que d'appliquer un déroulé unique à tous, qui expose les plus novices à des situations inadaptées."
  },
  {
    theme: "🛡️ Sécurité / Équipement",
    q: "Lors d'une séance adulte, un cavalier majeur refuse de mettre un casque, expliquant qu'« étant majeur et responsable de lui-même », cela ne le concerne pas. Le règlement intérieur du club, affiché à l'accueil, impose pourtant le port du casque à tous les cavaliers, sans distinction d'âge, sur l'ensemble de la structure.",
    choices: [
      "Oui, elle doit le laisser pratiquer sans casque, car la réglementation fédérale n'impose le port du casque qu'aux mineurs, un majeur pouvant légalement s'en dispenser",
      "Non : si la réglementation fédérale rend le casque obligatoire pour les mineurs, un établissement peut, par son règlement intérieur, étendre cette obligation à l'ensemble des pratiquants, y compris majeurs ; ce règlement intérieur s'impose alors à tous, et l'AE doit le faire respecter, y compris à ce cavalier majeur",
      "Non, car le port du casque est en réalité obligatoire pour tous les cavaliers sans exception, dans tous les établissements, en toutes circonstances",
      "Oui, car un règlement intérieur de club ne peut jamais aller au-delà des obligations fixées par la réglementation fédérale"
    ],
    correct: 1,
    expl: "La réglementation fédérale impose le casque aux <strong>mineurs</strong>. Mais un établissement peut, via son <strong>règlement intérieur</strong>, étendre cette obligation à tous les pratiquants, y compris les majeurs : ce règlement s'impose alors à l'ensemble des usagers de la structure, et l'AE, en tant qu'encadrante, doit le faire respecter — y compris face à un adulte invoquant sa seule responsabilité personnelle."
  },
  {
    theme: "🚨 Conduite à tenir – Incendie",
    q: "Pendant que l'AE encadre un groupe d'enfants au pansage dans l'écurie, elle constate un dégagement de fumée provenant de la sellerie attenante.",
    choices: [
      "Elle envoie un enfant vérifier l'origine de la fumée pendant qu'elle continue le pansage avec le reste du groupe",
      "Elle fait évacuer immédiatement les enfants vers un point de rassemblement sûr, à l'écart du bâtiment, donne l'alerte (18 ou 112), ne rouvre pas elle-même la porte de la sellerie si celle-ci est chaude, et n'entre pas dans un local enfumé pour tenter de sauver du matériel",
      "Elle commence par essayer d'éteindre elle-même le départ de feu avec les moyens à sa disposition, avant de songer à faire sortir les enfants",
      "Elle retourne dans la sellerie pour vérifier ce qu'il se passe avant de prévenir qui que ce soit, pour ne pas alarmer inutilement le groupe"
    ],
    correct: 1,
    expl: "Face à un départ de feu, la priorité absolue est la <strong>mise en sécurité des personnes</strong> : évacuer immédiatement vers un point de rassemblement sûr, donner l'alerte (18/112), ne pas ouvrir une porte chaude (risque d'embrasement) et ne jamais entrer dans un local enfumé pour récupérer du matériel. Envoyer un enfant en reconnaissance, tenter soi-même d'éteindre le feu avant d'évacuer, ou retarder l'alerte pour « ne pas alarmer » exposent le groupe à un risque vital évitable."
  }
];

let cur = 0, score = 0, answered = false;

function render() {
  const q = Q[cur];
  document.getElementById('themeTag').textContent = q.theme;
  document.getElementById('questionText').textContent = q.q;
  const box = document.getElementById('choicesBox');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => pick(i);
    box.appendChild(btn);
  });
  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btnNext').className = 'btn-next';
  document.getElementById('progressFill').style.width = ((cur + 1) / Q.length * 100) + '%';
  document.getElementById('qLabel').textContent = 'Question ' + (cur + 1) + ' / ' + Q.length;
  document.getElementById('sLabel').textContent = 'Score : ' + score;
  answered = false;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  document.querySelectorAll('.choice').forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  if (idx === q.correct) {
    score++;
    document.getElementById('sLabel').textContent = 'Score : ' + score;
  }
  const e = document.getElementById('expl');
  e.innerHTML = q.expl;
  e.className = 'expl show';
  const nb = document.getElementById('btnNext');
  nb.textContent = cur < Q.length - 1 ? 'Question suivante →' : 'Voir mon score →';
  nb.className = 'btn-next show';
}

function goNext() {
  cur++;
  if (cur >= Q.length) showScore();
  else render();
}

function showScore() {
  document.getElementById('qScreen').classList.add('hidden');
  document.getElementById('scoreScreen').className = 'score-screen show';
  document.getElementById('scoreNum').textContent = score;
  let emoji, title, msg;
  if (score === 10) {
    emoji = '🏆'; title = 'Score parfait !';
    msg = "Tu maîtrises les points durs de l'EPMSP : périmètre de l'AE, réglementation et conduite à tenir en cas d'accident. Tu es prête pour ta mise en situation pédagogique !";
  } else if (score >= 8) {
    emoji = '⭐'; title = 'Excellent !';
    msg = "Très solide ! Revois les quelques points manqués — souvent des nuances réglementaires fines — et tu seras fin prête pour l'EPMSP.";
  } else if (score >= 6) {
    emoji = '👍'; title = 'Bien !';
    msg = "Bonne base. Reprends les questions ratées en détail : le jury EPMSP attend une maîtrise précise du périmètre de l'AE et des gestes de premiers secours.";
  } else if (score >= 4) {
    emoji = '💪'; title = 'Pas mal !';
    msg = "Des acquis, mais encore des lacunes sur la réglementation ou la conduite à tenir en cas d'accident. Reprends le livret pédagogique AE point par point.";
  } else {
    emoji = '📚'; title = 'Continue !';
    msg = "Repère tes lacunes : périmètre de l'AE, règle P.A.S., numéros d'urgence, construction de la fiche de séance. Reviens demain avec un regard neuf !";
  }
  document.getElementById('scoreEmoji').textContent = emoji;
  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;
}

function restart() {
  cur = 0; score = 0; answered = false;
  document.getElementById('qScreen').className = 'q-screen';
  document.getElementById('scoreScreen').className = 'score-screen';
  render();
}

render();
</script>
</body>
</html>
